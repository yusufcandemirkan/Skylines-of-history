        ctx.moveTo(wx + shift - 18, wy);
        ctx.quadraticCurveTo(wx + shift - 9, wy - 5, wx + shift, wy);
        ctx.quadraticCurveTo(wx + shift + 9, wy + 5, wx + shift + 18, wy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawProvinceTerrainDecorations(prov) {
    const deco = provinceDecorations[prov.id];
    if (!deco) return;

    ctx.save();
    // River curve if present
    if (deco.river && deco.river.length >= 4) {
      const r = deco.river;
      ctx.beginPath();
      ctx.moveTo(r[0].x, r[0].y);
      ctx.bezierCurveTo(r[1].x, r[1].y, r[2].x, r[2].y, r[3].x, r[3].y);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.48)';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.45)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // Stylized Mountains, Pine Trees, Steppe Tufts
    deco.items.forEach(item => {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.scale(item.scale, item.scale);

      if (item.type === 'mountain') {
        // Stylized peak with snow cap
        ctx.beginPath();
        ctx.moveTo(-12, 7);
        ctx.lineTo(0, -11);
        ctx.lineTo(12, 7);
        ctx.closePath();
        ctx.fillStyle = 'rgba(30, 41, 59, 0.48)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Snow cap
        ctx.beginPath();
        ctx.moveTo(-4.5, -4);
        ctx.lineTo(0, -11);
        ctx.lineTo(4.5, -4);
        ctx.lineTo(1.5, -2.5);
        ctx.lineTo(-1.5, -4.5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(248, 250, 252, 0.65)';
        ctx.fill();
      } else if (item.type === 'tree') {
        // Stylized pine tree
        ctx.fillStyle = 'rgba(6, 78, 59, 0.55)';
        ctx.beginPath();
        ctx.moveTo(-6, 4);
        ctx.lineTo(0, -8);
        ctx.lineTo(6, 4);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(0, -11);
        ctx.lineTo(5, 0);
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.45)';
        ctx.fill();
      } else {
        // Steppe grass blades
        ctx.strokeStyle = 'rgba(253, 224, 71, 0.35)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(-4, 3);
        ctx.lineTo(-6, -3);
        ctx.moveTo(0, 3);
        ctx.lineTo(0, -4);
        ctx.moveTo(4, 3);
        ctx.lineTo(6, -3);
        ctx.stroke();
      }
      ctx.restore();
    });
    ctx.restore();
  }

  function drawAnimatedMarchArrow(x1, y1, x2, y2, color, labelText) {
    ctx.save();
    const dx = x2 - x1;
    const dy = y2 - y1;
    const angle = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);

    // Glowing path
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.setLineDash([12, 8]);
    ctx.lineDashOffset = -elapsed * 45;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // Arrowhead near target
    ctx.setLineDash([]);
    const headDist = Math.max(20, dist - 26);
    const hx = x1 + Math.cos(angle) * headDist;
    const hy = y1 + Math.sin(angle) * headDist;
    ctx.translate(hx, hy);
    ctx.rotate(angle);
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-10, -9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (labelText) {
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2 - 14;
      ctx.save();
      ctx.font = 'bold 11px "Inter", "Segoe UI", sans-serif';
      const tw = ctx.measureText(labelText).width + 16;
      roundRectPath(ctx, mx - tw / 2, my - 11, tw, 22, 6);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, mx, my);
      ctx.restore();
    }
  }

  function drawProvinceCenterHUD(prov, isSelected, isHovered) {
    const cx = prov.center.x;
    const cy = prov.center.y;
    const ownerCfg = (SoH.CONFIG.NATIONS && SoH.CONFIG.NATIONS[prov.owner]) || SoH.CONFIG.NATIONS.player;

    ctx.save();

    // 1. Capital Star & Nation Banner Emblem above center
    const emblemR = prov.isCapital ? 15 : 12;
    ctx.beginPath();
    ctx.arc(cx, cy - 16, emblemR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.fill();
    ctx.lineWidth = prov.isCapital ? 2.5 : 1.8;
    ctx.strokeStyle = prov.isCapital ? '#facc15' : ownerCfg.borderColor;
    ctx.stroke();

    ctx.font = prov.isCapital ? '14px sans-serif' : '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ownerCfg.bannerIcon || '🏳️', cx, cy - 15);

    if (prov.isCapital) {
      // Golden capital crown/star badge on top-right of emblem
      ctx.beginPath();
      ctx.arc(cx + 12, cy - 26, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = '#fffbeb';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('★', cx + 12, cy - 25.5);
    }

    // 2. Province Name Pill
    const shortName = prov.name.replace(/\s*\(.*?\)\s*/g, '');
    ctx.font = 'bold 11.5px "Inter", "Segoe UI", sans-serif';
    const nameW = Math.max(76, ctx.measureText(shortName).width + 18);
    const pillY = cy + 2;

    roundRectPath(ctx, cx - nameW / 2, pillY, nameW, 20, 6);
    ctx.fillStyle = isSelected
      ? 'rgba(15, 23, 42, 0.95)'
      : (isHovered ? 'rgba(15, 23, 42, 0.88)' : 'rgba(15, 23, 42, 0.78)');
    ctx.fill();
    ctx.lineWidth = isSelected ? 1.6 : 1;
    ctx.strokeStyle = isSelected ? '#facc15' : hexToRgba(ownerCfg.borderColor, 0.75);
    ctx.stroke();

    ctx.fillStyle = isSelected ? '#fef08a' : '#f8fafc';
    ctx.fillText(shortName, cx, pillY + 10.5);

    // 3. Garrison Army Badge (🛡️ 180) & Mini City Population Badge (👥 640)
    const garrison = Math.round(prov.garrison !== undefined ? prov.garrison : 150);
    const pop = Math.round(prov.population !== undefined ? prov.population : 480);

    const badgeY = pillY + 23;
    const badgeW = 98;
    roundRectPath(ctx, cx - badgeW / 2, badgeY, badgeW, 18, 5);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = 'bold 10px "Inter", "Segoe UI", sans-serif';
    ctx.fillStyle = '#fca5a5';
    ctx.textAlign = 'left';
    ctx.fillText(`🛡️${garrison}`, cx - badgeW / 2 + 5, badgeY + 9.5);

    ctx.fillStyle = '#93c5fd';
    ctx.textAlign = 'right';
    ctx.fillText(`👥${pop}`, cx + badgeW / 2 - 5, badgeY + 9.5);

    ctx.restore();
  }

  function drawCompassRose(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);

    // Outer brass ring
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, 31, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.35)';
    ctx.stroke();
    ctx.setLineDash([]);

    // 4 Cardinal Points
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 2);
      ctx.beginPath();
      ctx.moveTo(0, -29);
      ctx.lineTo(6, -6);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#facc15' : 'rgba(226, 232, 240, 0.6)';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -29);
      ctx.lineTo(-6, -6);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#ca8a04' : 'rgba(148, 163, 184, 0.45)';
      ctx.fill();
      ctx.restore();
    }

    // Labels K / G / D / B (Kuzey, Güney, Doğu, Batı)
    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 10px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', 0, -46);
    ctx.fillStyle = 'rgba(226, 232, 240, 0.6)';
    ctx.fillText('G', 0, 46);
    ctx.fillText('D', 46, 0);
    ctx.fillText('B', -46, 0);

    ctx.restore();
  }

  // ============================================================================
  // CITY BUILDER RENDERING (MODE B: 'city' - 12x12 Grid & Traffic Simulation)
  // ============================================================================

  function renderCityMode(dt) {
    const selectedId = (SoH.state && SoH.state.selectedProvinceId) || 'altin_boynuz';
    const prov = getProvince(selectedId);
    if (!prov || !prov.grid) return;

    // Reset city particles & traffic if user switched provinces
    if (lastCityProvId !== prov.id) {
      lastCityProvId = prov.id;
      vehicles.length = 0;
      smokeParticles.length = 0;
    }

    // Smooth camera interpolation
    cityCam.x = lerp(cityCam.x, cityCam.targetX, Math.min(1, dt * 12));
    cityCam.y = lerp(cityCam.y, cityCam.targetY, Math.min(1, dt * 12));
    cityCam.zoom = lerp(cityCam.zoom, cityCam.targetZoom, Math.min(1, dt * 12));

    const gridSize = (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 12;
    const boardPx = gridSize * TILE_SIZE;
    const overlayMode = (SoH.state && SoH.state.overlayMode) || 'none';
    const selectedTool = SoH.state && SoH.state.selectedTool;

    // Update hovered tile coordinates
    const cp = screenToCity(pointer.x, pointer.y);
    const gx = Math.floor(cp.x / TILE_SIZE);
    const gy = Math.floor(cp.y / TILE_SIZE);
    if (gx >= 0 && gx < gridSize && gy >= 0 && gy < gridSize) {
      if (!pointer.hoveredTile || pointer.hoveredTile.x !== gx || pointer.hoveredTile.y !== gy) {
        pointer.hoveredTile = { x: gx, y: gy };
        if (SoH.UI && typeof SoH.UI.onTileHover === 'function') {
          SoH.UI.onTileHover(gx, gy, prov.grid[gy][gx]);
        }
      }
    } else if (pointer.hoveredTile !== null) {
      pointer.hoveredTile = null;
      if (SoH.UI && typeof SoH.UI.onTileHover === 'function') {
        SoH.UI.onTileHover(-1, -1, null);
      }
    }

    // 1. Scenic Lush Countryside Background
    const bgGrad = ctx.createRadialGradient(
      width * 0.5, height * 0.5, 80,
      width * 0.5, height * 0.5, Math.max(width, height) * 0.85
    );
    bgGrad.addColorStop(0, '#14532d');
    bgGrad.addColorStop(0.65, '#0f3f22');
    bgGrad.addColorStop(1, '#072213');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(cityCam.x, cityCam.y);
    ctx.scale(cityCam.zoom, cityCam.zoom);

    // 2. Surrounding Scenic Environment (Highway Entrance on North, Coastline/River on South, Trees)
    drawCityScenicSurroundings(boardPx, prov);

    // 3. Elevated 2.5D Architectural City Board Platform Shadow & Bevel
    ctx.save();
    ctx.fillStyle = 'rgba(2, 6, 23, 0.55)';
    roundRectPath(ctx, -10, -6, boardPx + 20, boardPx + 26, 12);
    ctx.fill();

    // Stone foundation rim
    ctx.fillStyle = '#334155';
    roundRectPath(ctx, -6, -6, boardPx + 12, boardPx + 16, 8);
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 4. Base Ground Tiles & Data Overlays (Pass 1)
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const tx = x * TILE_SIZE;
        const ty = y * TILE_SIZE;

        // Lush checkerboard grass base
        const isEven = (x + y) % 2 === 0;
        ctx.fillStyle = isEven ? '#166534' : '#15803d';
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);

        // Subtle grass texture Specks
        ctx.fillStyle = 'rgba(134, 239, 172, 0.08)';
        ctx.fillRect(tx + 6, ty + 8, 3, 3);
        ctx.fillRect(tx + TILE_SIZE - 12, ty + TILE_SIZE - 10, 3, 3);

        // Data Overlay Heatmaps
        if (overlayMode !== 'none') {
          drawCellOverlayHeatmap(cell, tx, ty, overlayMode);
        }

        // Crisp grid lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
      }
    }

    // 5. Water Pipes & Utility Radiuses when in Power/Water Overlay
    if (overlayMode === 'water' || overlayMode === 'power') {
      drawUtilityNetworks(prov, gridSize, overlayMode);
    }

    // 6. Custom Detailed Procedural Buildings (Pass 2)
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const bId = getCellBuildingId(cell);
        if (!bId) continue;

        const tx = x * TILE_SIZE;
        const ty = y * TILE_SIZE;
        const level = getCellLevel(cell);

        if (bId === 'road') {
          drawRoadTile(prov.grid, x, y, tx, ty, gridSize);
        } else {
          drawProceduralBuilding(bId, level, tx, ty, x, y, cell);
        }

        // Draw Level Stars & Unpowered/Unwatered Warning Badges
        drawBuildingStatusBadges(cell, bId, level, tx, ty);
      }
    }

    // 7. Update & Render Animated Road Traffic (Cars, Buses, Trucks)
    updateAndDrawTraffic(dt, prov.grid, gridSize);

    // 8. Update & Render Rising Factory Smoke & Floating '+₺' Coins
    updateAndDrawCityParticles(dt, prov.grid, gridSize);

    // 9. Selected Tile Outline & Hovered Tile / Ghost Tool Preview
    if (pointer.selectedTile) {
      const sx = pointer.selectedTile.x * TILE_SIZE;
      const sy = pointer.selectedTile.y * TILE_SIZE;
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(sx + 1.5, sy + 1.5, TILE_SIZE - 3, TILE_SIZE - 3);
      ctx.restore();
    }

    if (pointer.hoveredTile) {
      drawHoveredTileAndToolPreview(prov, pointer.hoveredTile.x, pointer.hoveredTile.y);
    }

    ctx.restore();
  }

  function drawCityScenicSurroundings(boardPx, prov) {
    ctx.save();

    // North Interstate Highway Connection leading to tile (5, 0) / (6, 0)
    const hwyX = 5 * TILE_SIZE;
    ctx.fillStyle = '#334155';
    ctx.fillRect(hwyX, -140, TILE_SIZE * 2, 140);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hwyX, -140);
    ctx.lineTo(hwyX, 0);
    ctx.moveTo(hwyX + TILE_SIZE * 2, -140);
    ctx.lineTo(hwyX + TILE_SIZE * 2, 0);
    ctx.stroke();

    // Highway center divider & dashed lines
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(hwyX + TILE_SIZE, -140);
    ctx.lineTo(hwyX + TILE_SIZE, 0);
    ctx.stroke();
    ctx.setLineDash([]);

    // Highway welcome sign
    roundRectPath(ctx, hwyX + 12, -55, TILE_SIZE * 2 - 24, 22, 4);
    ctx.fillStyle = '#065f46';
    ctx.fill();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9.5px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(prov.name.split(' ')[0].toUpperCase() + ' OTOYOLU', hwyX + TILE_SIZE, -44);

    // Scenic Southern Coastline / Riverfront below the city board
    const waterY = boardPx + 10;
    const waterGrad = ctx.createLinearGradient(0, waterY, 0, waterY + 180);
    waterGrad.addColorStop(0, '#0284c7');
    waterGrad.addColorStop(0.3, '#0369a1');
    waterGrad.addColorStop(1, '#0c4a6e');
    ctx.fillStyle = waterGrad;
    roundRectPath(ctx, -180, waterY, boardPx + 360, 170, 24);
    ctx.fill();

    // Sandy beach / stone quay shoreline
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-150, waterY + 2);
    ctx.lineTo(boardPx + 150, waterY + 2);
    ctx.stroke();

    // Animated water waves on southern river/coast
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.35)';
    ctx.lineWidth = 1.5;
    for (let wy = waterY + 25; wy < waterY + 145; wy += 32) {
      for (let wx = -100; wx < boardPx + 100; wx += 95) {
        const shift = Math.sin(elapsed * 2 + wx * 0.03 + wy) * 6;
        ctx.beginPath();
        ctx.moveTo(wx + shift, wy);
        ctx.lineTo(wx + shift + 26, wy);
        ctx.stroke();
      }
    }

    // Surrounding pine & oak trees
    cityScenicTrees.forEach(t => {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(t.scale, t.scale);
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(3, 6, 10, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = t.shade;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(-2, -2, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  }

  function drawCellOverlayHeatmap(cell, tx, ty, mode) {
    ctx.save();
    if (mode === 'power') {
      ctx.fillStyle = cell.powered
        ? 'rgba(34, 211, 238, 0.36)'
        : 'rgba(15, 23, 42, 0.55)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'water') {
      ctx.fillStyle = cell.watered
        ? 'rgba(56, 189, 248, 0.42)'
        : 'rgba(15, 23, 42, 0.55)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'pollution') {
      const poll = clamp((cell.pollution || 0) / 50, 0, 1);
      if (poll > 0.02) {
        ctx.fillStyle = `rgba(192, 38, 211, ${0.22 + poll * 0.58})`;
      } else {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.18)';
      }
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'happiness') {
      const lv = cell.landValue !== undefined ? cell.landValue : 50;
      const poll = cell.pollution || 0;
      const net = clamp((lv - poll + 20) / 100, 0, 1);
      const r = Math.round(lerp(239, 16, net));
      const g = Math.round(lerp(68, 185, net));
      const b = Math.round(lerp(68, 129, net));
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.45)`;
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    }
    ctx.restore();
  }

  function drawUtilityNetworks(prov, gridSize, overlayMode) {
    ctx.save();
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const bId = getCellBuildingId(cell);
        const cx = (x + 0.5) * TILE_SIZE;
        const cy = (y + 0.5) * TILE_SIZE;

        if (overlayMode === 'power' && bId === 'power_plant') {
          ctx.beginPath();
          ctx.arc(cx, cy, TILE_SIZE * 4.5, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([8, 6]);
          ctx.stroke();
          ctx.fillStyle = 'rgba(250, 204, 21, 0.08)';
          ctx.fill();
        }

        if (overlayMode === 'water') {
          if (bId === 'water_tower') {
            ctx.beginPath();
            ctx.arc(cx, cy, TILE_SIZE * 4.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
            ctx.fill();
          }
          // Blue water pipes along roads
          if (bId === 'road' || cell.watered) {
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.75)';
            ctx.lineWidth = 4;
            if (x + 1 < gridSize && (getCellBuildingId(prov.grid[y][x + 1]) === 'road' || prov.grid[y][x + 1].watered)) {
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + TILE_SIZE, cy);
              ctx.stroke();
            }
            if (y + 1 < gridSize && (getCellBuildingId(prov.grid[y + 1][x]) === 'road' || prov.grid[y + 1][x].watered)) {
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx, cy + TILE_SIZE);
              ctx.stroke();
            }
          }
        }
      }
    }
    ctx.restore();
  }

  // --- Custom Procedural Artwork for All 10 Building Types ---

  function drawRoadTile(grid, gx, gy, tx, ty, gridSize) {
    const hasN = gy > 0 && getCellBuildingId(grid[gy - 1][gx]) === 'road';
    const hasS = gy < gridSize - 1 && getCellBuildingId(grid[gy + 1][gx]) === 'road';
    const hasW = gx > 0 && getCellBuildingId(grid[gy][gx - 1]) === 'road';
    const hasE = gx < gridSize - 1 && getCellBuildingId(grid[gy][gx + 1]) === 'road';

    const pad = 9;
    const roadW = TILE_SIZE - pad * 2;
    const cx = tx + TILE_SIZE / 2;
    const cy = ty + TILE_SIZE / 2;

    ctx.save();
    // Sidewalk concrete base
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(tx + 2, ty + 2, TILE_SIZE - 4, TILE_SIZE - 4);

    // Asphalt center box
    ctx.fillStyle = '#334155';
    ctx.fillRect(tx + pad, ty + pad, roadW, roadW);

    // Directional connections
    if (hasN) ctx.fillRect(tx + pad, ty, roadW, pad);
    if (hasS) ctx.fillRect(tx + pad, ty + TILE_SIZE - pad, roadW, pad);
    if (hasW) ctx.fillRect(tx, ty + pad, pad, roadW);
    if (hasE) ctx.fillRect(tx + TILE_SIZE - pad, ty + pad, pad, roadW);

    // Dashed yellow center lane markings
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    if (hasN) { ctx.moveTo(cx, ty); ctx.lineTo(cx, cy); }
    if (hasS) { ctx.moveTo(cx, cy); ctx.lineTo(cx, ty + TILE_SIZE); }
    if (hasW) { ctx.moveTo(tx, cy); ctx.lineTo(cx, cy); }
    if (hasE) { ctx.moveTo(cx, cy); ctx.lineTo(tx + TILE_SIZE, cy); }
    if (!hasN && !hasS && !hasW && !hasE) {
      ctx.moveTo(tx + pad + 4, cy);
      ctx.lineTo(tx + TILE_SIZE - pad - 4, cy);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Zebra Crosswalks at 3+ way intersections
    const connCount = (hasN ? 1 : 0) + (hasS ? 1 : 0) + (hasW ? 1 : 0) + (hasE ? 1 : 0);
    if (connCount >= 3) {
      ctx.fillStyle = 'rgba(248, 250, 252, 0.65)';
      for (let i = -9; i <= 9; i += 6) {
        if (hasN) ctx.fillRect(cx + i - 1.5, ty + 4, 3, 4);
        if (hasS) ctx.fillRect(cx + i - 1.5, ty + TILE_SIZE - 8, 3, 4);
      }
    }

    ctx.restore();
  }

  function drawProceduralBuilding(bId, level, tx, ty, gx, gy, cell) {
    ctx.save();
    const s = TILE_SIZE;

    // Base lot pavement/garden pad
    ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
    roundRectPath(ctx, tx + 3, ty + 3, s - 6, s - 6, 5);
    ctx.fill();

    switch (bId) {
      case 'residential':
        drawResidentialBuilding(tx, ty, s, level, cell && cell.powered);
        break;
      case 'commercial':
        drawCommercialBuilding(tx, ty, s, level, cell && cell.powered);
        break;
      case 'industrial':
        drawIndustrialBuilding(tx, ty, s, level);
        break;
      case 'farm':
        drawFarmBuilding(tx, ty, s, gx, gy);
        break;
      case 'power_plant':
        drawPowerPlantBuilding(tx, ty, s);
        break;
      case 'water_tower':
        drawWaterTowerBuilding(tx, ty, s);
        break;
      case 'park':
        drawParkBuilding(tx, ty, s);
        break;
      case 'university':
        drawUniversityBuilding(tx, ty, s);
        break;
      case 'barracks':
        drawBarracksBuilding(tx, ty, s);
        break;
    }
    ctx.restore();
  }

  function drawResidentialBuilding(tx, ty, s, level, powered) {
    // Lush lawn base
    ctx.fillStyle = '#22c55e';
    roundRectPath(ctx, tx + 4, ty + 4, s - 8, s - 8, 4);
    ctx.fill();

    if (level === 1) {
      // Cozy red-roof suburban houses with garden trees
      for (let i = 0; i < 2; i++) {
        const hx = tx + (i === 0 ? 8 : 30);
        const hy = ty + (i === 0 ? 12 : 24);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(hx + 2, hy + 2, 18, 18);
        // Cream walls
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(hx, hy, 18, 18);
        // Red pitched roof
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(hx - 2, hy);
        ctx.lineTo(hx + 9, hy - 7);
        ctx.lineTo(hx + 20, hy);
        ctx.lineTo(hx + 18, hy + 9);
        ctx.lineTo(hx, hy + 9);
        ctx.closePath();
        ctx.fill();
        // Warm window
        ctx.fillStyle = powered ? '#fde047' : '#475569';
        ctx.fillRect(hx + 5, hy + 11, 5, 4);
      }
      // Garden bush
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(tx + 16, ty + 42, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (level === 2) {
      // Mid-rise apartment block with balconies
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.fillRect(tx + 12, ty + 10, s - 18, s - 16);

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(tx + 9, ty + 7, s - 18, s - 16);
      ctx.fillStyle = '#0f766e';
      ctx.fillRect(tx + 9, ty + 7, s - 18, 8);

      // Balconies & glowing windows
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          ctx.fillStyle = powered ? '#fef08a' : '#334155';
          ctx.fillRect(tx + 14 + c * 11, ty + 19 + r * 9, 7, 5);
        }
      }
    } else {
      // Level 3: Tall modern glass residential skyscraper with rooftop pool
      ctx.fillStyle = 'rgba(0,0,0,0.48)';
      ctx.fillRect(tx + 13, ty + 9, s - 18, s - 14);

      const towerGrad = ctx.createLinearGradient(tx + 8, ty + 4, tx + s - 10, ty + s - 8);
      towerGrad.addColorStop(0, '#0284c7');
      towerGrad.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = towerGrad;
      roundRectPath(ctx, tx + 8, ty + 4, s - 18, s - 12, 4);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Rooftop terrace & pool
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(tx + 14, ty + 8, 14, 7);

      // Glowing luxury penthouse windows
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 3; c++) {
          ctx.fillStyle = powered ? ((r + c) % 2 === 0 ? '#fef08a' : '#bae6fd') : '#1e293b';
          ctx.fillRect(tx + 13 + c * 10, ty + 19 + r * 7, 7, 4.5);
        }
      }
    }
  }

    for (let i = 0; i < stacks; i++) {
      const sx = tx + 15 + i * 13;
      const sy = ty + 13;

      ctx.arc(sx, sy, 5.5, 0, Math.PI * 2);

  function drawFarmBuilding(tx, ty, s, gx, gy) {
    // Golden wheat field base
    ctx.fillStyle = '#ca8a04';
    roundRectPath(ctx, tx + 3, ty + 3, s - 6, s - 6, 4);
    ctx.fill();

    // Furrow rows of golden wheat
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 2.2;
    for (let ry = ty + 8; ry <= ty + s - 8; ry += 6) {
      ctx.beginPath();
      ctx.moveTo(tx + 7, ry);
      ctx.lineTo(tx + s - 22, ry);
      ctx.stroke();
    }

    // Red Barn in bottom-right
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(tx + s - 21, ty + s - 22, 15, 14);
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1;
    ctx.strokeRect(tx + s - 21, ty + s - 22, 15, 14);

    // Rotating Windmill in top-right
    const wx = tx + s - 14;
    const wy = ty + 16;
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.arc(wx, wy, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(elapsed * 2.2 + gx + gy);
    ctx.strokeStyle = '#fef9c3';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -10);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPowerPlantBuilding(tx, ty, s) {
    ctx.fillStyle = '#334155';
    roundRectPath(ctx, tx + 4, ty + 4, s - 8, s - 8, 5);
    ctx.fill();

    // Industrial Turbine Hall
    ctx.fillStyle = '#475569';
    ctx.fillRect(tx + 7, ty + 26, s - 14, 22);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(tx + 7, ty + 26, s - 14, 4);

    ctx.fillStyle = '#94a3b8';

    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();

  function drawWaterTowerBuilding(tx, ty, s) {
    ctx.fillStyle = '#0f172a';
    roundRectPath(ctx, tx + 5, ty + 5, s - 10, s - 10, 5);
    ctx.fill();

    const cx = tx + s / 2;
    const cy = ty + s / 2;

    // Animated water ripple ring
    const rippleR = 12 + ((elapsed * 14) % 14);
    const rippleAlpha = 1 - (rippleR - 12) / 14;
    ctx.strokeStyle = `rgba(56, 189, 248, ${rippleAlpha * 0.7})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(cx, cy, rippleR, 0, Math.PI * 2);
    ctx.stroke();

    // Steel support legs
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - 14, cy - 14);
    ctx.lineTo(cx + 14, cy + 14);
    ctx.moveTo(cx + 14, cy - 14);
    ctx.lineTo(cx - 14, cy + 14);
    ctx.stroke();

    // Elevated Metallic Blue Spherical Tank
    const grad = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, 16);
    grad.addColorStop(0, '#bae6fd');
    grad.addColorStop(0.5, '#0284c7');
    grad.addColorStop(1, '#0369a1');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#e0f2fe';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawParkBuilding(tx, ty, s) {
    const cx = tx + s / 2;
    const cy = ty + s / 2;

    // Lush emerald park grass
    ctx.fillStyle = '#10b981';
    roundRectPath(ctx, tx + 3, ty + 3, s - 6, s - 6, 6);
    ctx.fill();

    // Criss-cross gravel footpaths
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx + 6, cy);
    ctx.lineTo(tx + s - 6, cy);
    ctx.moveTo(cx, ty + 6);
    ctx.lineTo(cx, ty + s - 6);
    ctx.stroke();

    // Corner park trees
    const offsets = [[-15, -15], [15, -15], [-15, 15], [15, 15]];
    offsets.forEach(off => {
      ctx.fillStyle = '#047857';
      ctx.beginPath();
      ctx.arc(cx + off[0], cy + off[1], 7, 0, Math.PI * 2);

      ctx.fillStyle = '#34d399';

      ctx.arc(cx + off[0] - 1.5, cy + off[1] - 1.5, 4, 0, Math.PI * 2);

    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.arc(cx, cy, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
    ctx.fill();

    // Animated fountain spray
    const sprayR = 2 + Math.abs(Math.sin(elapsed * 4)) * 3.5;
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(cx, cy, sprayR, 0, Math.PI * 2);
    ctx.fill();

  function drawBuildingStatusBadges(cell, bId, level, tx, ty) {
    const bCfg = SoH.CONFIG && SoH.CONFIG.BUILDINGS && SoH.CONFIG.BUILDINGS[bId];
    if (!bCfg || bId === 'road') return;

    ctx.save();
    // Level Stars (★, ★★, ★★★) for multi-level buildings
    if (level >= 1 && (bId === 'residential' || bId === 'commercial' || bId === 'industrial' || level > 1)) {
      const stars = '★'.repeat(Math.min(3, level));
      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      roundRectPath(ctx, tx + 3, ty + 3, 8 + level * 6.5, 12, 3);
      ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(stars, tx + 5, ty + 9.5);
    }

    // Floating Warning Badges (⚡ if !cell.powered, 💧 if !cell.watered)
    const needsPower = (bCfg.powerUse || 0) > 0 && cell.powered === false;
    const needsWater = (bCfg.waterUse || 0) > 0 && cell.watered === false;

    if (needsPower || needsWater) {
      const bounce = Math.sin(elapsed * 6) * 2.5;
      const badgeText = (needsPower && needsWater) ? '⚡💧' : (needsPower ? '⚡' : '💧');
      const bx = tx + TILE_SIZE - 14;
      const by = ty + 13 + bounce;

      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(220, 38, 38, 0.92)';
      ctx.fill();
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, bx, by + 0.5);
    }
    ctx.restore();
  }

  // --- Animated Road Traffic & Particle Systems ---

  function updateAndDrawTraffic(dt, grid, gridSize) {
    // Collect all road tiles
    const roadTiles = [];
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        if (getCellBuildingId(grid[y][x]) === 'road') {
          roadTiles.push({ x, y });
        }
      }
    }

    if (roadTiles.length === 0) {
      vehicles.length = 0;
      return;
    }

    // Spawn vehicles up to target count proportional to road network
    const targetCount = Math.min(MAX_VEHICLES, Math.max(8, roadTiles.length * 2));
    while (vehicles.length < targetCount) {
      const start = roadTiles[Math.floor(Math.random() * roadTiles.length)];
      const colors = ['#ef4444', '#38bdf8', '#facc15', '#f8fafc', '#a855f7', '#fb923c', '#22c55e'];
      const vTypeRand = Math.random();
      const vType = vTypeRand < 0.16 ? 'bus' : (vTypeRand < 0.32 ? 'truck' : 'car');
      vehicles.push({
        gx: start.x,
        gy: start.y,
        tx: start.x,
        ty: start.y,
        progress: Math.random(),
        speed: vType === 'bus' ? 1.15 : (vType === 'truck' ? 1.3 : 1.75 + Math.random() * 0.6),
        color: colors[Math.floor(Math.random() * colors.length)],
        type: vType,
        dirX: 1,
        dirY: 0
      });
    }

    ctx.save();
    for (let i = vehicles.length - 1; i >= 0; i--) {
      const v = vehicles[i];
      // Verify current tile is still road
      if (!grid[v.gy] || getCellBuildingId(grid[v.gy][v.gx]) !== 'road') {
        vehicles.splice(i, 1);
        continue;
      }

      v.progress += dt * v.speed;
      if (v.progress >= 1) {
        v.gx = v.tx;
        v.gy = v.ty;
        v.progress = 0;

        // Pick next adjacent road tile
        const dirs = [
          { dx: 1, dy: 0 },
          { dx: -1, dy: 0 },
          { dx: 0, dy: 1 },
          { dx: 0, dy: -1 }
        ];
        const valid = dirs.filter(d => {
          const nx = v.gx + d.dx;
          const ny = v.gy + d.dy;
          return nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize &&
            getCellBuildingId(grid[ny][nx]) === 'road';
        });

        if (valid.length > 0) {
          // Prefer not immediately reversing unless dead end
          const nonReverse = valid.filter(d => !(d.dx === -v.dirX && d.dy === -v.dirY));
          const pool = nonReverse.length > 0 ? nonReverse : valid;
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          v.tx = v.gx + chosen.dx;
          v.ty = v.gy + chosen.dy;
          v.dirX = chosen.dx;
          v.dirY = chosen.dy;
        } else {
          v.tx = v.gx;
          v.ty = v.gy;
        }
      }

      // Compute pixel position with right-hand lane offset
      const wx = lerp(v.gx, v.tx, v.progress) * TILE_SIZE + TILE_SIZE / 2;
      const wy = lerp(v.gy, v.ty, v.progress) * TILE_SIZE + TILE_SIZE / 2;
      const laneOffset = 4.5;
      const px = wx - v.dirY * laneOffset;
      const py = wy + v.dirX * laneOffset;
      const angle = Math.atan2(v.dirY, v.dirX);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);

      const len = v.type === 'bus' ? 12 : (v.type === 'truck' ? 10 : 7.5);
      const wid = v.type === 'bus' ? 5 : 4.2;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-len / 2 + 1, -wid / 2 + 1, len, wid);

      // Vehicle body
      ctx.fillStyle = v.color;
      roundRectPath(ctx, -len / 2, -wid / 2, len, wid, 1.5);
      ctx.fill();

      // Windshield
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(len / 2 - 3, -wid / 2 + 0.8, 2, wid - 1.6);

      // Headlights
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(len / 2 - 0.5, -wid / 2 + 0.5, 1.2, 1.2);
      ctx.fillRect(len / 2 - 0.5, wid / 2 - 1.7, 1.2, 1.2);

      ctx.restore();
    }
    ctx.restore();
  }

  function updateAndDrawCityParticles(dt, grid, gridSize) {
    smokeSpawnTimer += dt;
    coinSpawnTimer += dt;

    // Spawn rising smoke puffs from industrial & power_plant buildings
    if (smokeSpawnTimer > 0.25) {
      smokeSpawnTimer = 0;
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const bId = getCellBuildingId(grid[y][x]);
          if ((bId === 'industrial' || bId === 'power_plant') && Math.random() < 0.45) {
            smokeParticles.push({
              x: x * TILE_SIZE + 18 + Math.random() * 20,
              y: y * TILE_SIZE + 14,
              vx: 6 + Math.random() * 8,
              vy: -14 - Math.random() * 10,
              r: 4 + Math.random() * 3,
              alpha: 0.65,
              color: bId === 'industrial' ? '148, 163, 184' : '226, 232, 240'
            });
          }
        }
      }
    }

    // Periodically spawn floating '+₺' coins above commercial buildings
    if (coinSpawnTimer > 1.35) {
      coinSpawnTimer = 0;
      const commTiles = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const cell = grid[y][x];
          if (getCellBuildingId(cell) === 'commercial' && cell.powered !== false) {
            commTiles.push({ x, y, level: getCellLevel(cell) });
          }
        }
      }
      if (commTiles.length > 0) {
        const pick = commTiles[Math.floor(Math.random() * commTiles.length)];
        const val = 12 * (pick.level || 1);
        floatingTexts.push({
          x: (pick.x + 0.5) * TILE_SIZE,
          y: (pick.y + 0.3) * TILE_SIZE,
          text: `+${val}₺`,
          color: '#facc15',
          alpha: 1,
          vy: -22
        });
      }
    }

    ctx.save();
    // Render & update smoke particles
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const p = smokeParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += dt * 4.5;
      p.alpha -= dt * 0.38;
      if (p.alpha <= 0) {
        smokeParticles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Render & update floating coins/texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.alpha -= dt * 0.65;
      if (ft.alpha <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = clamp(ft.alpha, 0, 1);
      ctx.font = 'bold 11.5px "Inter", "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.lineWidth = 3;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color || '#facc15';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawHoveredTileAndToolPreview(prov, gx, gy) {
    const tx = gx * TILE_SIZE;
    const ty = gy * TILE_SIZE;
    const cx = tx + TILE_SIZE / 2;
    const cy = ty + TILE_SIZE / 2;
    const tool = SoH.state && SoH.state.selectedTool;
    const cell = prov.grid[gy][gx];

    ctx.save();

    if (!tool) {
      // Standard hover highlight
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 2;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.restore();
      return;
    }

    if (tool === 'bulldoze') {
      ctx.fillStyle = 'rgba(239, 68, 68, 0.38)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚜', cx, cy);
      ctx.restore();
      return;
    }

    if (tool === 'upgrade') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⬆️', cx, cy);
      ctx.restore();
      return;
    }

    // Building placement preview
    const bCfg = SoH.CONFIG && SoH.CONFIG.BUILDINGS && SoH.CONFIG.BUILDINGS[tool];
    if (bCfg) {
      // Draw effect radius circle for power_plant, water_tower, park, or industrial
      if (tool === 'power_plant' || tool === 'water_tower' || tool === 'park' || tool === 'industrial') {
        const radiusMap = {
          power_plant: { r: 4.5 * TILE_SIZE, color: '#facc15' },
          water_tower: { r: 4.5 * TILE_SIZE, color: '#38bdf8' },
          park: { r: 3.0 * TILE_SIZE, color: '#10b981' },
          industrial: { r: 2.5 * TILE_SIZE, color: '#c026d3' }
        };
        const rInfo = radiusMap[tool];
        ctx.beginPath();
        ctx.arc(cx, cy, rInfo.r, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(rInfo.color, 0.12);
        ctx.fill();
        ctx.strokeStyle = hexToRgba(rInfo.color, 0.85);
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Translucent ghost preview of the building
      ctx.save();
      ctx.globalAlpha = 0.68;
      if (tool === 'road') {
        drawRoadTile(prov.grid, gx, gy, tx, ty, (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 12);
      } else {
        drawProceduralBuilding(tool, 1, tx, ty, gx, gy, { powered: true, watered: true });
      }
      ctx.restore();

      const canAfford = !SoH.state || SoH.state.gold === undefined || SoH.state.gold >= bCfg.cost;
      const isOccupied = Boolean(getCellBuildingId(cell));
      const validPlace = canAfford && !isOccupied;

      ctx.strokeStyle = validPlace ? '#4ade80' : '#f87171';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1.5, ty + 1.5, TILE_SIZE - 3, TILE_SIZE - 3);

      // Cost tag pill above ghost tile
      const costStr = `${bCfg.icon} -${bCfg.cost}₺`;
      ctx.font = 'bold 11px "Inter", "Segoe UI", sans-serif';
      const tagW = ctx.measureText(costStr).width + 14;
      roundRectPath(ctx, cx - tagW / 2, ty - 22, tagW, 18, 5);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.fill();
      ctx.strokeStyle = validPlace ? '#4ade80' : '#f87171';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = validPlace ? '#86efac' : '#fca5a5';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(costStr, cx, ty - 13);
    }

    ctx.restore();
  }

  // ============================================================================
  // INPUT & MOUSE / WHEEL INTERACTION HANDLERS
  // ============================================================================

  function bindEvents() {
    if (!canvas) return;

    window.addEventListener('resize', () => {
      SoH.Renderer.resize();
    });

    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (SoH.state) {
        if (SoH.state.selectedTool) {
          SoH.state.selectedTool = null;
          if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
          if (SoH.UI && typeof SoH.UI.onToolSelected === 'function') SoH.UI.onToolSelected(null);
        }
        if (SoH.state.armyMoveSourceId) {
          SoH.state.armyMoveSourceId = null;
          if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
        }
      }
    });

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.downX = pointer.x;
      pointer.downY = pointer.y;
      pointer.lastX = pointer.x;
      pointer.lastY = pointer.y;
      pointer.isDown = true;
      pointer.isDragging = false;
      pointer.button = e.button;
    });

    window.addEventListener('mousemove', e => {
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;

      if (pointer.isDown) {
        const dx = pointer.x - pointer.lastX;
        const dy = pointer.y - pointer.lastY;
        if (Math.hypot(pointer.x - pointer.downX, pointer.y - pointer.downY) > 5) {
          pointer.isDragging = true;
        }
        if (pointer.isDragging) {
          const mode = (SoH.state && SoH.state.viewMode) || 'world';
          if (mode === 'world') {
            worldCam.targetX += dx;
            worldCam.targetY += dy;
            worldCam.x += dx;
            worldCam.y += dy;
          } else {
            cityCam.targetX += dx;
            cityCam.targetY += dy;
            cityCam.x += dx;
            cityCam.y += dy;
          }
        }
        pointer.lastX = pointer.x;
        pointer.lastY = pointer.y;
      }

      // Hit-test province hover in world mode
      if (!SoH.state || SoH.state.viewMode !== 'city') {
        const wp = screenToWorld(pointer.x, pointer.y);
        const provinces = getAllProvinces();
        let foundId = null;
        for (let i = provinces.length - 1; i >= 0; i--) {
          if (pointInPolygon(wp.x, wp.y, provinces[i].polygon)) {
            foundId = provinces[i].id;
            break;
          }
        }
        pointer.hoveredProvinceId = foundId;
        canvas.style.cursor = foundId ? 'pointer' : (pointer.isDragging ? 'grabbing' : 'grab');
      } else {
        canvas.style.cursor = pointer.isDragging ? 'grabbing' : 'pointer';
      }
    });

    window.addEventListener('mouseup', e => {
      if (!pointer.isDown) return;
      const wasDragging = pointer.isDragging;
      const btn = pointer.button;
      pointer.isDown = false;
      pointer.isDragging = false;

      if (wasDragging || btn !== 0) return;

      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'world') {
        handleWorldClick();
      } else {
        handleCityClick();
      }
    });

    canvas.addEventListener('dblclick', e => {
      e.preventDefault();
      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'world' && pointer.hoveredProvinceId) {
        SoH.state.selectedProvinceId = pointer.hoveredProvinceId;
        SoH.state.viewMode = 'city';
        SoH.Renderer.centerCityMap();
        if (SoH.UI) {
          if (typeof SoH.UI.onProvinceSelected === 'function') {
            SoH.UI.onProvinceSelected(pointer.hoveredProvinceId);
          }
          if (typeof SoH.UI.switchViewMode === 'function') {
            SoH.UI.switchViewMode('city');
          } else if (typeof SoH.UI.update === 'function') {
            SoH.UI.update();
          }
        }
      }
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      const mode = (SoH.state && SoH.state.viewMode) || 'world';

      if (mode === 'world') {
        const nextZoom = clamp(worldCam.targetZoom * zoomFactor, 0.55, 2.6);
        const ratio = nextZoom / worldCam.targetZoom;
        worldCam.targetX = mx - (mx - worldCam.targetX) * ratio;
        worldCam.targetY = my - (my - worldCam.targetY) * ratio;
        worldCam.targetZoom = nextZoom;
      } else {
        const nextZoom = clamp(cityCam.targetZoom * zoomFactor, 0.6, 2.2);
        const ratio = nextZoom / cityCam.targetZoom;
        cityCam.targetX = mx - (mx - cityCam.targetX) * ratio;
        cityCam.targetY = my - (my - cityCam.targetY) * ratio;
        cityCam.targetZoom = nextZoom;
      }
    }, { passive: false });
  }

  function handleWorldClick() {
    if (!SoH.state) return;
    const clickedId = pointer.hoveredProvinceId;
    if (!clickedId) {
      if (SoH.state.armyMoveSourceId) {
        SoH.state.armyMoveSourceId = null;
        if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
      }
      return;
    }

    const clickedProv = getProvince(clickedId);
    if (!clickedProv) return;

    // Check if player is currently ordering an army march/attack
    if (SoH.state.armyMoveSourceId) {
      const sourceProv = getProvince(SoH.state.armyMoveSourceId);
      if (sourceProv && Array.isArray(sourceProv.neighbors) && sourceProv.neighbors.includes(clickedProv.id)) {
        const sendTroops = Math.floor((sourceProv.garrison || 0) * 0.7);
        if (SoH.Simulation && typeof SoH.Simulation.orderArmyAction === 'function') {
          SoH.Simulation.orderArmyAction(SoH.state.armyMoveSourceId, clickedProv.id, sendTroops);
        }
        SoH.state.armyMoveSourceId = null;
        if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
        return;
      }
      SoH.state.armyMoveSourceId = null;
    }

    // Select clicked province
    SoH.state.selectedProvinceId = clickedProv.id;
    if (SoH.UI && typeof SoH.UI.onProvinceSelected === 'function') {
      SoH.UI.onProvinceSelected(clickedProv.id);
    } else if (SoH.UI && typeof SoH.UI.update === 'function') {
      SoH.UI.update();
    }
  }

  function handleCityClick() {
    if (!SoH.state || !pointer.hoveredTile) return;
    const prov = getProvince(SoH.state.selectedProvinceId);
    if (!prov || !prov.grid) return;

    const gx = pointer.hoveredTile.x;
    const gy = pointer.hoveredTile.y;
    const cell = prov.grid[gy][gx];
    const tool = SoH.state.selectedTool;

    if (tool === 'bulldoze') {
      if (SoH.Simulation && typeof SoH.Simulation.bulldoze === 'function') {
        SoH.Simulation.bulldoze(prov.id, gx, gy);
      }
    } else if (tool === 'upgrade') {
      if (SoH.Simulation && typeof SoH.Simulation.upgradeBuilding === 'function') {
        SoH.Simulation.upgradeBuilding(prov.id, gx, gy);
      }
    } else if (tool && SoH.CONFIG && SoH.CONFIG.BUILDINGS && SoH.CONFIG.BUILDINGS[tool]) {
      if (SoH.Simulation && typeof SoH.Simulation.placeBuilding === 'function') {
        const ok = SoH.Simulation.placeBuilding(prov.id, gx, gy, tool);
        if (ok !== false) {
          const bCfg = SoH.CONFIG.BUILDINGS[tool];
          SoH.Renderer.spawnFloatingText(`-${bCfg.cost}₺`, (gx + 0.5) * TILE_SIZE, gy * TILE_SIZE, '#fca5a5');
        }
      }
    } else {
      pointer.selectedTile = { x: gx, y: gy };
      if (SoH.UI && typeof SoH.UI.onTileClicked === 'function') {
        SoH.UI.onTileClicked(gx, gy, cell);
      }
    }

    if (SoH.UI && typeof SoH.UI.update === 'function') {
      SoH.UI.update();
    }
  }

  // ============================================================================
  // PUBLIC API (SoH.Renderer)
  // ============================================================================

  SoH.Renderer = {
    init: function () {
      canvas = document.getElementById('game-canvas');
      container = document.getElementById('canvas-container') || (canvas && canvas.parentElement);
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      initProvinceDecorations();
      this.resize();
      this.centerWorldMap(true);
      this.centerCityMap(true);
      bindEvents();

      if (!animFrameId) {
        lastTime = performance.now();
        const loop = (now) => {
          const dt = Math.min(0.1, (now - lastTime) / 1000);
          lastTime = now;
          elapsed += dt;
          this.render(dt);
          animFrameId = requestAnimationFrame(loop);
        };
        animFrameId = requestAnimationFrame(loop);
      }
    },

    resize: function () {
      if (!canvas) return;
      container = document.getElementById('canvas-container') || canvas.parentElement;
      const rect = container
        ? container.getBoundingClientRect()
        : { width: window.innerWidth, height: window.innerHeight };

      width = Math.max(320, Math.floor(rect.width || window.innerWidth));
      height = Math.max(240, Math.floor(rect.height || window.innerHeight));
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      if (ctx) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    },

    centerWorldMap: function (immediate) {
      const scaleX = (width * 0.92) / WORLD_BASE_W;
      const scaleY = (height * 0.88) / WORLD_BASE_H;
      const fitZoom = clamp(Math.min(scaleX, scaleY), 0.65, 1.35);
      const tx = (width - WORLD_BASE_W * fitZoom) / 2;
      const ty = (height - WORLD_BASE_H * fitZoom) / 2;

      worldCam.targetZoom = fitZoom;
      worldCam.targetX = tx;
      worldCam.targetY = ty;
      if (immediate) {
        worldCam.zoom = fitZoom;
        worldCam.x = tx;
        worldCam.y = ty;
      }
    },

    centerCityMap: function (immediate) {
      const gridSize = (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 12;
      const boardPx = gridSize * TILE_SIZE;
      const fitZoom = clamp(Math.min((width * 0.84) / boardPx, (height * 0.82) / boardPx), 0.72, 1.32);
      const tx = (width - boardPx * fitZoom) / 2;
      const ty = (height - boardPx * fitZoom) / 2;

      cityCam.targetZoom = fitZoom;
      cityCam.targetX = tx;
      cityCam.targetY = ty;
      if (immediate) {
        cityCam.zoom = fitZoom;
        cityCam.x = tx;
        cityCam.y = ty;
      }
    },

    focusProvince: function (provId) {
      const prov = getProvince(provId);
      if (!prov || !prov.center) return;
      const z = Math.max(worldCam.targetZoom, 1.15);
      worldCam.targetZoom = z;
      worldCam.targetX = width / 2 - prov.center.x * z;
      worldCam.targetY = height / 2 - prov.center.y * z;
    },

    spawnFloatingText: function (text, x, y, color) {
      floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color || '#facc15',
        alpha: 1,
        vy: -24
      });
    },

    render: function (dt) {
      if (!ctx) return;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'city') {
        renderCityMode(dt || 0.016);
      } else {
        renderWorldMode(dt || 0.016);
      }
      ctx.restore();
    }
  };
})();

</script>
  <script>
// Skylines of History (Tarihin Ufukları) - UI Controller, Audio & Game Loop
window.SoH = window.SoH || {};

SoH.Audio = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  play(type) {
    if (this.muted) return;
    try {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'build') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'bulldoze') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.16);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.start(now);
        osc.stop(now + 0.17);
      } else if (type === 'horn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(277, now + 0.12);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    } catch (e) {}
  }
};

SoH.UI = {
  activeTab: 'province', // 'province' | 'military' | 'diplomacy' | 'tech' | 'agents'
  inspectedTile: null,
  tickTimer: null,

  init() {
    this.buildCityDock();
    this.bindEvents();
    this.refresh();
    this.restartLoop();
  },

  restartLoop() {
    if (this.tickTimer) clearInterval(this.tickTimer);
    const spd = SoH.state ? SoH.state.speed : 1;
    if (spd <= 0) return;
    const ms = Math.max(180, Math.floor((SoH.CONFIG.TICK_MS_BASE || 1000) / spd));
    this.tickTimer = setInterval(() => {
      if (SoH.Simulation && SoH.state.speed > 0) {
        SoH.Simulation.tick();
      }
    }, ms);
  },

  buildCityDock() {
    const dock = document.getElementById('city-dock');
    if (!dock) return;
    dock.innerHTML = '';

    const keys = Object.keys(SoH.CONFIG.BUILDINGS);
    keys.forEach((bKey) => {
      const b = SoH.CONFIG.BUILDINGS[bKey];
      const btn = document.createElement('button');
      btn.className = 'build-btn';
      btn.dataset.tool = b.id;
      btn.title = `${b.name}: ${b.description}`;
      btn.innerHTML = `
        <span class="b-icon">${b.icon}</span>
        <span class="b-name">${b.name.split(' ')[0]}</span>
        <span class="b-cost">🪙 ${b.cost}</span>
      `;
      btn.addEventListener('click', () => {
        SoH.Audio.play('click');
        if (SoH.state.viewMode !== 'city') {
          this.setViewMode('city');
        }
        SoH.state.selectedTool = SoH.state.selectedTool === b.id ? null : b.id;
        this.updateDockSelection();
      });
      dock.appendChild(btn);
    });

    const div = document.createElement('div');
    div.className = 'dock-divider';
    dock.appendChild(div);

    // Upgrade tool
    const upgBtn = document.createElement('button');
    upgBtn.className = 'build-btn';
    upgBtn.dataset.tool = 'upgrade';
    upgBtn.title = 'Bina Seviyesini Yükselt (Lv.1 -> Lv.2 -> Lv.3)';
    upgBtn.innerHTML = `
      <span class="b-icon">⬆️</span>
      <span class="b-name">Yükselt</span>
      <span class="b-cost">Seviye+</span>
    `;
    upgBtn.addEventListener('click', () => {
      SoH.Audio.play('click');
      if (SoH.state.viewMode !== 'city') this.setViewMode('city');
      SoH.state.selectedTool = SoH.state.selectedTool === 'upgrade' ? null : 'upgrade';
      this.updateDockSelection();
    });
    dock.appendChild(upgBtn);

    // Bulldoze tool
    const bullBtn = document.createElement('button');
    bullBtn.className = 'build-btn';
    bullBtn.dataset.tool = 'bulldoze';
    bullBtn.title = 'Yıkım Aracı (Maliyetin %25 iadesi)';
    bullBtn.innerHTML = `
      <span class="b-icon">🚜</span>
      <span class="b-name">Yıkım</span>
      <span class="b-cost" style="color:#fb7185">%25 İade</span>
    `;
    bullBtn.addEventListener('click', () => {
      SoH.Audio.play('click');
      if (SoH.state.viewMode !== 'city') this.setViewMode('city');
      SoH.state.selectedTool = SoH.state.selectedTool === 'bulldoze' ? null : 'bulldoze';
      this.updateDockSelection();
    });
    dock.appendChild(bullBtn);
  },

  updateDockSelection() {
    const tool = SoH.state ? SoH.state.selectedTool : null;
    document.querySelectorAll('#city-dock .build-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tool === tool);
    });
  },

  bindEvents() {
    // View Mode buttons
    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        SoH.Audio.play('click');
        this.setViewMode(btn.dataset.mode);
      });
    });

    // Speed buttons
    document.querySelectorAll('.spd-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        SoH.Audio.play('click');
        const spd = parseInt(btn.dataset.speed, 10);
        SoH.state.speed = spd;
        document.querySelectorAll('.spd-btn').forEach((b) =>
          b.classList.toggle('active', parseInt(b.dataset.speed, 10) === spd)
        );
        this.restartLoop();
      });
    });

    // Sidebar Tabs
    document.querySelectorAll('.s-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        SoH.Audio.play('click');
        this.activeTab = tab.dataset.tab;
        document.querySelectorAll('.s-tab').forEach((t) =>
          t.classList.toggle('active', t.dataset.tab === this.activeTab)
        );
        this.renderSidebar();
      });
    });
  },

  setViewMode(mode) {
    if (!SoH.state) return;
    SoH.state.viewMode = mode;
    if (mode === 'world') {
      SoH.state.selectedTool = null;
      this.updateDockSelection();
    }
    document.querySelectorAll('.mode-btn').forEach((b) =>
      b.classList.toggle('active', b.dataset.mode === mode)
    );
    const cityDock = document.getElementById('city-dock');
    if (cityDock) {
      cityDock.style.display = mode === 'city' ? 'flex' : 'none';
    }
    this.renderLeftOverlays();
    this.refresh();
  },

  onTick() {
    this.updateTopBar();
    this.renderLogs();
    if (SoH.state.tickCount % 2 === 0) {
      this.renderSidebar();
    }
  },

  onProvinceSelected(provId) {
    SoH.Audio.play('click');
    SoH.state.selectedProvinceId = provId;
    this.inspectedTile = null;
    this.refresh();
  },

  onTileHover(gx, gy, cell) {
    const tip = document.getElementById('tile-tooltip');
    if (!tip) return;
    const prov = SoH.state.provinces[SoH.state.selectedProvinceId];
    if (!cell || SoH.state.viewMode !== 'city') {
      tip.style.display = 'none';
      return;
    }
    tip.style.display = 'block';
    const b = cell.building ? SoH.CONFIG.BUILDINGS[cell.building.type] : null;
    const tool = SoH.state.selectedTool ? SoH.CONFIG.BUILDINGS[SoH.state.selectedTool] : null;

    tip.innerHTML = `
      <div style="font-weight:800;color:#38bdf8;margin-bottom:3px;">
        📍 ${prov ? prov.name : ''} — Kare [${gx}, ${gy}]
      </div>
      ${
        b
          ? `<div style="font-weight:700;color:#fff;">${b.icon} ${b.name} (Sv.${cell.building.level || 1})</div>
             <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">
               ⚡ Elektrik: <b style="color:${cell.powered ? '#34d399' : '#fb7185'}">${cell.powered ? 'Var' : 'Yok'}</b> |
               💧 Su: <b style="color:${cell.watered ? '#34d399' : '#fb7185'}">${cell.watered ? 'Var' : 'Yok'}</b> |
               🛣️ Yol: <b>${cell.roadConnected ? 'Bağlı' : 'Uzak'}</b>
             </div>`
          : `<div style="color:#94a3b8;font-size:11.5px;">Boş Arazi (Arsa Değeri: ${cell.landValue || 50} | Kirlilik: ${Math.round(cell.pollution || 0)})</div>`
      }
      ${
        tool
          ? `<div style="margin-top:5px;padding-top:4px;border-top:1px solid rgba(148,163,184,0.2);font-size:11px;color:#fbbf24;">
               🔨 İnşa Et: <b>${tool.icon} ${tool.name}</b> (🪙 ${tool.cost})
             </div>`
          : ''
      }
    `;
  },

  onTileClicked(gx, gy, cell) {
    this.inspectedTile = { x: gx, y: gy, cell };
    this.renderSidebar();
  },

  refresh() {
    if (!SoH.state) return;
    this.updateTopBar();
    this.renderLeftOverlays();
    this.renderSidebar();
    this.renderLogs();
    this.updateDockSelection();
  },

  updateTopBar() {
    const st = SoH.state;
    if (!st || !st.nations || !st.nations.player) return;
    const p = st.nations.player;

    // Sum player empire totals across owned provinces
    let totalPop = 0;
    let netGold = 0;
    let netFood = 0;
    let avgHap = 0;
    let provCount = 0;

    Object.values(st.provinces).forEach((pr) => {
      if (pr.owner === 'player') {
        provCount++;
        totalPop += pr.population || 0;
        netGold += (pr.goldIncome || 0) - (pr.maintenance || 0);
        netFood += pr.foodNet || 0;
        avgHap += pr.happiness || 70;
      }
    });
    if (provCount > 0) avgHap = Math.round(avgHap / provCount);

    const setEl = (id, html) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    };

    setEl('val-gold', Math.floor(p.gold).toLocaleString('tr-TR'));
    setEl('sub-gold', `${netGold >= 0 ? '+' : ''}${Math.round(netGold)} /gün`);
    const subGoldEl = document.getElementById('sub-gold');
    if (subGoldEl) subGoldEl.className = `res-sub ${netGold >= 0 ? 'pos' : 'neg'}`;

    setEl('val-pop', totalPop.toLocaleString('tr-TR'));
    setEl('sub-pop', `${provCount} Eyalet`);

    setEl('val-manpower', Math.floor(p.manpower).toLocaleString('tr-TR'));
    setEl('sub-manpower', `İhtiyat Gücü`);

    setEl('val-food', Math.floor(p.food).toLocaleString('tr-TR'));
    setEl('sub-food', `${netFood >= 0 ? '+' : ''}${Math.round(netFood)} gıda`);

    setEl('val-research', Math.floor(p.research).toLocaleString('tr-TR'));
    setEl('sub-research', `Mutluluk %${avgHap}`);

    const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
    setEl('date-display', `📅 ${st.day} ${months[(st.month - 1) % 12]} ${st.year}`);
  },

                        atWar
                          ? `<button class="mini-btn" onclick="SoH.Simulation.makePeace('player','${n.id}');SoH.UI.refresh()">🕊️ Barış Antlaşması</button>`
                          : `<button class="mini-btn" onclick="SoH.Simulation.declareWar('player','${n.id}');SoH.Audio.play('horn');SoH.UI.refresh()" style="color:#fb7185">⚔️ Savaş İlan Et</button>`
                      }
                      <button class="mini-btn" onclick="SoH.Simulation.sendGift('player','${n.id}');SoH.UI.refresh()">🎁 Hediye (🪙150)</button>
                      ${
                        !atWar
                          ? `<button class="mini-btn" onclick="SoH.Simulation.toggleAlliance('player','${n.id}');SoH.UI.refresh()">🤝 ${isAlly ? 'İttifakı Bitir' : 'İttifak Kur'}</button>`
                          : ''
                      }
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>
      `;
    } else if (this.activeTab === 'tech') {
      const p = st.nations.player;
      container.innerHTML = `
        <div class="glass-card">
          <div class="card-title">🔬 Bilim Akademisi & Teknoloji Ağacı</div>
          <div style="font-size:12px;margin-bottom:8px;">
            Mevcut Araştırma Puanı: <b style="color:#a855f7">🎓 ${Math.floor(p.research)} Puan</b>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${SoH.CONFIG.TECHS.map((t) => {
              const unlocked = p.unlockedTechs && p.unlockedTechs.includes(t.id);
              return `
                <div style="background:rgba(30,41,59,0.75);border:1px solid ${unlocked ? '#10b981' : 'rgba(148,163,184,0.25)'};border-radius:9px;padding:9px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <span style="font-weight:800;">${t.name}</span>
                    <span class="badge ${unlocked ? 'online' : ''}">${unlocked ? 'AÇILDI' : `🎓 ${t.cost}`}</span>
                  </div>
                  <div style="font-size:11px;color:#cbd5e1;margin-bottom:7px;">${t.desc}</div>
                  ${
                    !unlocked
                      ? `<button class="action-btn" onclick="SoH.Simulation.unlockTech('${t.id}');SoH.UI.refresh()">🔬 Teknolojinin Kilidini Aç (${t.cost} Puan)</button>`
                      : ''
                  }
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">💾 Kayıt & Sistem</div>
          <div style="display:flex;gap:6px;">
            <button class="action-btn emerald" onclick="SoH.Simulation.saveGame()">💾 Oyunu Kaydet</button>
            <button class="action-btn" onclick="SoH.Simulation.loadGame();SoH.UI.refresh()">📂 Kaydı Yükle</button>
          </div>
        </div>
      `;
    } else if (this.activeTab === 'agents') {
      const report = SoH.AI && SoH.AI.getAdvisorReport ? SoH.AI.getAdvisorReport() : { cityAdvice: [], strategyAdvice: [], aiAgentThoughts: [] };
      const logs = (SoH.AI && SoH.AI.agentDecisionLog) || [];

      container.innerHTML = `
        <div class="agent-card">
          <div class="agent-header">
            <span>🤖 Yapay Zeka Ajanları Kontrol Merkezi</span>
            <span class="badge online">3 Ajan Aktif</span>
          </div>
          <p style="font-size:11px;color:#cbd5e1;line-height:1.4;">
            Bu oyun hem <b>kodlanırken</b> 3 ayrı uzman yapay zeka alt-ajanı tarafından üretildi, hem de <b>oyun içinde</b> size yardım eden ve rakipleri yöneten canlı ajanlar barındırır:
          </p>
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">
            <button class="action-btn emerald" onclick="SoH.AI && SoH.AI.runCityOptimizationStep('${prov.id}'); SoH.Audio.play('build'); SoH.UI.refresh();">
              🏗️ Ajan 1 (AI Şehir Mimarı): ${prov.name} İçin Hamle Yap
            </button>
            <button class="action-btn ${st.autoGovernor ? 'gold' : ''}" onclick="SoH.state.autoGovernor = !SoH.state.autoGovernor; SoH.UI.refresh();">
              ⚙️ Otomatik AI Vali Modu: ${st.autoGovernor ? 'AÇIK (Her Tur Optimize Eder)' : 'KAPALI'}
            </button>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">🧭 Ajan 2: Başvezir & Başmimar Tavsiyeleri</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${
              report.cityAdvice.concat(report.strategyAdvice).length > 0
                ? report.cityAdvice
                    .concat(report.strategyAdvice)
                    .slice(0, 5)
                    .map(
                      (adv) => `
                      <div style="background:rgba(30,41,59,0.7);padding:7px 9px;border-radius:7px;border-left:3px solid ${adv.priority === 'high' ? '#f43f5e' : '#38bdf8'}">
                        <div style="font-weight:700;font-size:11.5px;">${adv.icon || '💡'} ${adv.title}</div>
                        <div style="font-size:11px;color:#94a3b8;margin-top:2px;">${adv.detail}</div>
                      </div>`
                    )
                    .join('')
                : `<div style="font-size:11.5px;color:#34d399;">✅ İmparatorluğunuzda tüm şebekeler ve sınırlar dengede görünüyor!</div>`
            }
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">🧠 Ajan 3: Canlı AI Düşünce & Karar Günlüğü</div>
          <div style="display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto;">
            ${
              logs.length > 0
                ? logs
                    .slice(0, 10)
                    .map(
                      (l) => `
                      <div style="font-size:11px;background:rgba(15,23,42,0.8);padding:6px 8px;border-radius:6px;border:1px solid rgba(168,85,247,0.25);">
                        <div style="font-weight:700;color:#e9d5ff;">${l.icon || '🤖'} ${l.agentName} <span style="color:#64748b;font-weight:400;">(${l.time || ''})</span></div>
                        <div style="color:#f8fafc;margin-top:2px;">${l.decision}</div>
                        <div style="color:#94a3b8;font-size:10px;margin-top:1px;">Sebep: ${l.reasoning}</div>
                      </div>`
                    )
                    .join('')
                : `<div style="font-size:11px;color:#94a3b8;">Ajanlar ilk stratejik hesaplamalarını yapıyor...</div>`
            }
          </div>
        </div>
      `;
    }
  },

  renderLogs() {
    const list = document.getElementById('event-log-list');
    if (!list || !SoH.state || !SoH.state.logs) return;
    list.innerHTML = SoH.state.logs
      .slice(0, 20)
      .map(
        (l) => `
        <div class="log-item ${l.type || 'info'}">
          <span class="log-date">[${l.date || ''}]</span>${l.text}
        </div>
      `
      )
      .join('');
  }
};

</script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (SoH.Simulation && SoH.Simulation.init) {
        SoH.Simulation.init();
      }
      if (SoH.AI && SoH.AI.init) {
        SoH.AI.init();
      }
      if (SoH.UI && SoH.UI.init) {
        SoH.UI.init();
      }
      if (SoH.Renderer && SoH.Renderer.init) {
        SoH.Renderer.init();
      }
    });
  </script>
</body>
</html>
