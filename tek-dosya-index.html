      container.innerHTML = `
        <div class="glass-card">
          <div class="card-title">⚖️ Ulusal Vergi & Ekonomi Politikası (${p.flag} ${p.shortName})</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span>Vergi Oranı: <b style="color:#fbbf24">%${p.taxRate}</b></span>
            <span style="font-size:11px;color:#94a3b8;">(Düşük vergi = Yüksek mutluluk)</span>
          </div>
          <div class="overlay-btn-group">
            ${[10, 15, 20, 28]
              .map(
                (r) =>
                  `<button class="mini-btn ${p.taxRate === r ? 'active' : ''}" onclick="SoH.Simulation.setTaxRate(${r});SoH.UI.refresh()">%${r} Vergi</button>`
              )
              .join('')}
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">🌍 Dünya Devletleri & Diplomasi (${Object.keys(st.nations).length - 1} Ülke)</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${Object.values(st.nations)
              .filter((n) => n && n.id && n.id !== pid && n.id !== 'player')
              .map((n) => {
                const rel = Math.round((p.relations && p.relations[n.id]) || 50);
                const atWar = p.atWarWith && p.atWarWith.includes(n.id);
                const isAlly = p.allies && p.allies.includes(n.id);
                const ownedProvs = Object.values(st.provinces).filter((pr) => pr.owner === n.id);
                const totalArmy = ownedProvs.reduce((acc, pr) => acc + (pr.garrison || 0), 0);

                return `
                  <div style="background:rgba(30,41,59,0.75);border-left:5px solid ${n.color};border-radius:8px;padding:8px 10px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                      <span style="font-weight:800;font-size:12.5px;">${n.flag || n.bannerIcon} ${n.name}</span>
                      <span class="badge ${atWar ? 'war' : 'online'}">${atWar ? 'SAVAŞTA' : isAlly ? 'MÜTTEFİK' : `İlişki: ${rel}`}</span>
                    </div>
                    <div style="font-size:10.5px;color:#94a3b8;margin-bottom:6px;">
                      ${n.personality} • 🏛️ ${ownedProvs.length} Eyalet • 🛡️ ${totalArmy} Ordu Gücü
                    </div>
                    <div class="overlay-btn-group">
                      ${
                        atWar
                          ? `<button class="mini-btn" onclick="SoH.Simulation.makePeace('${pid}','${n.id}');SoH.UI.refresh()">🕊️ Barış Yap</button>`
                          : `<button class="mini-btn" onclick="SoH.Simulation.declareWar('${pid}','${n.id}');SoH.Audio.play('horn');SoH.UI.refresh()" style="color:#fb7185">⚔️ Savaş Aç</button>`
                      }
                      <button class="mini-btn" onclick="SoH.Simulation.sendGift('${pid}','${n.id}');SoH.UI.refresh()">🎁 Yardım (🪙150)</button>
                      ${
                        !atWar
                          ? `<button class="mini-btn" onclick="SoH.Simulation.toggleAlliance('${pid}','${n.id}');SoH.UI.refresh()">🤝 ${isAlly ? 'İttifakı Bitir' : 'İttifak'}</button>`
                          : ''
                      }
                      <button class="mini-btn" title="Bu ülkenin kontrolüne geç" onclick="if(SoH.Simulation.switchPlayerNation){SoH.Simulation.switchPlayerNation('${n.id}');SoH.UI.refresh();}">👑 Yönet</button>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>
      `;
    } else if (this.activeTab === 'tech') {
      const p = this.getPlayerNation();
      container.innerHTML = `
        <div class="glass-card">
          <div class="card-title">🔬 Ulusal Odak & Teknoloji Ağacı</div>
          <div style="font-size:12px;margin-bottom:8px;">
            Araştırma Puanı: <b style="color:#a855f7">🎓 ${Math.floor(p.research)} Puan</b>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${SoH.CONFIG.TECHS.map((t) => {
              const unlocked = p.unlockedTechs && p.unlockedTechs.includes(t.id);
              return `
                <div style="background:rgba(30,41,59,0.75);border:1px solid ${unlocked ? '#10b981' : 'rgba(148,163,184,0.25)'};border-radius:9px;padding:9px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <span style="font-weight:800;">${t.name}</span>
                    <span class="badge ${unlocked ? 'online' : ''}">${unlocked ? 'AKTİF' : `🎓 ${t.cost}`}</span>
                  </div>
                  <div style="font-size:11px;color:#cbd5e1;margin-bottom:7px;">${t.desc}</div>
                  ${
                    !unlocked
                      ? `<button class="action-btn" onclick="SoH.Simulation.unlockTech('${t.id}');SoH.UI.refresh()">🔬 Odağı Tamamla (${t.cost} Puan)</button>`
                      : ''
                  }
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">💾 Kayıt & Sistem</div>
          <div style="display:flex;gap:6px;">
            <button class="action-btn emerald" onclick="SoH.Simulation.saveGame()">💾 Oyunu Kaydet</button>
            <button class="action-btn" onclick="SoH.Simulation.loadGame();SoH.UI.refresh()">📂 Kaydı Yükle</button>
          </div>
        </div>
      `;
    } else if (this.activeTab === 'agents') {
      const report = SoH.AI && SoH.AI.getAdvisorReport ? SoH.AI.getAdvisorReport() : { cityAdvice: [], strategyAdvice: [], aiAgentThoughts: [] };
      const logs = (SoH.AI && SoH.AI.agentDecisionLog) || [];

      container.innerHTML = `
        <div class="agent-card">
          <div class="agent-header">
            <span>🤖 Yapay Zeka Ajanları Komuta Merkezi</span>
            <span class="badge online">3 Canlı Ajan</span>
          </div>
          <p style="font-size:11px;color:#cbd5e1;line-height:1.35;">
            Şehir imarınızı ve ordularınızı yapay zeka ajanlarıyla ortaklaşa yönetebilir veya kararlarını canlı takip edebilirsiniz:
          </p>
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">
            <button class="action-btn emerald" onclick="SoH.AI && SoH.AI.runCityOptimizationStep('${prov.id}'); SoH.Audio.play('build'); SoH.UI.refresh();">
              🏗️ Ajan 1 (AI Şehir Mimarı): ${prov.cityName || prov.name} İçin Bina Kur
            </button>
            <button class="action-btn ${st.autoGovernor ? 'gold' : ''}" onclick="SoH.state.autoGovernor = !SoH.state.autoGovernor; SoH.UI.refresh();">
              ⚙️ Otomatik Şehir Valisi: ${st.autoGovernor ? 'AÇIK' : 'KAPALI'}
            </button>
            <button class="action-btn war" onclick="SoH.AI && SoH.AI.runFrontlineMarshalStep && SoH.AI.runFrontlineMarshalStep(); SoH.Audio.play('horn'); SoH.UI.refresh();">
              🎖️ Ajan 2 (AI Genelkurmay): Cephede Askeri Hamle Yap
            </button>
            <button class="action-btn ${st.autoMarshal ? 'gold' : ''}" onclick="SoH.state.autoMarshal = !SoH.state.autoMarshal; SoH.UI.refresh();">
              ⚔️ Otomatik Cephe Mareşali: ${st.autoMarshal ? 'AÇIK' : 'KAPALI'}
            </button>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">🧭 Başdanışman Raporu</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${
              report.cityAdvice.concat(report.strategyAdvice).length > 0
                ? report.cityAdvice
                    .concat(report.strategyAdvice)
                    .slice(0, 5)
                    .map(
                      (adv) => `
                      <div style="background:rgba(30,41,59,0.7);padding:7px 9px;border-radius:7px;border-left:3px solid ${adv.priority === 'high' ? '#f43f5e' : '#38bdf8'}">
                        <div style="font-weight:700;font-size:11.5px;">${adv.icon || '💡'} ${adv.title}</div>
                        <div style="font-size:11px;color:#94a3b8;margin-top:2px;">${adv.detail}</div>
                      </div>`
                    )
                    .join('')
                : `<div style="font-size:11.5px;color:#34d399;">✅ Tüm şehir şebekeleriniz ve cephe hatlarınız güçlü durumda!</div>`
            }
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title">🧠 Dünya Liderleri & AI Karar Günlüğü</div>
          <div style="display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto;">
            ${
              logs.length > 0
                ? logs
                    .slice(0, 12)
                    .map(
                      (l) => `
                      <div style="font-size:11px;background:rgba(15,23,42,0.8);padding:6px 8px;border-radius:6px;border:1px solid rgba(168,85,247,0.25);">
                        <div style="font-weight:700;color:#e9d5ff;">${l.icon || '🤖'} ${l.agentName} <span style="color:#64748b;font-weight:400;">(${l.time || ''})</span></div>
                        <div style="color:#f8fafc;margin-top:2px;">${l.decision}</div>
                        <div style="color:#94a3b8;font-size:10px;margin-top:1px;">Analiz: ${l.reasoning}</div>
                      </div>`
                    )
                    .join('')
                : `<div style="font-size:11px;color:#94a3b8;">Ajanlar dünya haritasını analiz ediyor...</div>`
            }
          </div>
        </div>
      `;
    }
  },

  renderLogs() {
    const list = document.getElementById('event-log-list');
    if (!list || !SoH.state || !SoH.state.logs) return;
    list.innerHTML = SoH.state.logs
      .slice(0, 22)
      .map(
        (l) => `
        <div class="log-item ${l.type || 'info'}">
          <span class="log-date">[${l.date || ''}]</span>${l.text}
        </div>
      `
      )
      .join('');
  }
};

</script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (SoH.Simulation && SoH.Simulation.init) {
        SoH.Simulation.init();
      }
      if (SoH.AI && SoH.AI.init) {
        SoH.AI.init();
      }
      if (SoH.UI && SoH.UI.init) {
        SoH.UI.init();
      }
      if (SoH.Renderer && SoH.Renderer.init) {
        SoH.Renderer.init();
      }
    });
  </script>
</body>
</html>
