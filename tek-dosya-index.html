  <script>
// Skylines of History (Tarihin Ufukları) - Utility AI & Multi-Agent Decision Systems
// Ajan 1: Otomatik Şehir Valisi (AI City Governor Agent)
// Ajan 2: Başvezir & Başmimar Danışman Ajanı (Real-time Strategic Advisor Agent)
// Ajan 3: Rakip Ülke Lider Ajanları (Rival Nation Grand Strategy AI)

window.SoH = window.SoH || {};

SoH.AI = {
  // Son 25 yapay zeka ajan kararını ve gerekçesini tutan canlı kayıt listesi
  agentDecisionLog: [],

  // Ajan profilleri (UI Kontrol Paneli için meta veriler)
  AGENT_PERSONAS: {
    governor: {
      id: 'governor',
      name: 'Mimar Sinan AI (Otomatik Şehir Valisi)',
      role: 'Şehir Planlama & Altyapı Optimizasyon Ajanı',
      icon: '🏗️',
      description: 'Elektrik/su dengesini, yol ağını, kirlilik yayılımını ve komşuluk bonuslarını (Utility Score) hesaplayarak en yüksek faydalı binayı inşa eder veya yükseltir.'
    },
    advisor: {
      id: 'advisor',
      name: 'Başvezir & Başmimar (Stratejik Danışman Ajanı)',
      role: 'Gerçek Zamanlı İmparatorluk & Şehir Analisti',
      icon: '🦉',
      description: 'Tüm eyaletlerdeki darboğazları, sınır tehditlerini, teknoloji fırsatlarını ve mutluluk risklerini tarayarak oyuncuya eyleme dönüştürülebilir tavsiyeler sunar.'
    },
    rivals: {
      id: 'rivals',
      name: 'Rakip Ülke Lider Ajanları (Grand Strategy AI)',
      role: 'Otonom Devlet Yönetimi, Ekonomi, Ordu ve Diplomasi',
      icon: '👑',
      description: 'Her rakip ulusun kendi kişilik matrisine (saldırganlık ve ekonomi odağı) göre şehirlerini büyütmesini, sınırlarına ordu yığmasını, ticaret veya savaş kararları almasını sağlar.'
    }
  },

  // ============================================================================
  // YARDIMCI FONKSİYONLAR (Durum ve Veri Erişimi Uyumluluk Katmanı)
  // ============================================================================

  _getTimeLabel() {
    const s = SoH.state;
    if (!s) return 'Gün 1';
    if (s.dateString) return s.dateString;
    if (typeof s.day === 'number') {
      const year = s.year || (1450 + Math.floor(s.day / 360));
      const month = Math.floor((s.day % 360) / 30) + 1;
      const day = (s.day % 30) + 1;
      return `${day}.${month}.${year}`;
    }
    if (typeof s.tickCount === 'number') return `Tur ${s.tickCount}`;
    return 'Canlı';
  },

  logDecision(agentName, icon, decision, reasoning, extra = {}) {
    const entry = {
      id: 'ai_log_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      time: this._getTimeLabel(),
      agentName: agentName || 'AI Ajanı',
      icon: icon || '🤖',
      decision: decision || '',
      reasoning: reasoning || '',
      ...extra
    };
    this.agentDecisionLog.unshift(entry);
    if (this.agentDecisionLog.length > 25) {
      this.agentDecisionLog.length = 25;
    }
    return entry;
  },

  _getAllProvinces() {
    const s = SoH.state;
    if (!s || !s.provinces) return [];
    if (Array.isArray(s.provinces)) return s.provinces;
    return Object.values(s.provinces);
  },

  _getProvinceById(provId) {
    const s = SoH.state;
    if (!s || !s.provinces) return null;
    if (Array.isArray(s.provinces)) {
      return s.provinces.find(p => p.id === provId) || null;
    }
    return s.provinces[provId] || null;
  },

  _getPlayerProvinces() {
    return this._getAllProvinces().filter(p => p.owner === 'player');
  },

  _getNationProvinces(nationId) {
    return this._getAllProvinces().filter(p => p.owner === nationId);
  },

  _getNationState(nationId) {
    const s = SoH.state;
    if (!s) return null;
    if (nationId === 'player') {
      // Oyuncu kaynakları doğrudan SoH.state üzerinde veya SoH.state.nations.player içinde olabilir
      if (s.nations && s.nations.player) return s.nations.player;
      return s;
    }
    if (s.nations && s.nations[nationId]) {
      return s.nations[nationId];
    }
    return null;
  },

  _getGold(nationId) {
    const s = SoH.state;
    if (!s) return 0;
    if (nationId === 'player') {
      if (typeof s.gold === 'number') return s.gold;
      if (s.resources && typeof s.resources.gold === 'number') return s.resources.gold;
      if (s.nations && s.nations.player && typeof s.nations.player.gold === 'number') return s.nations.player.gold;
      return 0;
    }
    const n = this._getNationState(nationId);
    return n && typeof n.gold === 'number' ? n.gold : 0;
  },

  _spendGold(nationId, amount) {
    const s = SoH.state;
    if (!s) return false;
    if (nationId === 'player') {
      if (typeof s.gold === 'number') {
        if (s.gold < amount) return false;
        s.gold -= amount;
      } else if (s.resources && typeof s.resources.gold === 'number') {
        if (s.resources.gold < amount) return false;
        s.resources.gold -= amount;
      }
      if (s.nations && s.nations.player && typeof s.nations.player.gold === 'number') {
        s.nations.player.gold = typeof s.gold === 'number' ? s.gold : s.nations.player.gold - amount;
      }
      return true;
    }
    const n = this._getNationState(nationId);
    if (!n || typeof n.gold !== 'number' || n.gold < amount) return false;
    n.gold -= amount;
    return true;
  },

  _addGold(nationId, amount) {
    const s = SoH.state;
    if (!s) return;
    if (nationId === 'player') {
      if (typeof s.gold === 'number') s.gold += amount;
      if (s.resources && typeof s.resources.gold === 'number') s.resources.gold += amount;
      if (s.nations && s.nations.player && typeof s.nations.player.gold === 'number') {
        s.nations.player.gold = typeof s.gold === 'number' ? s.gold : s.nations.player.gold + amount;
      }
      return;
    }
    const n = this._getNationState(nationId);
    if (n && typeof n.gold === 'number') n.gold += amount;
  },

  _getManpower(nationId) {
    const s = SoH.state;
    if (!s) return 0;
    if (nationId === 'player') {
      if (typeof s.manpower === 'number') return s.manpower;
      if (s.resources && typeof s.resources.manpower === 'number') return s.resources.manpower;
      if (s.nations && s.nations.player && typeof s.nations.player.manpower === 'number') return s.nations.player.manpower;
      return 0;
    }
    const n = this._getNationState(nationId);
    return n && typeof n.manpower === 'number' ? n.manpower : 0;
  },

  _spendManpower(nationId, amount) {
    const s = SoH.state;
    if (!s) return false;
    if (nationId === 'player') {
      if (typeof s.manpower === 'number') {
        if (s.manpower < amount) return false;
        s.manpower -= amount;
      } else if (s.resources && typeof s.resources.manpower === 'number') {
        if (s.resources.manpower < amount) return false;
        s.resources.manpower -= amount;
      }
      if (s.nations && s.nations.player && typeof s.nations.player.manpower === 'number') {
        s.nations.player.manpower = typeof s.manpower === 'number' ? s.manpower : s.nations.player.manpower - amount;
      }
      return true;
    }
    const n = this._getNationState(nationId);
    if (!n || typeof n.manpower !== 'number' || n.manpower < amount) return false;
    n.manpower -= amount;
    return true;
  },

  _getCell(prov, x, y) {
    if (!prov || !prov.grid) return null;
    const size = SoH.CONFIG.GRID_SIZE || 12;
    if (x < 0 || y < 0 || x >= size || y >= size) return null;
    if (Array.isArray(prov.grid[y])) {
      return prov.grid[y][x];
    }
    if (Array.isArray(prov.grid)) {
      return prov.grid[y * size + x] || null;
    }
    return null;
  },

  _getCellBuildingId(cell) {
    if (!cell) return null;
    if (typeof cell === 'string') return cell;
    return cell.building || cell.type || cell.buildingId || null;
  },

  _getCellLevel(cell) {
    if (!cell || typeof cell !== 'object') return 1;
    return cell.level || 1;
  },

  _getNeighbors4(prov, x, y) {
    const dirs = [
      { dx: 0, dy: -1 },
      { dx: 1, dy: 0 },
      { dx: 0, dy: 1 },
      { dx: -1, dy: 0 }
    ];
    const result = [];
    for (const d of dirs) {
      const nx = x + d.dx;
      const ny = y + d.dy;
      const c = this._getCell(prov, nx, ny);
      if (c !== null) {
        result.push({ x: nx, y: ny, cell: c, building: this._getCellBuildingId(c) });
      }
    }
    return result;
  },

  _getNeighborsRadius(prov, x, y, radius = 2) {
    const size = SoH.CONFIG.GRID_SIZE || 12;
    const result = [];
    for (let ny = Math.max(0, y - radius); ny <= Math.min(size - 1, y + radius); ny++) {
      for (let nx = Math.max(0, x - radius); nx <= Math.min(size - 1, x + radius); nx++) {
        if (nx === x && ny === y) continue;
        const dist = Math.abs(nx - x) + Math.abs(ny - y);
        if (dist <= radius) {
          const c = this._getCell(prov, nx, ny);
          if (c !== null) {
            result.push({ x: nx, y: ny, dist, cell: c, building: this._getCellBuildingId(c) });
          }
        }
      }
    }
    return result;
  },

  // Eyaletin anlık altyapı ve bina istatistiklerini analiz eder
  analyzeProvinceMetrics(prov) {
    const size = SoH.CONFIG.GRID_SIZE || 12;
    const counts = {};
    Object.keys(SoH.CONFIG.BUILDINGS).forEach(k => { counts[k] = 0; });

    let calcPowerSupply = 0;
    let calcPowerDemand = 0;
    let calcWaterSupply = 0;
    let calcWaterDemand = 0;
    let calcFoodGen = 0;
    let calcPollution = 0;
    const pollutedResidentialTiles = [];
    const disconnectedBuildings = [];
    const upgradableCells = [];
    const emptyCells = [];

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const cell = this._getCell(prov, x, y);
        const bId = this._getCellBuildingId(cell);
        const level = this._getCellLevel(cell);

        if (!bId) {
          const terrainBlocked = cell && (cell.terrain === 'water' || cell.blocked);
          if (!terrainBlocked) {
            emptyCells.push({ x, y, cell });
          }
          continue;
        }

        counts[bId] = (counts[bId] || 0) + 1;
        const cfg = SoH.CONFIG.BUILDINGS[bId];
        if (!cfg) continue;

        const mult = 1 + (level - 1) * 0.45;
        if (cfg.powerGen) calcPowerSupply += Math.round(cfg.powerGen * mult);
        if (cfg.powerUse) calcPowerDemand += Math.round(cfg.powerUse * mult);
        if (cfg.waterGen) calcWaterSupply += Math.round(cfg.waterGen * mult);
        if (cfg.waterUse) calcWaterDemand += Math.round(cfg.waterUse * mult);
        if (cfg.foodGen) calcFoodGen += Math.round(cfg.foodGen * mult);
        if (cfg.pollution) calcPollution += cfg.pollution;
        if (cfg.pollutionClean) calcPollution = Math.max(0, calcPollution - cfg.pollutionClean);

        const n4 = this._getNeighbors4(prov, x, y);
        const hasRoadAdj = n4.some(n => n.building === 'road');

        if (['residential', 'commercial', 'industrial'].includes(bId) && !hasRoadAdj) {
          disconnectedBuildings.push({ x, y, building: bId });
        }

        if (bId === 'residential') {
          const nearRadius = this._getNeighborsRadius(prov, x, y, 2);
          const nearbyPolluters = nearRadius.filter(n => n.building === 'industrial' || n.building === 'power_plant');
          const nearbyParks = nearRadius.filter(n => n.building === 'park');
          const cellPoll = (cell && typeof cell.pollution === 'number') ? cell.pollution : (nearbyPolluters.length * 14 - nearbyParks.length * 12);
          if (cellPoll > 8 || (nearbyPolluters.length > 0 && nearbyParks.length === 0)) {
            pollutedResidentialTiles.push({ x, y, pollution: Math.max(10, cellPoll) });
          }
        }

        if (bId !== 'road' && level < 3) {
          upgradableCells.push({ x, y, building: bId, level, hasRoadAdj });
        }
      }
    }

    const powerSupply = typeof prov.powerSupply === 'number' ? prov.powerSupply : (typeof prov.powerGen === 'number' ? prov.powerGen : calcPowerSupply);
    const powerDemand = typeof prov.powerDemand === 'number' ? prov.powerDemand : (typeof prov.powerUse === 'number' ? prov.powerUse : calcPowerDemand);
    const waterSupply = typeof prov.waterSupply === 'number' ? prov.waterSupply : (typeof prov.waterGen === 'number' ? prov.waterGen : calcWaterSupply);
    const waterDemand = typeof prov.waterDemand === 'number' ? prov.waterDemand : (typeof prov.waterUse === 'number' ? prov.waterUse : calcWaterDemand);
    const happiness = typeof prov.happiness === 'number' ? prov.happiness : 70;
    const population = typeof prov.population === 'number' ? prov.population : (counts.residential * 110 + 100);

    return {
      counts,
      powerSupply,
      powerDemand,
      powerDeficit: Math.max(0, powerDemand - powerSupply),
      waterSupply,
      waterDemand,
      waterDeficit: Math.max(0, waterDemand - waterSupply),
      foodGen: calcFoodGen,
      pollution: typeof prov.pollution === 'number' ? prov.pollution : calcPollution,
      happiness,
      population,
      pollutedResidentialTiles,
      disconnectedBuildings,
      upgradableCells,
      emptyCells
    };
  },

  // Harita üzerinde inşa işlemini hem Simulation motoru üzerinden hem de doğrudan güvenli şekilde uygular
  _executeBuildOrUpgrade(prov, actionType, buildingId, x, y, nationId) {
    const cfg = SoH.CONFIG.BUILDINGS[buildingId];
    if (!cfg) return false;

    if (actionType === 'upgrade') {
      const cell = this._getCell(prov, x, y);
      const currentLevel = this._getCellLevel(cell);
      const upgradeCost = Math.round(cfg.cost * 0.75 * currentLevel);

      if (nationId === 'player' && SoH.Simulation && typeof SoH.Simulation.upgradeBuilding === 'function') {
        const res = SoH.Simulation.upgradeBuilding(prov.id, x, y);
        if (res) return true;
      }
      if (!this._spendGold(nationId, upgradeCost)) return false;
      if (cell && typeof cell === 'object') {
        cell.level = currentLevel + 1;
      }
      if (SoH.Simulation && typeof SoH.Simulation.recalculateProvince === 'function') {
        SoH.Simulation.recalculateProvince(prov);
      }
      return true;
    }

    // Yeni bina inşası
    const cost = cfg.cost;
    if (nationId === 'player' && SoH.Simulation && typeof SoH.Simulation.placeBuilding === 'function') {
      const res = SoH.Simulation.placeBuilding(prov.id, x, y, buildingId, true);
      if (res) return true;
    }

    if (!this._spendGold(nationId, cost)) return false;

    const size = SoH.CONFIG.GRID_SIZE || 12;
    if (Array.isArray(prov.grid[y])) {
      const existing = prov.grid[y][x];
      if (existing && typeof existing === 'object') {
        existing.building = buildingId;
        existing.level = 1;
      } else {
        prov.grid[y][x] = { x, y, building: buildingId, level: 1, pollution: 0 };
      }
    } else if (Array.isArray(prov.grid)) {
      const idx = y * size + x;
      const existing = prov.grid[idx];
      if (existing && typeof existing === 'object') {
        existing.building = buildingId;
        existing.level = 1;
      } else {
        prov.grid[idx] = { x, y, building: buildingId, level: 1, pollution: 0 };
      }
    }

    if (SoH.Simulation && typeof SoH.Simulation.recalculateProvince === 'function') {
      SoH.Simulation.recalculateProvince(prov);
    }
    return true;
  },

  // ============================================================================
  // AJAN 1: OTOMATİK ŞEHİR VALİSİ (AI CITY GOVERNOR AGENT)
  // ============================================================================

  // Verilen eyalette tüm boş kareleri ve yükseltme adaylarını Utility AI puanlaması ile değerlendirir
  evaluateBestCityAction(prov, budgetGold) {
    if (!prov) return null;
    const metrics = this.analyzeProvinceMetrics(prov);
    const candidates = [];

    // 1. KRİTİK ALTYAPI KONTROLÜ: Elektrik Açığı
    if (metrics.powerSupply <= metrics.powerDemand + 10 && budgetGold >= SoH.CONFIG.BUILDINGS.power_plant.cost) {
      for (const slot of metrics.emptyCells) {
        const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
        const nearRes = nRadius.filter(n => n.building === 'residential').length;
        const nearInd = nRadius.filter(n => n.building === 'industrial').length;
        const nearRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        // Konutlardan uzak, sanayiye veya yola yakın kareleri tercih et
        let score = 95 + (metrics.powerDemand - metrics.powerSupply) * 0.5;
        score -= nearRes * 14;
        score += nearInd * 6;
        if (nearRoad) score += 8;
        if (prov.bonusType === 'power_plant') score += 12;

        candidates.push({
          action: 'build',
          buildingId: 'power_plant',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(score),
          title: '⚡ Enerji Santrali İnşası (Kritik Altyapı)',
          reasoning: `${prov.name} şehrinde elektrik talebi (${metrics.powerDemand} MW) arz sınırına (${metrics.powerSupply} MW) dayandı. Konutlardan uzak (${slot.x + 1},${slot.y + 1}) karesine Enerji Santrali kurularak şebeke kesintisi önlendi.`
        });
      }
    }

    // 2. KRİTİK ALTYAPI KONTROLÜ: Su Açığı
    if (metrics.waterSupply <= metrics.waterDemand + 10 && budgetGold >= SoH.CONFIG.BUILDINGS.water_tower.cost) {
      for (const slot of metrics.emptyCells) {
        const nearRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        const nearRes = this._getNeighborsRadius(prov, slot.x, slot.y, 2).filter(n => n.building === 'residential').length;
        let score = 92 + (metrics.waterDemand - metrics.waterSupply) * 0.5;
        if (nearRoad) score += 8;
        score += nearRes * 5;

        candidates.push({
          action: 'build',
          buildingId: 'water_tower',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(score),
          title: '💧 Su Kulesi & Pompa İstasyonu İnşası',
          reasoning: `${prov.name} şehrinde su tüketimi (${metrics.waterDemand} m³) kapasiteyi (${metrics.waterSupply} m³) zorluyor. Salgın ve büyüme durmasını önlemek için (${slot.x + 1},${slot.y + 1}) karesine Su Kulesi inşa edildi.`
        });
      }
    }

    // 3. YOL BAĞLANTISI EKSİK BİNALARI BAĞLAMA VEYA YOL AĞINI GENİŞLETME
    if (budgetGold >= SoH.CONFIG.BUILDINGS.road.cost) {
      if (metrics.disconnectedBuildings.length > 0) {
        const targetB = metrics.disconnectedBuildings[0];
        const adjEmpty = this._getNeighbors4(prov, targetB.x, targetB.y).filter(n => !n.building);
        for (const roadSlot of adjEmpty) {
          const connectsToExistingRoad = this._getNeighbors4(prov, roadSlot.x, roadSlot.y).some(n => n.building === 'road');
          const score = connectsToExistingRoad ? 89 : 82;
          const bName = SoH.CONFIG.BUILDINGS[targetB.building]?.name || 'Bina';
          candidates.push({
            action: 'build',
            buildingId: 'road',
            x: roadSlot.x,
            y: roadSlot.y,
            utilityScore: score,
            title: '🛣️ Bulvar & Yol Bağlantısı Tamamlama',
            reasoning: `(${targetB.x + 1},${targetB.y + 1}) konumundaki ${bName} binasının yol bağlantısı yoktu. Verimlilik ve seviye artışı için (${roadSlot.x + 1},${roadSlot.y + 1}) karesine bağlantı yolu döşendi.`
          });
        }
      } else if (metrics.counts.road < 6) {
        // Şehirde yeterli yol yoksa ana arter uzat
        for (const slot of metrics.emptyCells) {
          const adjRoads = this._getNeighbors4(prov, slot.x, slot.y).filter(n => n.building === 'road').length;
          if (adjRoads === 1) {
            candidates.push({
              action: 'build',
              buildingId: 'road',
              x: slot.x,
              y: slot.y,
              utilityScore: 76,
              title: '🛣️ Yeni İmar Bulvarı Açılması',
              reasoning: `Yeni konut ve ticaret bölgelerine imar alanı açmak amacıyla (${slot.x + 1},${slot.y + 1}) karesine ana bulvar uzatıldı.`
            });
          }
        }
      }
    }

    // 4. KİRLİLİK TEMİZLEME VE MUTLULUK: Kirli Konutların Yanına Şehir Parkı
    if ((metrics.pollutedResidentialTiles.length > 0 || metrics.happiness < 65) && budgetGold >= SoH.CONFIG.BUILDINGS.park.cost) {
      for (const slot of metrics.emptyCells) {
        const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
        const nearRes = nRadius.filter(n => n.building === 'residential').length;
        const nearInd = nRadius.filter(n => n.building === 'industrial' || n.building === 'power_plant').length;
        if (nearRes > 0 && (nearInd > 0 || metrics.happiness < 65)) {
          let score = 80 + nearRes * 7 + nearInd * 6 + Math.max(0, 70 - metrics.happiness) * 0.6;
          if (prov.bonusType === 'park') score += 10;
          candidates.push({
            action: 'build',
            buildingId: 'park',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(score),
            title: '🌳 Ekolojik Şehir Parkı & Meydan',
            reasoning: `Konut bölgelerinin yakınındaki sanayi kirliliğini temizlemek (+15 Kirlilik Azaltma) ve vatandaş mutluluğunu (+12) yükseltmek için (${slot.x + 1},${slot.y + 1}) karesine Şehir Parkı kuruldu.`
          });
        }
      }
    }

    // 5. GIDA GÜVENLİĞİ: Modern Çiftlik İnşası
    const globalFood = SoH.state && typeof SoH.state.food === 'number' ? SoH.state.food : 200;
    if ((metrics.counts.farm < 2 || globalFood < 120 || prov.bonusType === 'farm') && budgetGold >= SoH.CONFIG.BUILDINGS.farm.cost) {
      for (const slot of metrics.emptyCells) {
        const n4 = this._getNeighbors4(prov, slot.x, slot.y);
        const hasRoad = n4.some(n => n.building === 'road');
        const nearInd = this._getNeighborsRadius(prov, slot.x, slot.y, 2).filter(n => n.building === 'industrial').length;
        if (nearInd === 0) {
          let score = 68 + (metrics.counts.farm === 0 ? 16 : 0) + (globalFood < 120 ? 15 : 0);
          if (hasRoad) score += 6;
          if (prov.bonusType === 'farm') score += 14;
          candidates.push({
            action: 'build',
            buildingId: 'farm',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(score),
            title: '🌾 Modern Çiftlik & Tarım Alanı',
            reasoning: `İmparatorluk nüfusunu ve orduların iaşesini (+45 Gıda) güvenceye almak için kirlilikten uzak (${slot.x + 1},${slot.y + 1}) karesine Modern Çiftlik kuruldu.`
          });
        }
      }
    }

    // 6. KONUT, TİCARET, SANAYİ, AKADEMİ VE KIŞLA (Yola Komşu Optimal Kareler)
    for (const slot of metrics.emptyCells) {
      const n4 = this._getNeighbors4(prov, slot.x, slot.y);
      const hasRoad = n4.some(n => n.building === 'road');
      if (!hasRoad && metrics.counts.road > 0) continue;

      const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
      const nearRes = nRadius.filter(n => n.building === 'residential').length;
      const nearCom = nRadius.filter(n => n.building === 'commercial').length;
      const nearInd = nRadius.filter(n => n.building === 'industrial').length;
      const nearPark = nRadius.filter(n => n.building === 'park').length;

      // Konut Bölgesi Adayı
      if (budgetGold >= SoH.CONFIG.BUILDINGS.residential.cost && nearInd === 0) {
        let resScore = 70 + nearPark * 8 + nearCom * 5 - metrics.counts.residential * 2;
        if (prov.bonusType === 'residential') resScore += 12;
        candidates.push({
          action: 'build',
          buildingId: 'residential',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(resScore),
          title: '🏘️ Yeni Konut Bölgesi İmarı',
          reasoning: `Yol şebekesine bağlı ve sanayi kirliliğinden uzak (${slot.x + 1},${slot.y + 1}) karesine Konut Bölgesi açılarak vergi tabanı ve nüfus kapasitesi (+120) artırıldı.`
        });
      }

      // Ticaret Merkezi Adayı
      if (budgetGold >= SoH.CONFIG.BUILDINGS.commercial.cost) {
        let comScore = 72 + nearRes * 7 - metrics.counts.commercial * 3;
        if (prov.bonusType === 'commercial') comScore += 14;
        candidates.push({
          action: 'build',
          buildingId: 'commercial',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(comScore),
          title: '🏬 Ticaret Merkezi İnşası',
          reasoning: `${nearRes} konut bölgesine yürüme mesafesindeki (${slot.x + 1},${slot.y + 1}) karesine yüksek vergi geliri (+24 Altın) sağlayan Ticaret Merkezi kuruldu.`
        });
      }

      // Sanayi & Fabrika Adayı (Konutlardan uzak!)
      if (budgetGold >= SoH.CONFIG.BUILDINGS.industrial.cost && nearRes === 0) {
        let indScore = 69 + nearInd * 4 - metrics.counts.industrial * 4;
        if (prov.bonusType === 'industrial') indScore += 15;
        candidates.push({
          action: 'build',
          buildingId: 'industrial',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(indScore),
          title: '🏭 Sanayi & Fabrika Kompleksi',
          reasoning: `Konut bölgelerine kirlilik yaymayacak izole (${slot.x + 1},${slot.y + 1}) karesine yüksek üretim (+20) ve gelir (+32 Altın) sağlayan Fabrika inşa edildi.`
        });
      }

      // Bilim Akademisi Adayı
      if (budgetGold >= SoH.CONFIG.BUILDINGS.university.cost && metrics.counts.university < 2) {
        let uniScore = 67 + nearRes * 4 + (metrics.counts.university === 0 ? 12 : 0);
        if (prov.bonusType === 'university') uniScore += 16;
        candidates.push({
          action: 'build',
          buildingId: 'university',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(uniScore),
          title: '🎓 Bilim Akademisi Kurulumu',
          reasoning: `Teknoloji araştırmalarını hızlandırmak (+12 Bilim) ve eğitim seviyesini yükseltmek için (${slot.x + 1},${slot.y + 1}) karesine Bilim Akademisi açıldı.`
        });
      }

      // Sınır Eyaletiyse Askeri Kışla Adayı
      const isBorderProvince = (prov.neighbors || []).some(nId => {
        const np = this._getProvinceById(nId);
        return np && np.owner !== prov.owner;
      });
      if (isBorderProvince && budgetGold >= SoH.CONFIG.BUILDINGS.barracks.cost && metrics.counts.barracks < 2) {
        let barScore = 71 + (metrics.counts.barracks === 0 ? 10 : 0);
        if (prov.bonusType === 'barracks') barScore += 14;
        candidates.push({
          action: 'build',
          buildingId: 'barracks',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(barScore),
          title: '🏰 Sınır Tahkimatı & Askeri Kışla',
          reasoning: `${prov.name} bir sınır eyaleti olduğu için savunma bonusunu (+%25) ve insan gücü üretimini (+30) artırmak üzere (${slot.x + 1},${slot.y + 1}) karesine Kışla inşa edildi.`
        });
      }
    }

    // 7. MEVCUT BİNALARI SEVİYE 2 / 3'E YÜKSELTME ADAYLARI
    for (const upg of metrics.upgradableCells) {
      const cfg = SoH.CONFIG.BUILDINGS[upg.building];
      if (!cfg) continue;
      const upgCost = Math.round(cfg.cost * 0.75 * upg.level);
      if (budgetGold >= upgCost && upg.hasRoadAdj) {
        let upgScore = 66 + (3 - upg.level) * 5;
        if (upg.building === prov.bonusType) upgScore += 12;
        if (upg.building === 'power_plant' && metrics.powerSupply <= metrics.powerDemand + 25) upgScore += 22;
        if (upg.building === 'water_tower' && metrics.waterSupply <= metrics.waterDemand + 25) upgScore += 22;
        if (upg.building === 'commercial' || upg.building === 'residential') upgScore += 6;

        candidates.push({
          action: 'upgrade',
          buildingId: upg.building,
          x: upg.x,
          y: upg.y,
          utilityScore: Math.round(upgScore),
          title: `⬆️ ${cfg.name} Seviye ${upg.level + 1} Yükseltmesi`,
          reasoning: `(${upg.x + 1},${upg.y + 1}) karesindeki ${cfg.name} binasının yol ve altyapı bağlantısı tam olduğu için Seviye ${upg.level + 1} yoğunluğuna yükseltilerek verimi +%45 artırıldı.`
        });
      }
    }

    if (candidates.length === 0) return null;
    candidates.sort((a, b) => b.utilityScore - a.utilityScore);
    return candidates[0];
  },

  // Oyuncu "🤖 AI Mimar: Şehri Optimize Et (1 Adım)" butonuna bastığında veya Otomatik Vali çalıştığında çağrılır
  runCityOptimizationStep(provId) {
    const s = SoH.state;
    if (!s) return { success: false, message: 'Oyun durumu henüz başlatılmadı.' };

    const targetProvId = provId || s.selectedProvinceId || 'altin_boynuz';
    const prov = this._getProvinceById(targetProvId);
    if (!prov) {
      return { success: false, message: 'Eyalet bulunamadı.' };
    }

    if (prov.owner !== 'player') {
      const msg = `${prov.name} şu anda sizin kontrolünüzde değil! Sadece kendi eyaletlerinizde AI Mimar çalıştırabilirsiniz.`;
      if (SoH.UI && typeof SoH.UI.showToast === 'function') SoH.UI.showToast(msg, 'warning');
      return { success: false, message: msg };
    }

    const playerGold = this._getGold('player');
    const bestDecision = this.evaluateBestCityAction(prov, playerGold);

    if (!bestDecision) {
      const msg = `AI Mimar ${prov.name} şehrini inceledi: Mevcut bütçe (${Math.floor(playerGold)} Altın) ile yapılabilecek daha yüksek faydalı bir işlem bulunamadı.`;
      if (SoH.UI && typeof SoH.UI.showToast === 'function') SoH.UI.showToast(msg, 'info');
      return { success: false, message: msg };
    }

    const executed = this._executeBuildOrUpgrade(
      prov,
      bestDecision.action,
      bestDecision.buildingId,
      bestDecision.x,
      bestDecision.y,
      'player'
    );

    if (!executed) {
      return { success: false, message: 'Bütçe yetersiz veya kare uygun değil.' };
    }

    const cfg = SoH.CONFIG.BUILDINGS[bestDecision.buildingId];
    const logEntry = this.logDecision(
      'Otomatik Şehir Valisi (AI Mimar)',
      cfg ? cfg.icon : '🏗️',
      `${prov.name}: ${bestDecision.title} [Fayda Puanı: ${bestDecision.utilityScore}]`,
      bestDecision.reasoning,
      {
        agentRole: 'Ajan 1 • Şehir Planlama Ajanı',
        nationId: 'player',
        provId: prov.id,
        utilityScore: bestDecision.utilityScore
      }
    );

    if (SoH.UI) {
      if (typeof SoH.UI.showToast === 'function') {
        SoH.UI.showToast(`🤖 ${bestDecision.title}: ${bestDecision.reasoning}`, 'success');
      } else if (typeof SoH.UI.notify === 'function') {
        SoH.UI.notify(`🤖 ${bestDecision.title}`, bestDecision.reasoning);
      }
      if (typeof SoH.UI.renderAll === 'function') {
        SoH.UI.renderAll();
      } else if (typeof SoH.UI.update === 'function') {
        SoH.UI.update();
      }
    }

    return {
      success: true,
      provId: prov.id,
      provName: prov.name,
      action: bestDecision.action,
      buildingId: bestDecision.buildingId,
      x: bestDecision.x,
      y: bestDecision.y,
      title: bestDecision.title,
      reasoning: bestDecision.reasoning,
      utilityScore: bestDecision.utilityScore,
      logEntry
    };
  },

  // Otomatik Şehir Valisi açıkken (`SoH.state.autoGovernor === true`) tüm oyuncu şehirlerini denetler
  runAutoGovernorTick() {
    const s = SoH.state;
    if (!s || !s.autoGovernor) return null;

    const playerGold = this._getGold('player');
    if (playerGold <= 250) return null;

    const playerProvs = this._getPlayerProvinces();
    if (playerProvs.length === 0) return null;

    // En yüksek Utility puanına sahip eyalet hamlesini bul
    let topChoice = null;
    let topProv = null;

    for (const prov of playerProvs) {
      const candidate = this.evaluateBestCityAction(prov, playerGold);
      if (candidate && (!topChoice || candidate.utilityScore > topChoice.utilityScore)) {
        topChoice = candidate;
        topProv = prov;
      }
    }

    if (topChoice && topProv) {
      return this.runCityOptimizationStep(topProv.id);
    }
    return null;
  },

  // ============================================================================
  // AJAN 2: BAŞVEZİR & BAŞMİMAR DANIŞMAN AJANI (STRATEGIC ADVISOR AGENT)
  // ============================================================================

  getAdvisorReport() {
    const cityAdvice = [];
    const strategyAdvice = [];
    const s = SoH.state;

    if (!s) {
      return {
        cityAdvice: [],
        strategyAdvice: [],
        aiAgentThoughts: this.agentDecisionLog.slice(0, 12)
      };
    }

    const playerProvs = this._getPlayerProvinces();
    const playerGold = this._getGold('player');
    const playerManpower = this._getManpower('player');
    const researchPoints = typeof s.research === 'number' ? s.research : (s.resources && typeof s.resources.research === 'number' ? s.resources.research : 0);

    // 1. Eyalet Bazlı Şehir & Altyapı Analizi
    for (const prov of playerProvs) {
      const m = this.analyzeProvinceMetrics(prov);

      // Elektrik açığı kontrolü
      if (m.powerDemand > m.powerSupply) {
        cityAdvice.push({
          priority: 'high',
          icon: '⚡',
          title: `${prov.name}: Elektrik Şebekesi Açığı (-${m.powerDemand - m.powerSupply} MW)`,
          detail: `Tüketim (${m.powerDemand} MW) üretimi (${m.powerSupply} MW) aştı. Binaların verimi düşüyor; acilen Enerji Santrali inşa edilmeli.`,
          actionLabel: '⚡ AI Mimar ile Santral Kur',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      // Su açığı kontrolü
      if (m.waterDemand > m.waterSupply) {
        cityAdvice.push({
          priority: 'high',
          icon: '💧',
          title: `${prov.name}: Su Kesintisi Tehlikesi (-${m.waterDemand - m.waterSupply} m³)`,
          detail: `Su talebi (${m.waterDemand} m³) arzı (${m.waterSupply} m³) geçti. Nüfus artışı durabilir; Su Kulesi kurulmalı.`,
          actionLabel: '💧 AI Mimar ile Su Kulesi Kur',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      // Kirlilik ve konut sağlığı kontrolü
      if (m.pollutedResidentialTiles.length > 0) {
        cityAdvice.push({
          priority: 'medium',
          icon: '🌳',
          title: `${prov.name}: Konutlarda Sanayi Kirliliği (${m.pollutedResidentialTiles.length} Bölge)`,
          detail: `Fabrika veya santral dumanı konut bölgelerini etkiliyor. Konutların yanına Şehir Parkı kurarak kirliliği temizleyin.`,
          actionLabel: '🌳 AI Mimar ile Park Planla',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      // Düşük mutluluk kontrolü
      if (m.happiness < 55) {
        cityAdvice.push({
          priority: 'high',
          icon: '😟',
          title: `${prov.name}: Halk Mutluluğu Kritik (%${Math.round(m.happiness)})`,
          detail: `Düşük mutluluk vergi gelirlerini ve üretimi düşürür. Şehir Parkı ve Bilim Akademisi kurarak refahı artırın.`,
          actionLabel: '🏗️ Şehri Optimize Et',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      // Yol bağlantısı kopuk binalar
      if (m.disconnectedBuildings.length > 0) {
        cityAdvice.push({
          priority: 'medium',
          icon: '🛣️',
          title: `${prov.name}: Yol Bağlantısı Olmayan ${m.disconnectedBuildings.length} Bina Var`,
          detail: `Yola komşu olmayan konut ve ticaret binaları seviye atlayamaz. Bulvar ağını bu binalara uzatın.`,
          actionLabel: '🛣️ Yol Ağını Bağla',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }
    }

    // Eğer hazinede bol altın varsa yatırım tavsiyesi
    if (playerGold > 450 && cityAdvice.length < 3 && playerProvs.length > 0) {
      const targetProv = this._getProvinceById(s.selectedProvinceId) || playerProvs[0];
      cityAdvice.push({
        priority: 'low',
        icon: '💰',
        title: `Atıl Hazine Fonu (${Math.floor(playerGold)} Altın)`,
        detail: `Hazinedeki birikimi ${targetProv.name} eyaletinde yeni Ticaret Merkezleri ve Seviye 2-3 bina yükseltmelerine dönüştürebilirsiniz.`,
        actionLabel: '🤖 AI Mimar: 1 Adım Yatırım Yap',
        actionFn: () => SoH.AI.runCityOptimizationStep(targetProv.id)
      });
    }

    // 2. Grand Strategy, Askeri Sınır ve Teknoloji Analizi
    for (const prov of playerProvs) {
      const myArmy = typeof prov.army === 'number' ? prov.army : (typeof prov.troops === 'number' ? prov.troops : 100);
      const neighbors = prov.neighbors || [];

      for (const nId of neighbors) {
        const nProv = this._getProvinceById(nId);
        if (!nProv || nProv.owner === 'player') continue;

        const rivalCfg = SoH.CONFIG.NATIONS[nProv.owner] || {};
        const rivalArmy = typeof nProv.army === 'number' ? nProv.army : (typeof nProv.troops === 'number' ? nProv.troops : 100);
        const isAggressive = nProv.owner === 'kuzey' || nProv.owner === 'altinorda' || (rivalCfg.aggression && rivalCfg.aggression >= 0.6);

        if (isAggressive && rivalArmy > myArmy * 0.9) {
          strategyAdvice.push({
            priority: 'high',
            icon: '⚔️',
            title: `Sınır Tehdidi: ${prov.name} ↔ ${nProv.name} (${rivalCfg.name || nProv.owner})`,
            detail: `Saldırgan komşu ${rivalCfg.leader || nProv.owner}, ${nProv.name} sınırında ${rivalArmy} asker bulunduruyor (Sizin garnizonunuz: ${myArmy}). Caydırıcılık için acilen asker toplayın veya Kışla kurun!`,
            actionLabel: '🛡️ Sınıra Asker Topla',
            actionFn: () => {
              if (SoH.Simulation && typeof SoH.Simulation.recruitArmy === 'function') {
                SoH.Simulation.recruitArmy(prov.id);
              } else if (this._spendGold('player', 120) && this._spendManpower('player', 50)) {
                if (typeof prov.army === 'number') prov.army += 80;
                else prov.troops = (prov.troops || 100) + 80;
              }
              if (SoH.UI && typeof SoH.UI.renderAll === 'function') SoH.UI.renderAll();
            }
          });
        } else if (myArmy > rivalArmy * 1.45) {
          strategyAdvice.push({
            priority: 'medium',
            icon: '🏹',
            title: `Fetih Fırsatı: ${nProv.name} Eyaleti Zayıf Savunuluyor`,
            detail: `${prov.name} garnizonunuz (${myArmy} asker), komşu ${nProv.name} savunmasından (${rivalArmy} asker) çok daha güçlü. Stratejik taarruz başlatabilirsiniz.`,
            actionLabel: '🗺️ Eyaleti Göster',
            actionFn: () => {
              if (SoH.state) SoH.state.selectedProvinceId = nProv.id;
              if (SoH.UI && typeof SoH.UI.renderAll === 'function') SoH.UI.renderAll();
            }
          });
        }
      }
    }

    // Teknoloji Puanı Kontrolü
    const techs = (s.techs || SoH.CONFIG.TECHS || []);
    const affordableTech = techs.find(t => !t.unlocked && researchPoints >= t.cost);
    if (affordableTech) {
      strategyAdvice.push({
        priority: 'high',
        icon: '🎓',
        title: `Yeni Teknoloji Hazır: ${affordableTech.name}`,
        detail: `${Math.floor(researchPoints)} Bilim puanınız birikti! "${affordableTech.name}" (${affordableTech.cost} Bilim) teknolojisini açarak imparatorluk genelinde kalıcı bonus kazanın.`,
        actionLabel: '🔬 Teknolojiyi Araştır',
        actionFn: () => {
          if (SoH.Simulation && typeof SoH.Simulation.unlockTech === 'function') {
            SoH.Simulation.unlockTech(affordableTech.id);
          } else {
            affordableTech.unlocked = true;
            if (typeof s.research === 'number') s.research -= affordableTech.cost;
          }
          if (SoH.UI && typeof SoH.UI.renderAll === 'function') SoH.UI.renderAll();
        }
      });
    }

    // Eğer hiç uyarı yoksa olumlu durum raporu ekle
    if (cityAdvice.length === 0) {
      cityAdvice.push({
        priority: 'low',
        icon: '✅',
        title: 'Tüm Şehirlerde Altyapı Dengede',
        detail: 'Elektrik, su ve mutluluk değerleri güvenli aralıkta. Yeni bölgeler imara açarak büyümeyi sürdürebilirsiniz.',
        actionLabel: '🤖 AI Mimar ile Büyüt',
        actionFn: () => SoH.AI.runCityOptimizationStep(s.selectedProvinceId || 'altin_boynuz')
      });
    }

    if (strategyAdvice.length === 0) {
      strategyAdvice.push({
        priority: 'low',
        icon: '🦅',
        title: 'Sınırlar Güvende & Diplomasi İstikrarlı',
        detail: 'Sınır garnizonlarınız komşu ülkelere karşı caydırıcı seviyede. Ekonomik büyümeye ve bilim akademilerine odaklanabilirsiniz.'
      });
    }

    // Öncelik sırasına göre diz (high -> medium -> low)
    const pOrder = { high: 3, medium: 2, low: 1 };
    cityAdvice.sort((a, b) => (pOrder[b.priority] || 0) - (pOrder[a.priority] || 0));
    strategyAdvice.sort((a, b) => (pOrder[b.priority] || 0) - (pOrder[a.priority] || 0));

    return {
      cityAdvice,
      strategyAdvice,
      aiAgentThoughts: this.agentDecisionLog.slice(0, 25)
    };
  },

  // ============================================================================
  // AJAN 3: RAKİP ÜLKE LİDER AJANLARI (RIVAL NATION GRAND STRATEGY AI)
  // ============================================================================

  _getRelation(nationA, nationB) {
    const s = SoH.state;
    if (!s) return 0;
    const nObj = this._getNationState(nationA);
    if (nObj && nObj.relations && typeof nObj.relations[nationB] === 'number') {
      return nObj.relations[nationB];
    }
    if (s.relations) {
      const key1 = `${nationA}_${nationB}`;
      const key2 = `${nationB}_${nationA}`;
      if (typeof s.relations[key1] === 'number') return s.relations[key1];
      if (typeof s.relations[key2] === 'number') return s.relations[key2];
      if (s.relations[nationA] && typeof s.relations[nationA][nationB] === 'number') {
        return s.relations[nationA][nationB];
      }
    }
    // Varsayılan başlangıç ilişkisi
    if (nationA === 'kuzey' || nationB === 'kuzey') return -25;
    if (nationA === 'altinorda' || nationB === 'altinorda') return -15;
    return 20;
  },

  _modifyRelation(nationA, nationB, delta) {
    const s = SoH.state;
    if (!s) return;
    const cur = this._getRelation(nationA, nationB);
    const next = Math.max(-100, Math.min(100, cur + delta));

    const nA = this._getNationState(nationA);
    if (nA) {
      nA.relations = nA.relations || {};
      nA.relations[nationB] = next;
    }
    const nB = this._getNationState(nationB);
    if (nB) {
      nB.relations = nB.relations || {};
      nB.relations[nationA] = next;
    }
    if (s.relations && nationB === 'player' && typeof s.relations[nationA] === 'number') {
      s.relations[nationA] = next;
    }
  },

  // Tek bir rakip ülkenin (valoria, kuzey, altinorda, ege) şehir, ordu ve diplomasi hamlesini çalıştırır
  _runRivalNationTurn(nationId) {
    const nationCfg = SoH.CONFIG.NATIONS[nationId];
    if (!nationCfg) return;

    const provinces = this._getNationProvinces(nationId);
    if (provinces.length === 0) return; // Elenen ülke

    const nationState = this._getNationState(nationId) || {};
    let gold = typeof nationState.gold === 'number' ? nationState.gold : 320;
    let manpower = typeof nationState.manpower === 'number' ? nationState.manpower : 140;

    // Eğer state üzerinde tanımlı değilse başlat
    if (typeof nationState.gold !== 'number') nationState.gold = gold;
    if (typeof nationState.manpower !== 'number') nationState.manpower = manpower;

    const leaderLabel = `${nationCfg.bannerIcon} ${nationCfg.leader} (${nationCfg.name})`;

    // ------------------------------------------------------------------------
    // 1. ŞEHİR GELİŞTİRME KARARI (gold > 200)
    // ------------------------------------------------------------------------
    if (nationState.gold > 200) {
      const targetProv = provinces[Math.floor(Math.random() * provinces.length)];
      const m = this.analyzeProvinceMetrics(targetProv);

      let chosenBuilding = null;
      let reason = '';

      if (m.powerDemand >= m.powerSupply && nationState.gold >= SoH.CONFIG.BUILDINGS.power_plant.cost) {
        chosenBuilding = 'power_plant';
        reason = `${targetProv.name} eyaletinde enerji açığını kapatmak için Enerji Santrali kurdu.`;
      } else if (m.waterDemand >= m.waterSupply && nationState.gold >= SoH.CONFIG.BUILDINGS.water_tower.cost) {
        chosenBuilding = 'water_tower';
        reason = `${targetProv.name} eyaletinde su şebekesini güçlendirmek için Su Kulesi inşa etti.`;
      } else if (nationId === 'kuzey' || nationId === 'altinorda') {
        chosenBuilding = m.counts.barracks < 2 ? 'barracks' : (m.counts.industrial < 2 ? 'industrial' : 'farm');
        reason = `Askeri doktrini doğrultusunda ${targetProv.name} şehrinde ${SoH.CONFIG.BUILDINGS[chosenBuilding].name} kapasitesini büyüttü.`;
      } else if (nationId === 'valoria') {
        chosenBuilding = m.counts.commercial < 3 ? 'commercial' : 'residential';
        reason = `Ticaret Cumhuriyeti ekonomisini büyütmek için ${targetProv.name} limanında ${SoH.CONFIG.BUILDINGS[chosenBuilding].name} açtı.`;
      } else if (nationId === 'ege') {
        chosenBuilding = m.counts.university < 2 ? 'university' : 'park';
        reason = `Bilim ve refah odaklı stratejisi gereği ${targetProv.name} şehrinde ${SoH.CONFIG.BUILDINGS[chosenBuilding].name} kurdu.`;
      }

      if (chosenBuilding && m.emptyCells.length > 0) {
        const slot = m.emptyCells[Math.floor(Math.random() * m.emptyCells.length)];
        const built = this._executeBuildOrUpgrade(targetProv, 'build', chosenBuilding, slot.x, slot.y, nationId);
        if (built) {
          this.logDecision(
            leaderLabel,
            nationCfg.bannerIcon,
            `${targetProv.name} Şehrine ${SoH.CONFIG.BUILDINGS[chosenBuilding].name} İnşa Etti`,
            reason,
            { agentRole: `Ajan 3 • ${nationCfg.personality}`, nationId, utilityScore: 78 }
          );
        }
      } else if (m.upgradableCells.length > 0) {
        const upg = m.upgradableCells[0];
        const upgraded = this._executeBuildOrUpgrade(targetProv, 'upgrade', upg.building, upg.x, upg.y, nationId);
        if (upgraded) {
          const bName = SoH.CONFIG.BUILDINGS[upg.building]?.name || 'Bina';
          this.logDecision(
            leaderLabel,
            nationCfg.bannerIcon,
            `${targetProv.name}: ${bName} Seviye ${upg.level + 1} Yükseltmesi`,
            `Şehir verimliliğini artırmak için mevcut ${bName} yapısını bir üst seviyeye yükseltti.`,
            { agentRole: `Ajan 3 • ${nationCfg.personality}`, nationId, utilityScore: 74 }
          );
        }
      }
    }

    // ------------------------------------------------------------------------
    // 2. ASKERİ SEFERBERLİK KARARI (gold > 250 && manpower > 80)
    // ------------------------------------------------------------------------
    if (nationState.gold > 250 && nationState.manpower > 80) {
      // Sınır eyaletlerini veya başkenti bul
      const borderProvs = provinces.filter(p =>
        (p.neighbors || []).some(nId => {
          const np = this._getProvinceById(nId);
          return np && np.owner !== nationId;
        })
      );
      const targetProv = borderProvs.length > 0
        ? borderProvs.sort((a, b) => (a.army || a.troops || 0) - (b.army || b.troops || 0))[0]
        : (provinces.find(p => p.isCapital) || provinces[0]);

      if (targetProv) {
        nationState.gold -= 130;
        nationState.manpower -= 60;
        const addedTroops = nationId === 'kuzey' || nationId === 'altinorda' ? 95 : 70;
        if (typeof targetProv.army === 'number') {
          targetProv.army += addedTroops;
        } else {
          targetProv.troops = (targetProv.troops || 100) + addedTroops;
        }

        const totalTroops = targetProv.army || targetProv.troops;
        this.logDecision(
          leaderLabel,
          '🛡️',
          `${targetProv.name} Garnizonuna +${addedTroops} Asker Takviyesi`,
          `Sınır güvenliğini ve caydırıcılığı artırmak için 130 Altın ve 60 İnsan Gücü harcayarak ${targetProv.name} ordusunu ${totalTroops} askere çıkardı.`,
          { agentRole: `Ajan 3 • ${nationCfg.personality}`, nationId, utilityScore: 83 }
        );
      }
    }

    // ------------------------------------------------------------------------
    // 3. DİPLOMASİ, TİCARET VE SAVAŞ KARARLARI
    // ------------------------------------------------------------------------
    const aggression = nationCfg.aggression || 0.4;

    // Saldırgan ülkeler (Kuzey Demir Krallığı & Altın Bozkır Hanlığı): Zayıf komşu eyalet varsa saldırı değerlendirmesi
    if (nationId === 'kuzey' || nationId === 'altinorda' || aggression >= 0.6) {
      for (const myProv of provinces) {
        const myArmy = typeof myProv.army === 'number' ? myProv.army : (typeof myProv.troops === 'number' ? myProv.troops : 120);
        if (myArmy < 140) continue;

        for (const nId of (myProv.neighbors || [])) {
          const defProv = this._getProvinceById(nId);
          if (!defProv || defProv.owner === nationId) continue;

          const defArmy = typeof defProv.army === 'number' ? defProv.army : (typeof defProv.troops === 'number' ? defProv.troops : 100);
          const rel = this._getRelation(nationId, defProv.owner);

          // Garnizon savunmacıdan > 1.35x güçlüyse ve ilişkiler çok yüksek değilse taarruz!
          if (myArmy > defArmy * 1.35 && rel < 35) {
            this._modifyRelation(nationId, defProv.owner, -30);

            if (SoH.Simulation && typeof SoH.Simulation.resolveBattle === 'function') {
              SoH.Simulation.resolveBattle(myProv.id, defProv.id);
            } else {
              // Doğrudan muharebe simülasyonu
              const attackerLosses = Math.min(myArmy - 40, Math.round(defArmy * 0.55));
              const remainArmy = Math.max(50, myArmy - attackerLosses);
              const prevOwner = defProv.owner;
              defProv.owner = nationId;

              if (typeof myProv.army === 'number') {
                myProv.army = Math.round(remainArmy * 0.45);
                defProv.army = Math.round(remainArmy * 0.55);
              } else {
                myProv.troops = Math.round(remainArmy * 0.45);
                defProv.troops = Math.round(remainArmy * 0.55);
              }

              if (prevOwner === 'player' && SoH.UI && typeof SoH.UI.showToast === 'function') {
                SoH.UI.showToast(`⚔️ ${nationCfg.name}, ${defProv.name} eyaletimize saldırdı ve ele geçirdi!`, 'danger');
              }
            }

            this.logDecision(
              leaderLabel,
              '⚔️',
              `${myProv.name} Üzerinden ${defProv.name} Eyaletine Askeri Harekât!`,
              `Sınır garnizonu üstünlüğünü (${myArmy} vs ${defArmy} asker, >1.35x oran) ve yayılmacı doktrinini (${Math.round(aggression * 100)}% saldırganlık) kullanarak ${defProv.name} eyaletine taarruz etti.`,
              { agentRole: `Ajan 3 • ${nationCfg.personality}`, nationId, utilityScore: 94 }
            );
            return;
          }
        }
      }
    }

    // Tüccar ve Bilim Odaklı Ülkeler (Valoria & Ege): Ticaret Hediyesi veya İttifak/Barış Teklifi
    if (nationId === 'valoria' || nationId === 'ege') {
      const relWithPlayer = this._getRelation(nationId, 'player');
      if (relWithPlayer >= -10 && nationState.gold >= 180 && Math.random() < 0.45) {
        const giftGold = nationId === 'valoria' ? 45 : 30;
        nationState.gold -= giftGold;
        this._addGold('player', giftGold);
        this._modifyRelation(nationId, 'player', 8);

        if (nationId === 'ege' && SoH.state && typeof SoH.state.research === 'number') {
          SoH.state.research += 10;
        }

        const actionTitle = nationId === 'valoria'
          ? `Anadolu İmparatorluğu'na Ticaret Kervanı Gönderdi (+${giftGold} Altın)`
          : `Ortak Bilim & Diplomasi Heyeti Gönderdi (+${giftGold} Altın, +10 Bilim)`;

        const reasonText = nationId === 'valoria'
          ? `Dük Lorenzo barışçıl ticaret ağını genişletmek ve ikili ilişkileri (+8 İlişki) güçlendirmek için başkentimize ticaret filosu yönlendirdi.`
          : `Arkon Helena bilimsel işbirliğini ve bölgesel barışı korumak amacıyla akademi elçilerini gönderdi.`;

        this.logDecision(
          leaderLabel,
          nationId === 'valoria' ? '⚖️' : '🏛️',
          actionTitle,
          reasonText,
          { agentRole: `Ajan 3 • ${nationCfg.personality}`, nationId, utilityScore: 81 }
        );
      }
    }
  },

  // `SoH.Simulation.tick()` tarafından periyodik olarak çağrılan ana AI döngüsü
  tick() {
    const s = SoH.state;
    if (!s) return;

    this._tickCounter = (this._tickCounter || 0) + 1;

    // 1. Oyuncu Otomatik Şehir Valisi aktifse (`SoH.state.autoGovernor === true`) çalıştır
    if (s.autoGovernor && this._tickCounter % 2 === 0) {
      this.runAutoGovernorTick();
    }

    // 2. Rakip Ülke Lider Ajanlarını sırayla çalıştır
    const rivalIds = ['valoria', 'kuzey', 'altinorda', 'ege'];
    const activeRivalId = rivalIds[this._tickCounter % rivalIds.length];
    this._runRivalNationTurn(activeRivalId);
  },

  // Başlangıçta örnek AI düşünce kayıtları oluşturur (Oyuncu ilk saniyeden itibaren AI panelini dolu görür)
  init() {
    if (this.agentDecisionLog.length > 0) return;

    this.logDecision(
      'Mimar Sinan AI (Otomatik Şehir Valisi)',
      '🏗️',
      'Başkent Altın Boynuz Altyapı Taraması Tamamlandı',
      'Elektrik, su ve bulvar bağlantıları analiz edildi. "AI Mimar: Şehri Optimize Et" butonuyla veya Otomatik Vali moduyla adım adım şehir inşasına hazır.',
      { agentRole: 'Ajan 1 • Şehir Planlama Ajanı', nationId: 'player', utilityScore: 90 }
    );

    this.logDecision(
      'Başvezir & Başmimar (Stratejik Danışman)',
      '🦉',
      'İmparatorluk Sınır ve Ekonomi Raporu Hazırlandı',
      'Kuzey Demir Geçidi sınırındaki askeri hareketlilik ve başkent ticaret potansiyeli değerlendirildi.',
      { agentRole: 'Ajan 2 • Stratejik Danışman Ajanı', nationId: 'player', utilityScore: 88 }
    );

    this.logDecision(
      '⚔️ Mareşal Varg (Kuzey Demir Krallığı)',

  function drawOceanCartography() {
