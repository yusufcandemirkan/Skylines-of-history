<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skylines of History v2.0: Modern Dünya Stratejisi & Şehir İmarı</title>
  <style>
/* Skylines of History (Tarihin Ufukları) - Grand Strategy & City Builder UI */
:root {
  --bg-dark: #090d16;
  --panel-bg: rgba(15, 23, 42, 0.88);
  --panel-border: rgba(56, 189, 248, 0.24);
  --panel-glow: 0 12px 32px rgba(0, 0, 0, 0.65);
  --accent-blue: #0ea5e9;
  --accent-cyan: #38bdf8;
  --accent-gold: #f59e0b;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  --accent-purple: #a855f7;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --font-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
}

/* Main App Layout */
#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Top Imperial & City HUD Bar */
#top-bar {
  height: 58px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.96) 0%, rgba(9, 13, 22, 0.92) 100%);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 30;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.brand-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nation-crest {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0284c7, #0369a1);
  border: 2px solid #38bdf8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
}

.brand-titles h1 {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.4px;
  background: linear-gradient(90deg, #f8fafc, #38bdf8, #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-titles span {
  font-size: 11px;
  color: var(--text-muted);
  display: block;
}

/* Resource Pills */
.resource-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
}

.res-pill {
  background: rgba(30, 41, 59, 0.78);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 8px;
  padding: 5px 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 100px;
  transition: transform 0.15s, border-color 0.15s;
}

.res-pill:hover {
  border-color: var(--accent-cyan);
  transform: translateY(-1px);
}

.res-icon {
  font-size: 16px;
}

.res-info {
  display: flex;
  flex-direction: column;
}

.res-val {
  font-weight: 700;
  font-size: 13px;
  color: #fff;
}

.res-sub {
  font-size: 10px;
  color: var(--text-muted);
}

.res-sub.pos { color: #34d399; }
.res-sub.neg { color: #fb7185; }

/* View Mode Switcher (AoH3 World vs Cities Skylines Grid) */
.mode-switcher {
  display: flex;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 10px;
  padding: 3px;
  gap: 4px;
}

.mode-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  padding: 7px 13px;
  border-radius: 7px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.mode-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #fff;
  box-shadow: 0 2px 10px rgba(14, 165, 233, 0.45);
}

.mode-btn:hover:not(.active) {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}

/* Clock & Speed Controls */
.clock-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.22);
  padding: 5px 10px;
  border-radius: 9px;
}

#date-display {
  font-weight: 700;
  font-size: 12.5px;
  color: #e2e8f0;
  min-width: 98px;
}

.speed-btns {
  display: flex;
  gap: 3px;
}

.spd-btn {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.25);
  color: var(--text-muted);
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.spd-btn.active {
  background: var(--accent-gold);
  color: #090d16;
  border-color: #fbbf24;
}

/* Main Workspace Area */
#workspace {
  flex: 1;
  position: relative;
  display: flex;
  overflow: hidden;
}

#canvas-container {
  flex: 1;
  position: relative;
  height: 100%;
  background: radial-gradient(circle at center, #0f172a 0%, #060911 100%);
  overflow: hidden;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

#game-canvas:active {
  cursor: grabbing;
}

/* Floating Left Overlay Toolbar (Map Modes & City Overlays) */
#left-overlay-bar {
  position: absolute;
  top: 14px;
  left: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 20;
  max-width: 250px;
}

.glass-card {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 11px 13px;
  box-shadow: var(--panel-glow);
}

.card-title {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--accent-cyan);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.overlay-btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.mini-btn {
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.22);
  color: #cbd5e1;
  padding: 5px 9px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}

.mini-btn:hover {
  border-color: var(--accent-cyan);
  color: #fff;
}

.mini-btn.active {
  background: rgba(14, 165, 233, 0.28);
  border-color: var(--accent-cyan);
  color: #fff;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

/* Bottom City Construction Dock (Cities: Skylines Toolbar) */
#city-dock {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 14px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  z-index: 22;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
  max-width: calc(100vw - 410px);
  overflow-x: auto;
}

.build-btn {
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 10px;
  padding: 7px 10px;
  min-width: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--text-main);
  transition: all 0.16s;
  position: relative;
}

.build-btn:hover {
  transform: translateY(-3px);
  border-color: var(--accent-cyan);
  background: rgba(30, 41, 59, 1);
}

.build-btn.active {
  background: linear-gradient(180deg, rgba(14, 165, 233, 0.35), rgba(37, 99, 235, 0.35));
  border-color: #38bdf8;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
  transform: translateY(-3px);
}

.build-btn .b-icon {
  font-size: 20px;
}

.build-btn .b-name {
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}

.build-btn .b-cost {
  font-size: 10px;
  color: #fbbf24;
  font-weight: 700;
}

.dock-divider {
  width: 1px;
  height: 42px;
  background: rgba(148, 163, 184, 0.2);
  margin: 0 3px;
}

/* Right Sidebar Panel (Inspector, Military, Diplomacy, Tech, AI Agents) */
#right-sidebar {
  width: 375px;
  height: 100%;
  background: rgba(11, 17, 30, 0.96);
  border-left: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  z-index: 25;
}

.sidebar-tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(15, 23, 42, 0.95);
  border-bottom: 1px solid rgba(148, 163, 184, 0.16);
}

.s-tab {
  border: none;
  background: transparent;
  color: var(--text-muted);
  padding: 10px 4px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}

.s-tab span.t-ico {
  font-size: 15px;
}

.s-tab.active {
  color: var(--accent-cyan);
  border-bottom-color: var(--accent-cyan);
  background: rgba(56, 189, 248, 0.08);
}

.sidebar-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Stat Grid inside Sidebar */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-box {
  background: rgba(30, 41, 59, 0.65);
  border: 1px solid rgba(148, 163, 184, 0.15);
  border-radius: 8px;
  padding: 8px 10px;
}

.stat-label {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.stat-value {
  font-size: 13.5px;
  font-weight: 800;
  color: #f8fafc;
}

/* Action Buttons */
.action-btn {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid rgba(56, 189, 248, 0.4);
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(37, 99, 235, 0.25));
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.16s;
}

.action-btn:hover {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.45), rgba(37, 99, 235, 0.45));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}

.action-btn.war {
  border-color: rgba(244, 63, 94, 0.5);
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.28), rgba(159, 18, 57, 0.28));
}

.action-btn.war:hover {
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.5), rgba(159, 18, 57, 0.5));
}

.action-btn.emerald {
  border-color: rgba(16, 185, 129, 0.5);
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.28));
}

.action-btn.gold {
  border-color: rgba(245, 158, 11, 0.5);
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.28));
}

/* AI Agent Card & Feed */
.agent-card {
  background: rgba(30, 41, 59, 0.72);
  border: 1px solid rgba(168, 85, 247, 0.35);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.agent-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  color: #e9d5ff;
}

.badge {
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 700;
}

.badge.online {
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.4);
}

.badge.war {
  background: rgba(244, 63, 94, 0.2);
  color: #fb7185;
  border: 1px solid rgba(244, 63, 94, 0.4);
}

/* Event Log Drawer at Bottom of Sidebar */
#event-log-box {
  height: 155px;
  border-top: 1px solid rgba(148, 163, 184, 0.18);
  background: rgba(7, 11, 20, 0.95);
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
}

#event-log-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11.5px;
}

.log-item {
  padding: 4px 7px;
  border-radius: 5px;
  background: rgba(30, 41, 59, 0.5);
  border-left: 3px solid var(--accent-cyan);
  line-height: 1.35;
}

.log-item.war { border-left-color: var(--accent-rose); }
.log-item.city { border-left-color: var(--accent-emerald); }
.log-item.diplomacy { border-left-color: var(--accent-purple); }
.log-item .log-date {
  color: var(--text-muted);
  font-size: 10px;
  margin-right: 5px;
}

/* Hover Tooltip Banner */
#tile-tooltip {
  position: absolute;
  top: 14px;
  right: 390px;
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 10px;
  padding: 9px 13px;
  z-index: 20;
  pointer-events: none;
  min-width: 210px;
  box-shadow: var(--panel-glow);
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.4);
}
::-webkit-scrollbar-thumb {
  background: rgba(100, 116, 139, 0.5);
  border-radius: 3px;
}

</style>
</head>

  <div id="app">

    <header id="top-bar">

    </header>

    <!-- Main Interactive Workspace -->
    <div id="workspace">

        <!-- Left Floating Mode/Overlay Controls -->

        <div class="sidebar-content" id="sidebar-body"></div>

        <!-- Live Chronicle / Event Log -->

          <div id="event-log-list"></div>

    </div>
  </div>

  <script>
// Skylines of History v2.0 (Modern World Grand Strategy & Metropolitan City Builder)
// Core Simulation Engine: 19 Real Nations, 42 World Provinces, 14x14 City Grids, 14 Buildings, 4 Division Types & Animated Battles

window.SoH = window.SoH || {};

(function () {
  let logIdCounter = 1;
  let battleIdCounter = 1;

  const UNIT_GARRISON_WEIGHTS = {
    infantry: 60,
    tank: 85,
    artillery: 70,
    airforce: 95
  };

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function formatDate(state) {
    if (!state) return '01.01.2026';
    return `${pad2(state.day)}.${pad2(state.month)}.${state.year}`;
  }

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  function resolveNationId(id) {
    const state = SoH.state;
    if (!state) return id || 'turkiye';
    if (!id || id === 'player') {
      return state.playerNationId || 'turkiye';
    }
    return id;
  }

  function isPlayerNation(id) {
    const state = SoH.state;
    if (!state) return id === 'turkiye' || id === 'player';
    return id === state.playerNationId || id === 'player';
  }

  function bindPlayerNationAlias(state) {
    if (!state || !state.nations) return;
    Object.defineProperty(state.nations, 'player', {
      get: function () {
        return state.nations[state.playerNationId || 'turkiye'];
      },
      enumerable: false,
      configurable: true
    });
  }

  function calcGarrisonFromDivisions(divs) {
    if (!divs) return 120;
    return (
      (divs.infantry || 0) * UNIT_GARRISON_WEIGHTS.infantry +
      (divs.tank || 0) * UNIT_GARRISON_WEIGHTS.tank +
      (divs.artillery || 0) * UNIT_GARRISON_WEIGHTS.artillery +
      (divs.airforce || 0) * UNIT_GARRISON_WEIGHTS.airforce
    );
  }

  function syncDivisionsFromGarrison(prov) {
    if (!prov.divisions) {
      prov.divisions = { infantry: 2, tank: 1, artillery: 0, airforce: 0 };
    }
    const currentCalc = calcGarrisonFromDivisions(prov.divisions);
    const diff = (prov.garrison || 0) - currentCalc;
    if (Math.abs(diff) >= UNIT_GARRISON_WEIGHTS.infantry) {
      const deltaInf = Math.round(diff / UNIT_GARRISON_WEIGHTS.infantry);
      prov.divisions.infantry = Math.max(1, (prov.divisions.infantry || 0) + deltaInf);
    }
    prov.garrison = Math.max(20, Math.round(prov.garrison || calcGarrisonFromDivisions(prov.divisions)));
  }

  function createEmptyGrid(provTemplate) {
    const size = (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 14;
    const grid = [];
    const isCoastal =
      provTemplate.bonusType === 'seaport' ||
      /Kıyı|Boğaz|Ada|Deniz|Körfez|Kanal|Liman|Pasifik|Atlantik/i.test(provTemplate.terrain || '');

    for (let y = 0; y < size; y++) {
      const row = [];
      for (let x = 0; x < size; x++) {
        let terrain = 'grass';
        if (isCoastal && y >= size - 2 && x >= 2 && x <= size - 3) {
          terrain = 'water_edge';
        } else if (y === size - 1 && x >= 4 && x <= 9) {
          terrain = 'water_edge';
        } else if ((x * 3 + y * 5) % 9 === 0 && (x < 2 || x > 11 || y < 2 || y > 11)) {
          terrain = 'fertile';
        }
        row.push({
          x: x,
          y: y,
          terrain: terrain,
          building: null,
          pollution: 0,
          landValue: terrain === 'water_edge' ? 62 : 50,
          powered: false,
          watered: false,
          roadConnected: false
        });
      }
      grid.push(row);
    }
    return grid;
  }

  function setCellBuilding(grid, x, y, type, level) {
    if (!grid[y] || !grid[y][x]) return;
    grid[y][x].building = {
      type: type,
      level: level || 1,
      xp: 0
    };
  }

  function populateStarterCity(prov) {
    const g = prov.grid;

    if (prov.id === 'tr_marmara') {
      // İstanbul & Marmara: Grand 14x14 Metropolis
      for (let x = 2; x <= 11; x++) setCellBuilding(g, x, 6, 'road', 1);
      for (let y = 2; y <= 11; y++) setCellBuilding(g, 6, y, 'road', 1);
      for (let x = 3; x <= 10; x++) setCellBuilding(g, x, 9, 'road', 1);

      setCellBuilding(g, 2, 5, 'power_plant', 1);
      setCellBuilding(g, 3, 5, 'water_tower', 1);
      setCellBuilding(g, 4, 5, 'commercial', 2);
      setCellBuilding(g, 5, 5, 'park', 1);
      setCellBuilding(g, 7, 5, 'hospital', 1);
      setCellBuilding(g, 8, 5, 'university', 1);
      setCellBuilding(g, 9, 5, 'barracks', 1);
      setCellBuilding(g, 10, 5, 'airport', 1);

      setCellBuilding(g, 2, 7, 'farm', 1);
      setCellBuilding(g, 3, 7, 'farm', 1);
      setCellBuilding(g, 4, 7, 'residential', 2);
      setCellBuilding(g, 5, 7, 'commercial', 2);
      setCellBuilding(g, 7, 7, 'park', 1);
      setCellBuilding(g, 8, 7, 'residential', 2);
      setCellBuilding(g, 9, 7, 'arms_factory', 1);
      setCellBuilding(g, 10, 7, 'industrial', 1);

      setCellBuilding(g, 4, 8, 'residential', 1);
      setCellBuilding(g, 5, 8, 'commercial', 1);
      setCellBuilding(g, 7, 8, 'residential', 2);
      setCellBuilding(g, 8, 8, 'residential', 1);
      setCellBuilding(g, 5, 11, 'seaport', 1);
    } else if (prov.id === 'tr_ankara') {

    }
  }

  function resolveDiplomacyArgs(actorOrTarget, maybeTarget) {

  SoH.Simulation = {
    init: function () {

      const state = {
        day: 1,
        month: 1,
        year: 2026,
        tickCount: 0,

        viewMode: 'world', // 'world' | 'city'
        mapMode: 'political', // 'political' | 'economy' | 'military'
        playerNationId: 'turkiye',
        selectedProvinceId: 'tr_marmara',
        selectedTool: null, // building id or 'bulldoze' or 'upgrade'
        overlayMode: 'none', // 'none' | 'power' | 'water' | 'pollution' | 'happiness'
        armyMoveSourceId: null,

      // Reset TECHS unlocked flags on config
      if (SoH.CONFIG && Array.isArray(SoH.CONFIG.TECHS)) {

        });
      }

      const majorPowers = ['turkiye', 'abd', 'cin', 'rusya', 'almanya', 'ingiltere', 'fransa', 'japonya', 'hindistan'];
      const nationKeys = Object.keys(SoH.CONFIG.NATIONS);

      nationKeys.forEach(function (id) {
        const cfg = SoH.CONFIG.NATIONS[id];
        const isPlayer = id === state.playerNationId;
        const isMajor = majorPowers.indexOf(id) !== -1;

        const relations = {};
        nationKeys.forEach(function (otherId) {
          if (otherId === id) return;
          let rel = 50;
          if ((id === 'turkiye' && otherId === 'azerbaycan') || (id === 'azerbaycan' && otherId === 'turkiye')) {
            rel = 92;
          } else if ((id === 'turkiye' && otherId === 'yunanistan') || (id === 'yunanistan' && otherId === 'turkiye')) {
            rel = 32;
          } else if ((id === 'ukrayna' && otherId === 'rusya') || (id === 'rusya' && otherId === 'ukrayna')) {
            rel = 15;
          } else if ((id === 'abd' && otherId === 'ingiltere') || (id === 'ingiltere' && otherId === 'abd')) {
            rel = 85;
          } else if ((id === 'abd' && otherId === 'japonya') || (id === 'japonya' && otherId === 'abd')) {
            rel = 82;
          } else if ((id === 'almanya' && otherId === 'fransa') || (id === 'fransa' && otherId === 'almanya')) {
            rel = 80;
          } else if ((id === 'abd' && otherId === 'cin') || (id === 'cin' && otherId === 'abd')) {
            rel = 30;
          } else if ((id === 'rusya' && otherId === 'cin') || (id === 'cin' && otherId === 'rusya')) {
            rel = 76;
          }
          relations[otherId] = rel;
        });

        const initialAllies = [];
        if (id === 'turkiye') initialAllies.push('azerbaycan');
        if (id === 'azerbaycan') initialAllies.push('turkiye');

        state.nations[id] = Object.assign({}, cfg, {
          isPlayer: isPlayer,
          gold: isPlayer ? 1850 : isMajor ? 1600 : 1250,
          manpower: isPlayer ? 550 : isMajor ? 480 : 360,
          food: isPlayer ? 800 : 650,
          research: isPlayer ? 80 : 60,
          taxRate: 15,
          unlockedTechs: [],
          relations: relations,
          atWarWith: [],
          allies: initialAllies,
          goldNet: 0,
          foodNet: 0,
          manpowerNet: 0,
          researchNet: 0,
          totalPopulation: 0,
          totalGarrison: 0,
          provinceCount: 0,
          armsFactoryCount: 0,
          militaryBonus: 0
        });
      });

      bindPlayerNationAlias(state);

      // Initialize 42 Real-World Provinces
      SoH.CONFIG.PROVINCE_TEMPLATES.forEach(function (tpl) {
        const isSuperHub =
          tpl.id === 'tr_marmara' ||
          tpl.id === 'tr_ankara' ||
          tpl.id === 'us_washington' ||
          tpl.id === 'ru_moskova' ||
          tpl.id === 'cn_pekin' ||
          tpl.id === 'de_berlin';

        const divisions = tpl.isCapital
          ? { infantry: 3, tank: isSuperHub ? 2 : 1, artillery: 1, airforce: 1 }
          : isSuperHub
          ? { infantry: 3, tank: 1, artillery: 1, airforce: 1 }
          : { infantry: 2, tank: 1, artillery: 0, airforce: 0 };

        const prov = {
          id: tpl.id,
          name: tpl.name,
          cityName: tpl.cityName || tpl.name,
          owner: tpl.owner,
          isCapital: !!tpl.isCapital,
          terrain: tpl.terrain,
          bonusText: tpl.bonusText,
          bonusType: tpl.bonusType,
          center: { x: tpl.center.x, y: tpl.center.y },
          polygon: tpl.polygon.map(function (pt) { return [pt[0], pt[1]]; }),
          neighbors: tpl.neighbors.slice(),
          divisions: divisions,
          garrison: calcGarrisonFromDivisions(divisions),
          grid: createEmptyGrid(tpl),
          population: 0,
          jobs: 0,
          happiness: 78,
          powerSupply: 0,
          powerDemand: 0,
          waterSupply: 0,
          waterDemand: 0,
          goldIncome: 0,
          maintenance: 0,
          goldNet: 0,
          foodGen: 0,
          foodUse: 0,
          foodNet: 0,
          manpowerGen: 0,
          researchGen: 0,
          productionGen: 0,
          defenseBonus: 15,
          militaryPowerBonus: 0,
          avgPollution: 0,
          avgLandValue: 55
        };

        populateStarterCity(prov);
        state.provinces[prov.id] = prov;
      });

      SoH.state = state;

      // Recalculate all provinces and nation totals
      Object.keys(state.provinces).forEach(function (provId) {
        SoH.Simulation.recalculateProvince(provId, true);
      });
      SoH.Simulation.recalculateNationStats();

      SoH.Simulation.addLog('🇹🇷 Türkiye Cumhuriyeti yönetimine geçtiniz. İstanbul ve Ankara metropolleri imara hazır!', 'info');
      SoH.Simulation.addLog('🇦🇿 Azerbaycan ile stratejik kardeşlik ve askeri ittifak yürürlükte.', 'diplomacy');
      SoH.Simulation.addLog('🌍 Dünya üzerindeki 19 devletten dilediğinizi Diplomasi veya Üst Menüden seçip yönetebilirsiniz!', 'info');

      return state;
    },

    switchPlayerNation: function (nationId) {
      const state = SoH.state;
      if (!state || !state.nations || !state.nations[nationId]) {
        return { ok: false, reason: 'Geçersiz devlet seçimi.' };
      }

      Object.keys(state.nations).forEach(function (id) {
        state.nations[id].isPlayer = id === nationId;
      });

      state.playerNationId = nationId;
      state.armyMoveSourceId = null;
      bindPlayerNationAlias(state);

      const newNation = state.nations[nationId];

      // Sync TECHS unlocked flags on config
      if (SoH.CONFIG && Array.isArray(SoH.CONFIG.TECHS)) {
        SoH.CONFIG.TECHS.forEach(function (t) {
          t.unlocked = newNation.unlockedTechs.indexOf(t.id) !== -1;
        });
      }

      // Select capital or first owned province of the switched nation
      const owned = Object.keys(state.provinces)
        .map(function (pId) { return state.provinces[pId]; })
        .filter(function (p) { return p.owner === nationId; });

      if (owned.length > 0) {
        const cap = owned.find(function (p) { return p.isCapital; }) || owned[0];
        state.selectedProvinceId = cap.id;
      }

      this.recalculateNationStats();
      this.addLog(
        `${newNation.flag || '🏳️'} Artık ${newNation.name} devletini yönetiyorsunuz! Başkent: ${
          state.provinces[state.selectedProvinceId] ? state.provinces[state.selectedProvinceId].cityName : ''
        }`,
        'info'
      );

      if (SoH.UI && typeof SoH.UI.refresh === 'function') {
        SoH.UI.refresh();
      }

      return { ok: true, nation: newNation };
    },

    recalculateProvince: function (provId, skipNationSync) {
      const state = SoH.state;
      if (!state || !state.provinces || !state.provinces[provId]) return null;

      const prov = state.provinces[provId];
      syncDivisionsFromGarrison(prov);

      const nation = state.nations[prov.owner] || state.nations[state.playerNationId];
      const unlockedTechs = (nation && nation.unlockedTechs) || [];
      const hasSmartGrid = unlockedTechs.indexOf('smart_grid') !== -1;
      const hasUrbanPlanning = unlockedTechs.indexOf('urban_planning') !== -1;
      const hasGreenFilter = unlockedTechs.indexOf('green_filter') !== -1;
      const hasHighSpeedRail = unlockedTechs.indexOf('high_speed_rail') !== -1;
      const hasNuclearProgram = unlockedTechs.indexOf('nuclear_program') !== -1;

      const size = SoH.CONFIG.GRID_SIZE || 14;
      const grid = prov.grid;

      const powerPlants = [];
      const waterTowers = [];
      const polluters = [];
      const greenAndService = [];

      let powerSupply = 0;
      let powerDemand = 0;
      let waterSupply = 0;
      let waterDemand = 0;

      // Pass 1: Reset cell stats & gather utility/service sources
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = grid[y][x];
          cell.pollution = 0;
          cell.landValue = cell.terrain === 'water_edge' ? 62 : 50;
          cell.powered = false;
          cell.watered = false;
          cell.roadConnected = false;

          if (cell.building && cell.building.type === 'road') {
            cell.roadConnected = true;
          } else {
            const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            for (let d = 0; d < dirs.length; d++) {
              const nx = x + dirs[d][0];
              const ny = y + dirs[d][1];
              if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
                const nCell = grid[ny][nx];
                if (nCell.building && nCell.building.type === 'road') {
                  cell.roadConnected = true;
                  break;
                }
              }
            }
          }

          if (cell.building) {
            const bType = cell.building.type;
            const bCfg = SoH.CONFIG.BUILDINGS[bType];
            if (!bCfg) continue;

            const lvl = cell.building.level || 1;
            const lvlMult = 1 + (lvl - 1) * 0.6;

            if (bCfg.powerUse) powerDemand += bCfg.powerUse * (1 + (lvl - 1) * 0.25);
            if (bCfg.waterUse) waterDemand += bCfg.waterUse * (1 + (lvl - 1) * 0.25);

            if (bType === 'power_plant') {
              let pGen = (bCfg.powerGen || 180) * lvlMult;
              if (hasSmartGrid) pGen *= 1.35;
              if (prov.bonusType === 'power_plant') pGen *= 1.25;
              powerSupply += Math.round(pGen);
              powerPlants.push({ x: x, y: y });
            }

            if (bType === 'water_tower') {
              let wGen = (bCfg.waterGen || 180) * lvlMult;
              if (prov.bonusType === 'water_tower' || prov.bonusType === 'residential') wGen *= 1.25;
              waterSupply += Math.round(wGen);
              waterTowers.push({ x: x, y: y });
            }

            if (bCfg.pollution) {
              let pol = bCfg.pollution * (1 + (lvl - 1) * 0.25);
              if (hasGreenFilter) pol *= 0.55;
              polluters.push({ x: x, y: y, amount: pol });
            }

            if (bType === 'park' || bType === 'hospital' || bType === 'university' || bType === 'airport') {
              greenAndService.push({
                x: x,
                y: y,
                type: bType,
                clean: bCfg.pollutionClean || (bType === 'hospital' ? 8 : bType === 'university' ? 6 : 0),
                landBoost: bType === 'park' ? 22 : bType === 'hospital' ? 16 : 15,
                happinessBonus: (bCfg.happinessBonus || 10) * (1 + (lvl - 1) * 0.3)
              });
            }
          }
        }
      }

      powerDemand = Math.round(powerDemand);
      waterDemand = Math.round(waterDemand);

      const powerSufficient = powerSupply >= powerDemand && powerSupply > 0;
      const waterSufficient = waterSupply >= waterDemand && waterSupply > 0;

      // Pass 2: Power, water, pollution, landValue per tile
      let totalPollution = 0;
      let totalLandValue = 0;
      let residentialPollutionPenalty = 0;
      let residentialCount = 0;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = grid[y][x];

          if (powerSupply > 0) {
            for (let i = 0; i < powerPlants.length; i++) {
              const pp = powerPlants[i];
              const dist = Math.hypot(x - pp.x, y - pp.y);
              if (dist <= 7.5 || (powerSufficient && dist <= 9.5)) {
                cell.powered = true;
                break;
              }
            }
            if (!cell.powered && powerSufficient && cell.roadConnected && powerPlants.length > 0) {
              cell.powered = true;
            }
          }

          if (waterSupply > 0) {
            for (let i = 0; i < waterTowers.length; i++) {
              const wt = waterTowers[i];
              const dist = Math.hypot(x - wt.x, y - wt.y);
              if (dist <= 7.5 || (waterSufficient && dist <= 9.5)) {
                cell.watered = true;
                break;
              }
            }
            if (!cell.watered && waterSufficient && cell.roadConnected && waterTowers.length > 0) {
              cell.watered = true;
            }
          }

          for (let i = 0; i < polluters.length; i++) {
            const p = polluters[i];
            const dist = Math.max(Math.abs(x - p.x), Math.abs(y - p.y));
            if (dist <= 2) {
              const factor = dist === 0 ? 1.0 : dist === 1 ? 0.65 : 0.35;
              cell.pollution += Math.round(p.amount * factor);
              cell.landValue -= Math.round(p.amount * factor * 0.55);
            }
          }

          for (let i = 0; i < greenAndService.length; i++) {
            const gs = greenAndService[i];
            const dist = Math.max(Math.abs(x - gs.x), Math.abs(y - gs.y));
            if (dist <= 2) {
              const factor = dist === 0 ? 1.0 : dist === 1 ? 0.8 : 0.5;
              if (gs.clean > 0) {
                cell.pollution -= Math.round(gs.clean * factor);
              }
              cell.landValue += Math.round(gs.landBoost * factor);
            }
          }

          if (cell.roadConnected) cell.landValue += 5;
          if (cell.powered && cell.watered) cell.landValue += 5;

          cell.pollution = clamp(cell.pollution, 0, 100);
          cell.landValue = clamp(cell.landValue, 10, 100);

          totalPollution += cell.pollution;
          totalLandValue += cell.landValue;

          if (cell.building && cell.building.type === 'residential') {
            residentialCount++;
            if (cell.pollution > 12) {
              residentialPollutionPenalty += (cell.pollution - 12) * 0.35;
            }
          }
        }
      }

      // Pass 3: Aggregate province economy, population, military & services
      let population = 120; // base metropolitan/provincial population
      let jobs = 0;
      let happiness = 74;
      let goldIncome = 16;
      let maintenance = 0;
      let foodGen = 28;
      let manpowerGen = 10;
      let researchGen = 3;
      let productionGen = 0;
      let defenseBonus = prov.isCapital ? 25 : 15;
      let militaryPowerBonus = 0;
      let armsFactoriesInProv = 0;
      let serviceHappinessBonus = 0;

      const taxRate = nation ? nation.taxRate : 15;

      happiness += (15 - taxRate) * 1.25;
      if (hasGreenFilter) happiness += 12;
      if (powerDemand > powerSupply) happiness -= 15;
      if (waterDemand > waterSupply) happiness -= 15;
      if (residentialCount > 0) {
        happiness -= Math.min(25, residentialPollutionPenalty / residentialCount);
      }

      for (let i = 0; i < greenAndService.length; i++) {
        let hBonus = greenAndService[i].happinessBonus;
        if (prov.bonusType === 'park' && greenAndService[i].type === 'park') hBonus *= 1.25;
        serviceHappinessBonus += hBonus;
      }
      happiness += Math.min(38, serviceHappinessBonus);
      happiness = clamp(Math.round(happiness), 0, 100);

      const happinessMult = 0.65 + (happiness / 100) * 0.55;
      const taxIncomeMult = 0.55 + (taxRate / 15) * 0.45;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = grid[y][x];
          if (!cell.building) continue;

          const bType = cell.building.type;
          const bCfg = SoH.CONFIG.BUILDINGS[bType];
          if (!bCfg) continue;

          const lvl = cell.building.level || 1;
          const lvlMult = 1 + (lvl - 1) * 0.6;

          let eff = 1.0;
          if (bCfg.powerUse > 0 && !cell.powered) eff *= 0.55;
          if (bCfg.waterUse > 0 && !cell.watered) eff *= 0.55;
          if (bType !== 'road' && bType !== 'power_plant' && bType !== 'water_tower' && cell.roadConnected) {
            eff *= 1.1;
          }

          if (prov.bonusType === bType) {
            eff *= 1.3;
          }

          maintenance += (bCfg.maintenance || 0) * (1 + (lvl - 1) * 0.35);

          if (bCfg.popCapacity) {
            population += Math.round(bCfg.popCapacity * lvlMult * eff);
          }

          if (bCfg.jobs) {
            jobs += Math.round(bCfg.jobs * lvlMult);
          }

          if (bCfg.taxBase) {
            let resTax = bCfg.taxBase * lvlMult * eff * taxIncomeMult * happinessMult * (cell.landValue / 55);
            if (hasUrbanPlanning) resTax *= 1.25;
            goldIncome += resTax;
          }

          if (bCfg.goldGen) {
            let gGen = bCfg.goldGen * lvlMult * eff * happinessMult;
            if (bType === 'commercial' || bType === 'seaport' || bType === 'airport') {
              gGen *= 0.75 + (taxRate / 15) * 0.25;
              if (hasUrbanPlanning) gGen *= 1.25;
              if (hasHighSpeedRail) gGen *= 1.2;
            }
            goldIncome += gGen;
          }

          if (bCfg.foodGen) {
            foodGen += bCfg.foodGen * lvlMult * eff;
          }

          if (bCfg.productionGen) {
            productionGen += bCfg.productionGen * lvlMult * eff;
          }

          if (bCfg.manpowerGen) {
            manpowerGen += bCfg.manpowerGen * lvlMult * eff;
          }

          if (bCfg.researchGen) {
            let rGen = bCfg.researchGen * lvlMult * eff;
            if (hasNuclearProgram) rGen *= 1.4;
            researchGen += rGen;
          }

          if (bCfg.defenseBonus) {
            defenseBonus += bCfg.defenseBonus * lvlMult;
          }

          if (bType === 'arms_factory') {
            armsFactoriesInProv += lvl;
            militaryPowerBonus += (bCfg.militaryPowerBonus || 8) * lvlMult;
          }
        }
      }

      if (hasNuclearProgram) {
        defenseBonus += 35;
      }

      manpowerGen += Math.round(population * 0.015);
      const foodUse = Math.round(population * 0.05 + prov.garrison * 0.04);

      prov.population = Math.round(population);
      prov.jobs = Math.round(jobs);
      prov.happiness = happiness;
      prov.powerSupply = powerSupply;
      prov.powerDemand = powerDemand;
      prov.waterSupply = waterSupply;
      prov.waterDemand = waterDemand;
      prov.goldIncome = Math.round(goldIncome);
      prov.maintenance = Math.round(maintenance);
      prov.goldNet = Math.round(goldIncome - maintenance);
      prov.foodGen = Math.round(foodGen);
      prov.foodUse = foodUse;
      prov.foodNet = Math.round(foodGen - foodUse);
      prov.manpowerGen = Math.round(manpowerGen);
      prov.researchGen = Math.round(researchGen);
      prov.productionGen = Math.round(productionGen);
      prov.defenseBonus = Math.round(defenseBonus);
      prov.militaryPowerBonus = Math.round(militaryPowerBonus);
      prov.armsFactoryCount = armsFactoriesInProv;
      prov.avgPollution = Math.round(totalPollution / (size * size));
      prov.avgLandValue = Math.round(totalLandValue / (size * size));

      if (!skipNationSync) {
        this.recalculateNationStats();
      }
      return prov;
    },

    recalculateNationStats: function () {
      const state = SoH.state;
      if (!state || !state.nations || !state.provinces) return;

      Object.keys(state.nations).forEach(function (nId) {
        const n = state.nations[nId];
        n.goldNet = 0;
        n.foodNet = 0;
        n.manpowerNet = 0;
        n.researchNet = 0;
        n.totalPopulation = 0;
        n.totalGarrison = 0;
        n.provinceCount = 0;
        n.armsFactoryCount = 0;
        n.militaryBonus = 0;
      });

      Object.keys(state.provinces).forEach(function (pId) {
        const p = state.provinces[pId];
        const n = state.nations[p.owner];
        if (!n) return;
        n.goldNet += p.goldNet || 0;
        n.foodNet += p.foodNet || 0;
        n.manpowerNet += p.manpowerGen || 0;
        n.researchNet += p.researchGen || 0;
        n.totalPopulation += p.population || 0;
        n.totalGarrison += p.garrison || 0;
        n.provinceCount += 1;
        n.armsFactoryCount += p.armsFactoryCount || 0;
      });

      Object.keys(state.nations).forEach(function (nId) {
        const n = state.nations[nId];
        // Each arms_factory level increases national army attack/defense multiplier by +5%
        n.militaryBonus = (n.armsFactoryCount || 0) * 5;
      });
    },

    placeBuilding: function (provId, x, y, buildingType, isAi) {
      isAi = !!isAi;
      const state = SoH.state;
      const prov = state.provinces[provId];
      if (!prov) {
        return { ok: false, reason: 'Eyalet bulunamadı.' };
      }

      if (!isAi && !isPlayerNation(prov.owner)) {
        return { ok: false, reason: 'Sadece kendi devletinize ait şehirlerde inşaat yapabilirsiniz!' };
      }

      const size = SoH.CONFIG.GRID_SIZE || 14;
      if (x < 0 || x >= size || y < 0 || y >= size) {
        return { ok: false, reason: 'Geçersiz kare koordinatı.' };
      }

      const bCfg = SoH.CONFIG.BUILDINGS[buildingType];
      if (!bCfg) {
        return { ok: false, reason: 'Geçersiz bina tipi.' };
      }

      const cell = prov.grid[y][x];
      if (cell.building) {
        if (cell.building.type === buildingType && !isAi) {
          return this.upgradeBuilding(provId, x, y, isAi);
        }
        return { ok: false, reason: 'Bu karede zaten bir yapı bulunuyor. Önce yıkım aracını kullanın.' };
      }

      const nation = state.nations[prov.owner];
      if (!nation || nation.gold < bCfg.cost) {
        return { ok: false, reason: `Yetersiz Hazine! (${bCfg.cost} Altın gerekli)` };
      }

      nation.gold -= bCfg.cost;
      cell.building = {
        type: buildingType,
        level: 1,
        xp: 0
      };

      this.recalculateProvince(provId);

      if (!isAi) {
        this.addLog(`${prov.cityName || prov.name} şehrine ${bCfg.name} inşa edildi (-${bCfg.cost} Altın).`, 'city');
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return { ok: true, cell: cell };
    },

    bulldoze: function (provId, x, y, isAi) {
      isAi = !!isAi;
      const state = SoH.state;
      const prov = state.provinces[provId];
      if (!prov) return { ok: false, reason: 'Eyalet bulunamadı.' };

      if (!isAi && !isPlayerNation(prov.owner)) {
        return { ok: false, reason: 'Sadece kendi eyaletlerinizde yıkım yapabilirsiniz!' };
      }

      const size = SoH.CONFIG.GRID_SIZE || 14;
      if (x < 0 || x >= size || y < 0 || y >= size) {
        return { ok: false, reason: 'Geçersiz koordinat.' };
      }

      const cell = prov.grid[y][x];
      if (!cell.building) {
        return { ok: false, reason: 'Bu karede yıkılacak bir bina yok.' };
      }

      const bCfg = SoH.CONFIG.BUILDINGS[cell.building.type];
      const refund = bCfg ? Math.round(bCfg.cost * 0.25) : 5;
      const bName = bCfg ? bCfg.name : 'Yapı';

      cell.building = null;
      const nation = state.nations[prov.owner];
      if (nation) {
        nation.gold += refund;
      }

      this.recalculateProvince(provId);

      if (!isAi) {
        this.addLog(`${prov.cityName || prov.name}: ${bName} yıkıldı (+${refund} Altın iade).`, 'city');
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return { ok: true, refund: refund };
    },

    getUpgradeCost: function (building) {
      if (!building) return 0;
      const bCfg = SoH.CONFIG.BUILDINGS[building.type];
      if (!bCfg) return 0;
      return Math.round(bCfg.cost * 0.8 * (building.level || 1));
    },

    upgradeBuilding: function (provId, x, y, isAi) {
      isAi = !!isAi;
      const state = SoH.state;
      const prov = state.provinces[provId];
      if (!prov) return { ok: false, reason: 'Eyalet bulunamadı.' };

      if (!isAi && !isPlayerNation(prov.owner)) {
        return { ok: false, reason: 'Sadece kendi şehirlerinizdeki binaları geliştirebilirsiniz!' };
      }

      const size = SoH.CONFIG.GRID_SIZE || 14;
      if (x < 0 || x >= size || y < 0 || y >= size) {
        return { ok: false, reason: 'Geçersiz koordinat.' };
      }

      const cell = prov.grid[y][x];
      if (!cell.building) {
        return { ok: false, reason: 'Geliştirilecek bina bulunamadı.' };
      }

      const upgradableTypes = [
        'residential',
        'commercial',
        'industrial',
        'farm',
        'hospital',
        'university',
        'seaport',
        'airport',
        'barracks',
        'arms_factory'
      ];
      if (upgradableTypes.indexOf(cell.building.type) === -1) {
        return { ok: false, reason: 'Bu altyapı binası seviye yükseltmeye uygun değil.' };
      }

      if (cell.building.level >= 3) {
        return { ok: false, reason: 'Bina zaten maksimum seviyede (Seviye 3)!' };
      }

      const cost = this.getUpgradeCost(cell.building);
      const nation = state.nations[prov.owner];
      if (!nation || nation.gold < cost) {
        return { ok: false, reason: `Geliştirme için ${cost} Altın gerekli!` };
      }

      nation.gold -= cost;
      cell.building.level += 1;
      cell.building.xp = 0;

      const bCfg = SoH.CONFIG.BUILDINGS[cell.building.type];
      this.recalculateProvince(provId);

      if (!isAi) {
        this.addLog(
          `${prov.cityName || prov.name}: ${bCfg.name} Seviye ${cell.building.level}'e yükseltildi (-${cost} Altın).`,
          'city'
        );
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return { ok: true, newLevel: cell.building.level, cost: cost };
    },

    tick: function () {
      const state = SoH.state;
      if (!state) return;

      state.tickCount += 1;

      // Advance calendar date (day 1..30, month 1..12, year)
      state.day += 1;
      if (state.day > 30) {
        state.day = 1;
        state.month += 1;
        if (state.month > 12) {
          state.month = 1;
          state.year += 1;
        }
      }

      // Auto-grow powered, watered, road-connected zones
      const autoGrowTypes = ['residential', 'commercial', 'industrial', 'farm', 'barracks', 'arms_factory'];
      const size = SoH.CONFIG.GRID_SIZE || 14;

      Object.keys(state.provinces).forEach(function (provId) {
        const prov = state.provinces[provId];
        let leveledUp = false;

        if (prov.happiness >= 65) {
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              const cell = prov.grid[y][x];
              const b = cell.building;
              if (
                b &&
                b.level < 3 &&
                autoGrowTypes.indexOf(b.type) !== -1 &&
                cell.powered &&
                cell.watered &&
                cell.roadConnected
              ) {
                const gain = 5 + Math.floor((prov.happiness - 60) / 8) + (cell.landValue > 65 ? 3 : 0);
                b.xp = (b.xp || 0) + gain;
                if (b.xp >= 100) {
                  b.xp = 0;
                  b.level += 1;
                  leveledUp = true;
                  if (isPlayerNation(prov.owner)) {
                    const bCfg = SoH.CONFIG.BUILDINGS[b.type];
                    SoH.Simulation.addLog(
                      `${prov.cityName || prov.name} şehrinde ${bCfg.name} gelişerek Seviye ${b.level} gökdelene dönüştü!`,
                      'city'
                    );
                  }
                }
              }
            }
          }
        }

        if (leveledUp || state.tickCount % 5 === 0) {
          SoH.Simulation.recalculateProvince(provId, true);
        }
      });

      this.recalculateNationStats();

      // Update national treasuries & resources
      Object.keys(state.nations).forEach(function (nId) {
        const n = state.nations[nId];
        const goldStep = Math.round(n.goldNet * 0.22);
        const foodStep = Math.round(n.foodNet * 0.18);
        const mpStep = Math.round(n.manpowerNet * 0.14);
        const resStep = Math.max(1, Math.round(n.researchNet * 0.18));

        n.gold = Math.max(0, n.gold + goldStep);
        n.food = clamp(n.food + foodStep, 0, 999999);
        n.manpower = clamp(n.manpower + mpStep, 0, 999999);
        n.research = clamp(n.research + resStep, 0, 999999);
      });

      // Player Auto-Governor (City Builder automation)
      if (state.autoGovernor && state.tickCount % 2 === 0) {
        this.runAutoGovernor(state.playerNationId);
      }

      // Player Auto-Marshal (HOI4 Frontline Marshal automation)
      if (state.autoMarshal && state.tickCount % 2 === 0) {
        this.runAutoMarshal(state.playerNationId);
      }

      // AI Tick every 3 ticks
      if (state.tickCount % 3 === 0 && SoH.AI && typeof SoH.AI.tick === 'function') {
        SoH.AI.tick();
      }

      // Advance active marching armies & battles
      if (state.activeBattles && state.activeBattles.length > 0) {
        for (let i = state.activeBattles.length - 1; i >= 0; i--) {
          const b = state.activeBattles[i];
          const step = 1 / Math.max(2, b.durationTicks || 3.5);
          b.progress = (b.progress || 0) + step;
          if (b.progress >= 1) {
            state.activeBattles.splice(i, 1);
          }
        }
      }

      if (SoH.UI && typeof SoH.UI.onTick === 'function') {
        SoH.UI.onTick();
      }
    },

    runAutoGovernor: function (nationId) {
      const state = SoH.state;
      nationId = resolveNationId(nationId);
      const nation = state.nations[nationId];
      if (!nation || nation.gold < 260) return;

      const ownedProvs = Object.keys(state.provinces)
        .map(function (id) { return state.provinces[id]; })
        .filter(function (p) { return p.owner === nationId; });

      if (ownedProvs.length === 0) return;
      const prov = ownedProvs[state.tickCount % ownedProvs.length];

      let buildType = null;
      if (prov.powerDemand + 18 >= prov.powerSupply) {
        buildType = 'power_plant';
      } else if (prov.waterDemand + 18 >= prov.waterSupply) {
        buildType = 'water_tower';
      } else if (prov.happiness < 68) {
        buildType = state.tickCount % 2 === 0 ? 'park' : 'hospital';
      } else if (prov.foodNet < 12) {
        buildType = 'farm';
      } else {
        const choices = [
          'residential',
          'commercial',
          'industrial',
          'hospital',
          'university',
          'seaport',
          'airport',
          'barracks',
          'arms_factory'
        ];
        buildType = choices[state.tickCount % choices.length];
      }

      const bCfg = SoH.CONFIG.BUILDINGS[buildType];
      if (!bCfg || nation.gold < bCfg.cost + 140) return;

      const size = SoH.CONFIG.GRID_SIZE || 14;
      let targetCell = null;
      for (let y = 1; y < size - 1 && !targetCell; y++) {
        for (let x = 1; x < size - 1; x++) {
          const c = prov.grid[y][x];
          if (!c.building && c.roadConnected) {
            targetCell = c;
            break;
          }
        }
      }

      if (!targetCell) {
        for (let y = 1; y < size - 1 && !targetCell; y++) {
          for (let x = 1; x < size - 1; x++) {
            const c = prov.grid[y][x];
            if (c.building && c.building.type === 'road') {
              const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
              for (let d = 0; d < dirs.length; d++) {
                const nx = x + dirs[d][0];
                const ny = y + dirs[d][1];
                if (nx >= 1 && nx < size - 1 && ny >= 1 && ny < size - 1 && !prov.grid[ny][nx].building) {
                  this.placeBuilding(prov.id, nx, ny, 'road', true);
                  return;
                }
              }
            }
          }
        }
      }

      if (targetCell) {
        const res = this.placeBuilding(prov.id, targetCell.x, targetCell.y, buildType, true);
        if (res.ok && isPlayerNation(nationId)) {
          this.addLog(`Oto-Vali: ${prov.cityName || prov.name} şehrine ${bCfg.name} inşa etti.`, 'city');
        }
      }
    },

    runAutoMarshal: function (nationId) {
      const state = SoH.state;
      nationId = resolveNationId(nationId);
      const nation = state.nations[nationId];
      if (!nation) return;

      const ownedProvs = Object.keys(state.provinces)
        .map(function (id) { return state.provinces[id]; })
        .filter(function (p) { return p.owner === nationId; });

      if (ownedProvs.length === 0) return;

      // 1. Recruit divisions if treasury & manpower are healthy
      if (nation.gold >= 480 && nation.manpower >= 120) {
        const borderProvs = ownedProvs.filter(function (p) {
          return p.neighbors.some(function (nId) {
            return state.provinces[nId] && state.provinces[nId].owner !== nationId;
          });
        });
        const targetProv = borderProvs.length > 0 ? borderProvs[state.tickCount % borderProvs.length] : ownedProvs[0];
        const unitTypes = ['infantry', 'tank', 'artillery', 'airforce'];
        const chosenUnit = unitTypes[state.tickCount % unitTypes.length];
        this.recruitUnit(targetProv.id, chosenUnit, nationId);
      }

      // 2. If at war, attack weaker adjacent enemy provinces
      if (nation.atWarWith && nation.atWarWith.length > 0) {
        for (let i = 0; i < ownedProvs.length; i++) {
          const myProv = ownedProvs[i];
          if (myProv.garrison < 160) continue;

          for (let j = 0; j < myProv.neighbors.length; j++) {
            const nProv = state.provinces[myProv.neighbors[j]];
            if (nProv && nation.atWarWith.indexOf(nProv.owner) !== -1) {
              if (myProv.garrison > nProv.garrison * 1.15) {
                this.orderArmyAction(myProv.id, nProv.id, Math.round(myProv.garrison * 0.65));
                return;
              }
            }
          }
        }
      }
    },

    recruitUnit: function (provId, unitType, nationId) {
      const state = SoH.state;
      nationId = resolveNationId(nationId);
      unitType = unitType || 'infantry';

      const prov = state.provinces[provId];
      if (!prov) return { ok: false, reason: 'Eyalet bulunamadı.' };
      if (prov.owner !== nationId) {
        return { ok: false, reason: 'Sadece kendi eyaletlerinizde tümen eğitebilirsiniz!' };
      }

      const uCfg = SoH.CONFIG.UNIT_TYPES && SoH.CONFIG.UNIT_TYPES[unitType];
      if (!uCfg) {
        return { ok: false, reason: 'Geçersiz birlik tipi.' };
      }

      const nation = state.nations[nationId];
      if (!nation || nation.gold < uCfg.goldCost) {
        return { ok: false, reason: `${uCfg.shortName} eğitimi için ${uCfg.goldCost} Altın gerekli!` };
      }
      if (nation.manpower < uCfg.manpowerCost) {
        return { ok: false, reason: `Yetersiz İnsan Gücü! (${uCfg.manpowerCost} İnsan Gücü gerekli)` };
      }

      nation.gold -= uCfg.goldCost;
      nation.manpower -= uCfg.manpowerCost;

      if (!prov.divisions) {
        prov.divisions = { infantry: 2, tank: 0, artillery: 0, airforce: 0 };
      }
      prov.divisions[unitType] = (prov.divisions[unitType] || 0) + 1;
      prov.garrison += UNIT_GARRISON_WEIGHTS[unitType] || 60;

      this.recalculateProvince(provId);

      if (isPlayerNation(nationId)) {
        this.addLog(
          `${prov.cityName || prov.name} karargahında ${uCfg.icon} +1 ${uCfg.name} göreve hazır (-${uCfg.goldCost} Altın).`,
          'war'
        );
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return {
        ok: true,
        unitType: unitType,
        divisions: prov.divisions,
        garrison: prov.garrison
      };
    },

    recruitArmy: function (provId, troopCountOrUnitType, nationId) {
      if (
        typeof troopCountOrUnitType === 'string' &&
        SoH.CONFIG.UNIT_TYPES &&
        SoH.CONFIG.UNIT_TYPES[troopCountOrUnitType]
      ) {
        return this.recruitUnit(provId, troopCountOrUnitType, nationId);
      }

      nationId = resolveNationId(nationId);
      const troopCount = Math.max(20, Math.round(Number(troopCountOrUnitType) || 60));

      const state = SoH.state;
      const prov = state.provinces[provId];
      if (!prov) return { ok: false, reason: 'Eyalet bulunamadı.' };
      if (prov.owner !== nationId) {
        return { ok: false, reason: 'Sadece kendi eyaletlerinizde asker toplayabilirsiniz!' };
      }

      const nation = state.nations[nationId];
      const goldCost = troopCount * 2;
      const mpCost = troopCount;

      if (nation.gold < goldCost) {
        return { ok: false, reason: `Asker toplamak için ${goldCost} Altın gerekli!` };
      }
      if (nation.manpower < mpCost) {
        return { ok: false, reason: `Yetersiz İnsan Gücü! (${mpCost} İnsan Gücü gerekli)` };
      }

      nation.gold -= goldCost;
      nation.manpower -= mpCost;
      prov.garrison += troopCount;
      if (!prov.divisions) {
        prov.divisions = { infantry: 2, tank: 0, artillery: 0, airforce: 0 };
      }
      prov.divisions.infantry = (prov.divisions.infantry || 0) + Math.max(1, Math.round(troopCount / 60));

      this.recalculateProvince(provId);

      if (isPlayerNation(nationId)) {
        this.addLog(
          `${prov.cityName || prov.name} kışlalarında +${troopCount} yeni asker silah altına alındı (-${goldCost} Altın).`,
          'war'
        );
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return { ok: true, recruited: troopCount, garrison: prov.garrison };
    },

    orderArmyAction: function (fromProvId, toProvId, troopCount) {
      const state = SoH.state;
      const fromProv = state.provinces[fromProvId];
      const toProv = state.provinces[toProvId];

      if (!fromProv || !toProv) {
        return { ok: false, reason: 'Geçersiz eyalet seçimi.' };
      }
      if (fromProvId === toProvId) {
        return { ok: false, reason: 'Hedef eyalet başlangıç eyaleti ile aynı olamaz.' };
      }
      if (fromProv.neighbors.indexOf(toProvId) === -1) {
        return { ok: false, reason: 'Ordular sadece sınır komşusu olan eyaletlere ilerleyebilir!' };
      }

      const maxMove = Math.max(0, fromProv.garrison - 40);
      if (maxMove < 20) {
        return {
          ok: false,
          reason: `${fromProv.cityName || fromProv.name} garnizonunda hareket edebilecek yeterli birlik yok (en az 60 birim olmalı).`
        };
      }

      let sendTroops = troopCount ? Math.round(Number(troopCount)) : Math.round(fromProv.garrison * 0.65);
      sendTroops = clamp(sendTroops, 20, maxMove);

      const moveRatio = clamp(sendTroops / Math.max(1, fromProv.garrison), 0.2, 0.85);
      syncDivisionsFromGarrison(fromProv);
      syncDivisionsFromGarrison(toProv);

      const sentDivisions = {
        infantry: Math.max(1, Math.round((fromProv.divisions.infantry || 1) * moveRatio)),
        tank: Math.round((fromProv.divisions.tank || 0) * moveRatio),
        artillery: Math.round((fromProv.divisions.artillery || 0) * moveRatio),
        airforce: Math.round((fromProv.divisions.airforce || 0) * moveRatio)
      };

      fromProv.divisions.infantry = Math.max(1, (fromProv.divisions.infantry || 1) - sentDivisions.infantry);
      fromProv.divisions.tank = Math.max(0, (fromProv.divisions.tank || 0) - sentDivisions.tank);
      fromProv.divisions.artillery = Math.max(0, (fromProv.divisions.artillery || 0) - sentDivisions.artillery);
      fromProv.divisions.airforce = Math.max(0, (fromProv.divisions.airforce || 0) - sentDivisions.airforce);
      fromProv.garrison = Math.max(40, fromProv.garrison - sendTroops);

      const attackerNationId = fromProv.owner;
      const defenderNationId = toProv.owner;
      const attackerNation = state.nations[attackerNationId];
      const defenderNation = state.nations[defenderNationId];
      const isFriendlyMove = attackerNationId === defenderNationId;

      const hasHighSpeedRail = attackerNation && attackerNation.unlockedTechs.indexOf('high_speed_rail') !== -1;
      const durationTicks = hasHighSpeedRail ? 2.2 : 3.4;

      if (isFriendlyMove) {
        toProv.garrison += sendTroops;
        toProv.divisions.infantry = (toProv.divisions.infantry || 0) + sentDivisions.infantry;
        toProv.divisions.tank = (toProv.divisions.tank || 0) + sentDivisions.tank;
        toProv.divisions.artillery = (toProv.divisions.artillery || 0) + sentDivisions.artillery;
        toProv.divisions.airforce = (toProv.divisions.airforce || 0) + sentDivisions.airforce;

        state.activeBattles.push({
          id: 'move_' + battleIdCounter++,
          fromId: fromProvId,
          toId: toProvId,
          attackerNation: attackerNationId,
          defenderNation: defenderNationId,
          isFriendlyMove: true,
          troops: sendTroops,
          divisions: sentDivisions,
          attackerPower: sendTroops,
          defenderPower: 0,
          won: true,
          progress: 0.08,
          durationTicks: durationTicks,
          createdAt: Date.now()
        });

        this.recalculateProvince(fromProvId);
        this.recalculateProvince(toProvId);

        if (isPlayerNation(attackerNationId)) {
          this.addLog(
            `🪖 ${fromProv.cityName || fromProv.name} -> ${toProv.cityName || toProv.name} hattına ${sendTroops} mevcutlu kolordu intikal etti.`,
            'info'
          );
          if (SoH.UI && typeof SoH.UI.refresh === 'function') {
            SoH.UI.refresh();
          }
        }
        return { ok: true, type: 'transfer', troops: sendTroops };
      }

      // Hostile attack: automatically declare war if not already at war
      if (attackerNation && attackerNation.atWarWith.indexOf(defenderNationId) === -1) {
        this.declareWar(attackerNationId, defenderNationId);
      }

      // Compute multi-division combat modifiers
      let attackerMult = 1.0 + ((attackerNation && attackerNation.militaryBonus) || 0) / 100;
      if (attackerNation && attackerNation.unlockedTechs.indexOf('siha_doctrine') !== -1) {
        attackerMult += 0.3;
      }
      if (sentDivisions.tank > 0) attackerMult += sentDivisions.tank * 0.08;
      if (sentDivisions.artillery > 0) attackerMult += sentDivisions.artillery * 0.06;
      if (sentDivisions.airforce > 0) attackerMult += sentDivisions.airforce * 0.12;
      if (fromProv.happiness >= 75) attackerMult += 0.08;

      // Airforce breaks enemy fortification defense bonus by 40%
      const effectiveDefBonus =
        sentDivisions.airforce > 0 ? (toProv.defenseBonus || 15) * 0.6 : toProv.defenseBonus || 15;

      let defenderMult = 1.0 + effectiveDefBonus / 100 + ((defenderNation && defenderNation.militaryBonus) || 0) / 100;
      if (defenderNation && defenderNation.unlockedTechs.indexOf('nuclear_program') !== -1) {
        defenderMult += 0.25;
      }
      if (toProv.divisions && toProv.divisions.tank > 0) {
        defenderMult += toProv.divisions.tank * 0.06;
      }

      const attackerPower = sendTroops * attackerMult;
      const defenderPower = Math.max(20, toProv.garrison) * defenderMult;
      const won = attackerPower > defenderPower;

      state.activeBattles.push({
        id: 'bat_' + battleIdCounter++,
        fromId: fromProvId,
        toId: toProvId,
        attackerNation: attackerNationId,
        defenderNation: defenderNationId,
        isFriendlyMove: false,
        troops: sendTroops,
        divisions: sentDivisions,
        attackerPower: Math.round(attackerPower),
        defenderPower: Math.round(defenderPower),
        won: won,
        progress: 0.06,
        durationTicks: durationTicks,
        createdAt: Date.now()
      });

        toProv.divisions = {

      actor.atWarWith = actor.atWarWith.filter(function (id) { return id !== targetId; });
      target.atWarWith = target.atWarWith.filter(function (id) { return id !== actorId; });

      target.relations[actorId] = Math.max(42, (target.relations[actorId] || 0) + 38);

      this.addLog(
        `🕊️ BARIŞ ANTLAŞMASI: ${actor.flag || ''} ${actor.name} ve ${target.flag || ''} ${target.name} arasında ateşkes imzalandı.`,

      target.gold += giftCost;

      actor.relations[targetId] = clamp((actor.relations[targetId] || 50) + 20, 0, 100);
      target.relations[actorId] = clamp((target.relations[actorId] || 50) + 20, 0, 100);

      if (nation.unlockedTechs.indexOf(techId) !== -1) {
        return { ok: false, reason: 'Bu ulusal odak zaten tamamlandı!' };
      }

      if (nation.research < tech.cost) {
        return { ok: false, reason: `Yetersiz Bilim Puanı! (${tech.cost} Araştırma gerekli)` };
      }

      nation.research -= tech.cost;
      nation.unlockedTechs.push(techId);
      if (isPlayerNation(nationId)) {
        tech.unlocked = true;
      }

      Object.keys(state.provinces).forEach(function (pId) {
        if (state.provinces[pId].owner === nationId) {
          SoH.Simulation.recalculateProvince(pId, true);
        }
      });
      this.recalculateNationStats();

      if (isPlayerNation(nationId)) {
        this.addLog(`🔬 ULUSAL ODAK: '${tech.name}' tamamlandı! (${tech.desc})`, 'city');
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
      }

      return { ok: true, tech: tech };
    },

    addLog: function (text, type) {
      const state = SoH.state;
      if (!state || !Array.isArray(state.logs)) return;

      state.logs.unshift({
        id: logIdCounter++,
        date: formatDate(state),
        text: text,
        type: type || 'info'
      });

      if (state.logs.length > 40) {
        state.logs.length = 40;
      }
    },

    saveGame: function () {
      try {
        if (!SoH.state) return { ok: false, reason: 'Kaydedilecek oyun durumu yok.' };
        localStorage.setItem('soh_save_v1', JSON.stringify(SoH.state));
        this.addLog('💾 Oyun durumu tarayıcı hafızasına kaydedildi.', 'info');
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
        return { ok: true };
      } catch (err) {
        return { ok: false, reason: 'Kayıt hatası: ' + err.message };
      }
    },

    loadGame: function () {
      try {
        const raw = localStorage.getItem('soh_save_v1');
        if (!raw) {
          return { ok: false, reason: 'Kayıtlı oyun bulunamadı!' };
        }
        const loaded = JSON.parse(raw);
        if (!loaded || !loaded.provinces || !loaded.nations) {
          return { ok: false, reason: 'Kayıt dosyası bozuk veya uyumsuz.' };
        }

        if (!loaded.playerNationId) {
          loaded.playerNationId = 'turkiye';
        }
        bindPlayerNationAlias(loaded);
        SoH.state = loaded;

        const playerNation = SoH.state.nations[SoH.state.playerNationId];
        const playerTechs = (playerNation && playerNation.unlockedTechs) || [];
        if (SoH.CONFIG && Array.isArray(SoH.CONFIG.TECHS)) {
          SoH.CONFIG.TECHS.forEach(function (t) {
            t.unlocked = playerTechs.indexOf(t.id) !== -1;
          });
        }

        Object.keys(SoH.state.provinces).forEach(function (pId) {
          SoH.Simulation.recalculateProvince(pId, true);
        });
        this.recalculateNationStats();

        this.addLog('📂 Kayıtlı dünya verileri başarıyla yüklendi.', 'info');
        if (SoH.UI && typeof SoH.UI.refresh === 'function') {
          SoH.UI.refresh();
        }
        return { ok: true };
      } catch (err) {
        return { ok: false, reason: 'Yükleme hatası: ' + err.message };
      }
    }
  };
})();

SoH.AI = {
