          continue;
        }

        counts[bId] = (counts[bId] || 0) + 1;
        const cfg = SoH.CONFIG.BUILDINGS[bId];
        if (!cfg) continue;

        const mult = 1 + (level - 1) * 0.45;
        if (cfg.powerGen) calcPowerSupply += Math.round(cfg.powerGen * mult);
        if (cfg.powerUse) calcPowerDemand += Math.round(cfg.powerUse * mult);
        if (cfg.waterGen) calcWaterSupply += Math.round(cfg.waterGen * mult);
        if (cfg.waterUse) calcWaterDemand += Math.round(cfg.waterUse * mult);
        if (cfg.foodGen) calcFoodGen += Math.round(cfg.foodGen * mult);
        if (cfg.pollution) calcPollution += cfg.pollution;
        if (cfg.pollutionClean) calcPollution = Math.max(0, calcPollution - cfg.pollutionClean);

        const n4 = this._getNeighbors4(prov, x, y);
        const hasRoadAdj = (cell && cell.roadConnected) || n4.some(n => n.building === 'road');

        if (['residential', 'commercial', 'industrial', 'hospital', 'university', 'airport', 'arms_factory'].includes(bId) && !hasRoadAdj) {
          disconnectedBuildings.push({ x, y, building: bId });
        }

        if (bId === 'residential') {
          const nearRadius = this._getNeighborsRadius(prov, x, y, 2);
          const nearbyPolluters = nearRadius.filter(n => n.building === 'industrial' || n.building === 'arms_factory' || n.building === 'power_plant');
          const nearbyParks = nearRadius.filter(n => n.building === 'park');
          const cellPoll = (cell && typeof cell.pollution === 'number') ? cell.pollution : (nearbyPolluters.length * 14 - nearbyParks.length * 14);
          if (cellPoll > 10 || (nearbyPolluters.length > 0 && nearbyParks.length === 0)) {
            pollutedResidentialTiles.push({ x, y, pollution: Math.max(10, cellPoll) });
          }
        }

        if (bId !== 'road' && level < 3) {
          upgradableCells.push({ x, y, building: bId, level, hasRoadAdj });
        }
      }
    }

    const powerSupply = typeof prov.powerSupply === 'number' ? prov.powerSupply : calcPowerSupply;
    const powerDemand = typeof prov.powerDemand === 'number' ? prov.powerDemand : calcPowerDemand;
    const waterSupply = typeof prov.waterSupply === 'number' ? prov.waterSupply : calcWaterSupply;
    const waterDemand = typeof prov.waterDemand === 'number' ? prov.waterDemand : calcWaterDemand;
    const happiness = typeof prov.happiness === 'number' ? prov.happiness : 75;
    const population = typeof prov.population === 'number' ? prov.population : (counts.residential * 150 + 100);

    return {
      counts,
      powerSupply,
      powerDemand,
      powerDeficit: Math.max(0, powerDemand - powerSupply),
      waterSupply,
      waterDemand,
      waterDeficit: Math.max(0, waterDemand - waterSupply),
      foodGen: calcFoodGen,
      pollution: typeof prov.avgPollution === 'number' ? prov.avgPollution : calcPollution,
      happiness,
      population,
      pollutedResidentialTiles,
      disconnectedBuildings,
      upgradableCells,
      emptyCells
    };
  },

  // Harita üzerinde inşa ve seviye yükseltme işlemini güvenli şekilde uygular
  _executeBuildOrUpgrade(prov, actionType, buildingId, x, y, nationId) {
    const cfg = SoH.CONFIG.BUILDINGS[buildingId];
    if (!cfg || !prov) return false;

    const ownerId = nationId || prov.owner;

    if (actionType === 'upgrade') {
      if (SoH.Simulation && typeof SoH.Simulation.upgradeBuilding === 'function') {
        const res = SoH.Simulation.upgradeBuilding(prov.id, x, y, true);
        if (res && res.ok) {
          if (SoH.Simulation.recalculateNationStats) SoH.Simulation.recalculateNationStats();
          return true;
        }
      }

      const cell = this._getCell(prov, x, y);
      const currentLevel = this._getCellLevel(cell);
      if (currentLevel >= 3) return false;
      const upgradeCost = Math.round(cfg.cost * 0.8 * currentLevel);

      if (!this._spendGold(ownerId, upgradeCost)) return false;

      if (cell && cell.building && typeof cell.building === 'object') {
        cell.building.level = currentLevel + 1;
        cell.building.xp = 0;
      } else if (cell && typeof cell === 'object') {
        cell.building = { type: buildingId, level: currentLevel + 1, xp: 0 };
      }

      if (SoH.Simulation && typeof SoH.Simulation.recalculateProvince === 'function') {
        SoH.Simulation.recalculateProvince(prov.id);
        if (SoH.Simulation.recalculateNationStats) SoH.Simulation.recalculateNationStats();
      }
      return true;
    }

    // Yeni bina inşası
    if (SoH.Simulation && typeof SoH.Simulation.placeBuilding === 'function') {
      const res = SoH.Simulation.placeBuilding(prov.id, x, y, buildingId, true);
      if (res && res.ok) {
        if (SoH.Simulation.recalculateNationStats) SoH.Simulation.recalculateNationStats();
        return true;
      }
    }

    const cost = cfg.cost;
    if (!this._spendGold(ownerId, cost)) return false;

    const cell = this._getCell(prov, x, y);
    if (cell && typeof cell === 'object') {
      cell.building = { type: buildingId, level: 1, xp: 0 };
    }

    if (SoH.Simulation && typeof SoH.Simulation.recalculateProvince === 'function') {
      SoH.Simulation.recalculateProvince(prov.id);
      if (SoH.Simulation.recalculateNationStats) SoH.Simulation.recalculateNationStats();
    }
    return true;
  },

  // ============================================================================
  // AJAN 1: OTOMATİK ŞEHİR & EKONOMİ BAKANI (14 BİNA & 14x14 METROPOL OPTİMİZASYONU)
  // ============================================================================

  evaluateBestCityAction(prov, budgetGold) {
    if (!prov) return null;
    const metrics = this.analyzeProvinceMetrics(prov);
    const candidates = [];
    const B = SoH.CONFIG.BUILDINGS;

    // 1. KRİTİK ALTYAPI: Elektrik Açığı -> Enerji Santrali (`power_plant`)
    if (metrics.powerSupply <= metrics.powerDemand + 15 && budgetGold >= B.power_plant.cost) {
      for (const slot of metrics.emptyCells) {
        const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
        const nearRes = nRadius.filter(n => n.building === 'residential').length;
        const nearInd = nRadius.filter(n => n.building === 'industrial' || n.building === 'arms_factory').length;
        const nearRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        let score = 96 + (metrics.powerDemand - metrics.powerSupply) * 0.45;
        score -= nearRes * 14;
        score += nearInd * 6;
        if (nearRoad) score += 8;
        if (prov.bonusType === 'power_plant') score += 14;

        candidates.push({
          action: 'build',
          buildingId: 'power_plant',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(score),
          title: '⚡ Enerji Santrali İnşası (+180 MW)',
          reasoning: `${prov.name} metropolünde elektrik talebi (${metrics.powerDemand} MW) arz sınırına (${metrics.powerSupply} MW) ulaştı. Konutlardan izole (${slot.x + 1},${slot.y + 1}) karesine Enerji Santrali kurularak şebeke güvenceye alındı.`
        });
      }
    }

    // 2. KRİTİK ALTYAPI: Su Açığı -> Su Arıtma & Pompa Tesisi (`water_tower`)
    if (metrics.waterSupply <= metrics.waterDemand + 15 && budgetGold >= B.water_tower.cost) {
      for (const slot of metrics.emptyCells) {
        const nearRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        const nearRes = this._getNeighborsRadius(prov, slot.x, slot.y, 2).filter(n => n.building === 'residential').length;
        let score = 93 + (metrics.waterDemand - metrics.waterSupply) * 0.45;
        if (nearRoad) score += 8;
        score += nearRes * 5;
        if (prov.bonusType === 'water_tower') score += 14;

        candidates.push({
          action: 'build',
          buildingId: 'water_tower',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(score),
          title: '💧 Su Arıtma & Pompa Tesisi (+180 m³)',
          reasoning: `${prov.name} şehrinde su tüketimi (${metrics.waterDemand} m³) kapasiteyi (${metrics.waterSupply} m³) zorluyor. Rezidansların büyümesi için (${slot.x + 1},${slot.y + 1}) karesine Su Tesisi inşa edildi.`
        });
      }
    }

    // 3. OTOYOL & BULVAR AĞI (`road`): Kopuk binaları bağla veya bulvarı uzat
    if (budgetGold >= B.road.cost) {
      if (metrics.disconnectedBuildings.length > 0) {
        const targetB = metrics.disconnectedBuildings[0];
        const adjEmpty = this._getNeighbors4(prov, targetB.x, targetB.y).filter(n => !n.building);
        for (const roadSlot of adjEmpty) {
          const connectsToExistingRoad = this._getNeighbors4(prov, roadSlot.x, roadSlot.y).some(n => n.building === 'road');
          const score = connectsToExistingRoad ? 90 : 83;
          const bName = B[targetB.building]?.name || 'Yapı';
          candidates.push({
            action: 'build',
            buildingId: 'road',
            x: roadSlot.x,
            y: roadSlot.y,
            utilityScore: score,
            title: '🛣️ Otoyol & Bulvar Bağlantısı',
            reasoning: `(${targetB.x + 1},${targetB.y + 1}) konumundaki ${bName} binasının otoyol bağlantısı eksikti. Seviye gelişimi ve trafik akışı için (${roadSlot.x + 1},${roadSlot.y + 1}) karesine bulvar döşendi.`
          });
        }
      } else if (metrics.counts.road < 10) {
        for (const slot of metrics.emptyCells) {
          const adjRoads = this._getNeighbors4(prov, slot.x, slot.y).filter(n => n.building === 'road').length;
          if (adjRoads === 1 && slot.x >= 2 && slot.x <= 11 && slot.y >= 2 && slot.y <= 11) {
            candidates.push({
              action: 'build',
              buildingId: 'road',
              x: slot.x,
              y: slot.y,
              utilityScore: 76,
              title: '🛣️ Metropol Ana Bulvar Uzatması',
              reasoning: `14x14 şehir planında yeni parselleri ulaşıma açmak için (${slot.x + 1},${slot.y + 1}) karesine otoyol uzatıldı.`
            });
          }
        }
      }
    }

    // 4. EKOLOJİ & HALK SAĞLIĞI: Millet Bahçesi (`park`) ve Şehir Hastanesi (`hospital`)
    if ((metrics.pollutedResidentialTiles.length > 0 || metrics.happiness < 68) && budgetGold >= B.park.cost) {
      for (const slot of metrics.emptyCells) {
        const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
        const nearRes = nRadius.filter(n => n.building === 'residential').length;
        const nearPoll = nRadius.filter(n => n.building === 'industrial' || n.building === 'arms_factory' || n.building === 'power_plant').length;
        if (nearRes > 0 && (nearPoll > 0 || metrics.happiness < 68)) {
          let score = 82 + nearRes * 7 + nearPoll * 6 + Math.max(0, 72 - metrics.happiness) * 0.6;
          if (prov.bonusType === 'park') score += 12;
          candidates.push({
            action: 'build',
            buildingId: 'park',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(score),
            title: '🌳 Millet Bahçesi & Kent Parkı',
            reasoning: `Konut bölgelerindeki sanayi kirliliğini temizlemek (-18 Kirlilik) ve mutluluğu (+14) yükseltmek için (${slot.x + 1},${slot.y + 1}) karesine Kent Parkı açıldı.`
          });
        }
      }
    }

    if (B.hospital && metrics.counts.hospital < 2 && (metrics.population >= 300 || metrics.happiness < 74) && budgetGold >= B.hospital.cost) {
      for (const slot of metrics.emptyCells) {
        const hasRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        if (!hasRoad && metrics.counts.road > 0) continue;
        const nearRes = this._getNeighborsRadius(prov, slot.x, slot.y, 2).filter(n => n.building === 'residential').length;
        if (nearRes > 0) {
          let score = 79 + nearRes * 6 + (metrics.counts.hospital === 0 ? 10 : 0);
          candidates.push({
            action: 'build',
            buildingId: 'hospital',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(score),
            title: '🏥 Şehir Hastanesi & Tıp Merkezi',
            reasoning: `${prov.name} nüfusunun sağlık ihtiyacını karşılamak (+16 Mutluluk) ve askeri insan gücü artışını (+18) desteklemek için (${slot.x + 1},${slot.y + 1}) karesine Şehir Hastanesi kuruldu.`
          });
        }
      }
    }

    // 5. GIDA GÜVENLİĞİ: Tarım & Sera Kompleksi (`farm`)
    const nationObj = this._getNationState(prov.owner);
    const nationFood = nationObj && typeof nationObj.food === 'number' ? nationObj.food : 400;
    if ((metrics.counts.farm < 2 || nationFood < 220 || prov.bonusType === 'farm') && budgetGold >= B.farm.cost) {
      for (const slot of metrics.emptyCells) {
        const hasRoad = this._getNeighbors4(prov, slot.x, slot.y).some(n => n.building === 'road');
        const nearInd = this._getNeighborsRadius(prov, slot.x, slot.y, 2).filter(n => n.building === 'industrial').length;
        if (nearInd === 0) {
          let score = 70 + (metrics.counts.farm === 0 ? 15 : 0) + (nationFood < 220 ? 14 : 0);
          if (hasRoad) score += 6;
          if (prov.bonusType === 'farm') score += 15;
          if (slot.cell && slot.cell.terrain === 'fertile') score += 8;
          candidates.push({
            action: 'build',
            buildingId: 'farm',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(score),
            title: '🌾 Tarım & Sera Kompleksi (+55 Gıda)',
            reasoning: `Metropol nüfusunu ve cephedeki tümenlerin iaşesini karşılamak üzere (${slot.x + 1},${slot.y + 1}) karesine modern Tarım Kompleksi kuruldu.`
          });
        }
      }
    }

    // 6. YOLA KOMŞU PARSELLERDE 14 BİNA TİPİ DEĞERLENDİRMESİ
    const isBorderProvince = (prov.neighbors || []).some(nId => {
      const np = this._getProvinceById(nId);
      return np && np.owner !== prov.owner;
    });

    for (const slot of metrics.emptyCells) {
      const n4 = this._getNeighbors4(prov, slot.x, slot.y);
      const hasRoad = (slot.cell && slot.cell.roadConnected) || n4.some(n => n.building === 'road');
      if (!hasRoad && metrics.counts.road > 0) continue;

      const nRadius = this._getNeighborsRadius(prov, slot.x, slot.y, 2);
      const nearRes = nRadius.filter(n => n.building === 'residential').length;
      const nearCom = nRadius.filter(n => n.building === 'commercial').length;
      const nearInd = nRadius.filter(n => n.building === 'industrial' || n.building === 'arms_factory').length;
      const nearPark = nRadius.filter(n => n.building === 'park' || n.building === 'hospital').length;

      // 6a. Modern Konut Bölgesi (`residential`)
      if (budgetGold >= B.residential.cost && nearInd === 0) {
        let resScore = 72 + nearPark * 7 + nearCom * 5 - metrics.counts.residential * 1.8;
        if (prov.bonusType === 'residential') resScore += 14;
        candidates.push({
          action: 'build',
          buildingId: 'residential',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(resScore),
          title: '🏘️ Modern Konut Bölgesi (+150 Nüfus)',
          reasoning: `Otoyola bağlı ve kirlilikten uzak (${slot.x + 1},${slot.y + 1}) karesine Modern Konut Bölgesi imara açılarak vergi tabanı ve nüfus kapasitesi büyütüldü.`
        });
      }

      // 6b. Finans & AVM Merkezi (`commercial`)
      if (budgetGold >= B.commercial.cost) {
        let comScore = 74 + nearRes * 6 - metrics.counts.commercial * 2.5;
        if (prov.bonusType === 'commercial') comScore += 15;
        candidates.push({
          action: 'build',
          buildingId: 'commercial',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(comScore),
          title: '🏬 Finans & AVM Merkezi (+28 Altın)',
          reasoning: `${nearRes} konut bölgesinin merkezindeki (${slot.x + 1},${slot.y + 1}) karesine yüksek vergi geliri sağlayan Finans & AVM Merkezi inşa edildi.`
        });
      }

      // 6c. Organize Sanayi Bölgesi (`industrial`)
      if (budgetGold >= B.industrial.cost && nearRes === 0) {
        let indScore = 71 + nearInd * 4 - metrics.counts.industrial * 3.5;
        if (prov.bonusType === 'industrial') indScore += 16;
        candidates.push({
          action: 'build',
          buildingId: 'industrial',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(indScore),
          title: '🏭 Organize Sanayi Bölgesi (+36 Altın)',
          reasoning: `Konutlara duman yaymayacak (${slot.x + 1},${slot.y + 1}) sanayi parseline yüksek üretim ve hazine geliri sağlayan OSB kuruldu.`
        });
      }

      // 6d. Teknik Üniversite & Teknokent (`university`)
      if (B.university && budgetGold >= B.university.cost && metrics.counts.university < 2) {
        let uniScore = 73 + nearRes * 4 + (metrics.counts.university === 0 ? 12 : 0);
        if (prov.bonusType === 'university') uniScore += 16;
        candidates.push({
          action: 'build',
          buildingId: 'university',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(uniScore),
          title: '🎓 Teknik Üniversite & Teknokent (+16 Bilim)',
          reasoning: `Ulusal odak ve teknoloji araştırmalarını hızlandırmak için (${slot.x + 1},${slot.y + 1}) karesine Teknokent açıldı.`
        });
      }

      // 6e. Uluslararası Ticaret Limanı (`seaport`)
      if (B.seaport && budgetGold >= B.seaport.cost && metrics.counts.seaport < 2) {
        const isWaterEdge = (slot.cell && slot.cell.terrain === 'water_edge') || slot.y >= 11;
        if (isWaterEdge || prov.bonusType === 'seaport') {
          let portScore = 76 + (metrics.counts.seaport === 0 ? 10 : 0) + (prov.bonusType === 'seaport' ? 16 : 0);
          candidates.push({
            action: 'build',
            buildingId: 'seaport',
            x: slot.x,
            y: slot.y,
            utilityScore: Math.round(portScore),
            title: '🚢 Uluslararası Ticaret Limanı (+45 Altın, +20 Gıda)',
            reasoning: `Deniz ticareti ve konteyner ihracatından yüksek döviz geliri elde etmek amacıyla (${slot.x + 1},${slot.y + 1}) kıyı karesine Ticaret Limanı inşa edildi.`
          });
        }
      }

      // 6f. Uluslararası Havalimanı (`airport`)
      if (B.airport && budgetGold >= B.airport.cost && metrics.counts.airport < 1 && (prov.isCapital || prov.bonusType === 'airport' || budgetGold > 650)) {
        let airScore = 78 + (prov.bonusType === 'airport' ? 16 : 0) + (prov.isCapital ? 8 : 0);
        candidates.push({
          action: 'build',
          buildingId: 'airport',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(airScore),
          title: '🛫 Uluslararası Havalimanı (+70 Altın, +10 Mutluluk)',
          reasoning: `${prov.name} metropolünü küresel havacılık ve turizm merkezine dönüştürmek için (${slot.x + 1},${slot.y + 1}) karesine Uluslararası Havalimanı kuruldu.`
        });
      }

      // 6g. Ordu Karargahı & Kışla (`barracks`)
      if (B.barracks && (isBorderProvince || prov.isCapital || prov.bonusType === 'barracks') && budgetGold >= B.barracks.cost && metrics.counts.barracks < 2) {
        let barScore = 73 + (metrics.counts.barracks === 0 ? 10 : 0) + (isBorderProvince ? 8 : 0);
        if (prov.bonusType === 'barracks') barScore += 15;
        candidates.push({
          action: 'build',
          buildingId: 'barracks',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(barScore),
          title: '🏰 Ordu Karargahı & Kışla (+%30 Savunma, +40 İhtiyat)',
          reasoning: `${prov.name} eyaletinin tahkimatını güçlendirmek ve tümen eğitim hızını artırmak üzere (${slot.x + 1},${slot.y + 1}) karesine Ordu Karargahı kuruldu.`
        });
      }

      // 6h. Savunma Sanayi & SİHA Tesisi (`arms_factory`)
      if (B.arms_factory && budgetGold >= B.arms_factory.cost && metrics.counts.arms_factory < 2 && nearRes === 0) {
        let armsScore = 75 + (metrics.counts.arms_factory === 0 ? 9 : 0) + (prov.bonusType === 'arms_factory' ? 18 : 0);
        candidates.push({
          action: 'build',
          buildingId: 'arms_factory',
          x: slot.x,
          y: slot.y,
          utilityScore: Math.round(armsScore),
          title: '⚙️ Savunma Sanayi & SİHA Tesisi (+%8 Ordu Gücü, +25 Altın)',
          reasoning: `Zırhlı tank ve 5. nesil SİHA üretimini destekleyerek ordularımıza kalıcı taarruz bonusu sağlamak için (${slot.x + 1},${slot.y + 1}) karesine Savunma Sanayi Tesisi inşa edildi.`
        });
      }
    }

    // 7. MEVCUT BİNALARI SEVİYE 2 / 3'E YÜKSELTME ADAYLARI
    const upgradableTypes = ['residential', 'commercial', 'industrial', 'farm', 'barracks'];
    for (const upg of metrics.upgradableCells) {
      if (!upgradableTypes.includes(upg.building)) continue;
      const cfg = B[upg.building];
      if (!cfg) continue;
      const upgCost = Math.round(cfg.cost * 0.8 * upg.level);
      if (budgetGold >= upgCost && upg.hasRoadAdj) {
        let upgScore = 69 + (3 - upg.level) * 5;
        if (upg.building === prov.bonusType) upgScore += 13;
        if (upg.building === 'commercial' || upg.building === 'residential') upgScore += 6;

        candidates.push({
          action: 'upgrade',
          buildingId: upg.building,
          x: upg.x,
          y: upg.y,
          utilityScore: Math.round(upgScore),
          title: `⬆️ ${cfg.name} Seviye ${upg.level + 1} Yükseltmesi`,
          reasoning: `(${upg.x + 1},${upg.y + 1}) karesindeki ${cfg.name} binasının otoyol ve şebeke bağlantısı tam olduğu için Seviye ${upg.level + 1} gökdelen/kompleks yoğunluğuna yükseltildi.`
        });
      }
    }

    if (candidates.length === 0) return null;
    candidates.sort((a, b) => b.utilityScore - a.utilityScore);
    return candidates[0];
  },

  // Oyuncu "🤖 AI Mimar: Şehri Optimize Et (1 Adım)" butonuna bastığında çalışır
  runCityOptimizationStep(provId) {
    const s = SoH.state;
    if (!s) return { success: false, message: 'Oyun durumu henüz başlatılmadı.' };

    const playerNationId = this._getPlayerNationId();
    const playerProvs = this._getPlayerProvinces();
    const defaultProvId = (playerProvs[0] && playerProvs[0].id) || 'tr_ankara';
    const targetProvId = provId || s.selectedProvinceId || defaultProvId;

    let prov = this._getProvinceById(targetProvId);
    if (!prov || prov.owner !== playerNationId) {
      prov = playerProvs[0] || prov;
    }
    if (!prov) {
      return { success: false, message: 'Eyalet bulunamadı.' };
    }

    if (prov.owner !== playerNationId) {
      const msg = `${prov.name} şu anda ülkenizin kontrolünde değil! Sadece kendi şehirlerinizde AI Şehir Bakanını çalıştırabilirsiniz.`;
      if (SoH.UI && typeof SoH.UI.showToast === 'function') SoH.UI.showToast(msg, 'warning');
      return { success: false, message: msg };
    }

    const playerGold = this._getGold(playerNationId);
    const bestDecision = this.evaluateBestCityAction(prov, playerGold);

    if (!bestDecision) {
      const msg = `AI Şehir Bakanı ${prov.name} metropolünü inceledi: Mevcut bütçe (${Math.floor(playerGold)} Altın) ile yapılabilecek uygun bir imar adımı bulunamadı.`;
      if (SoH.UI && typeof SoH.UI.showToast === 'function') SoH.UI.showToast(msg, 'info');
      return { success: false, message: msg };
    }

    const executed = this._executeBuildOrUpgrade(
      prov,
      bestDecision.action,
      bestDecision.buildingId,
      bestDecision.x,
      bestDecision.y,
      playerNationId
    );

    if (!executed) {
      return { success: false, message: 'Hazine yetersiz veya parsel uygun değil.' };
    }

    const cfg = SoH.CONFIG.BUILDINGS[bestDecision.buildingId];
    const logEntry = this.logDecision(
      'Otomatik Şehir & Ekonomi Bakanı',
      cfg ? cfg.icon : '🏗️',
      `${prov.name}: ${bestDecision.title} [Fayda: ${bestDecision.utilityScore}]`,
      bestDecision.reasoning,
      {
        agentRole: 'Ajan 1 • Metropol Planlama Ajanı',
        nationId: playerNationId,
        provId: prov.id,
        utilityScore: bestDecision.utilityScore
      }
    );

    if (SoH.Simulation && typeof SoH.Simulation.addLog === 'function') {
      SoH.Simulation.addLog(`🤖 AI Şehir Bakanı (${prov.name}): ${bestDecision.title}`, 'city');
    }

    this._triggerUIRefresh(`🤖 ${bestDecision.title}: ${bestDecision.reasoning}`);

    return {
      success: true,
      provId: prov.id,
      provName: prov.name,
      action: bestDecision.action,
      buildingId: bestDecision.buildingId,
      x: bestDecision.x,
      y: bestDecision.y,
      title: bestDecision.title,
      reasoning: bestDecision.reasoning,
      utilityScore: bestDecision.utilityScore,
      logEntry
    };
  },

  runAutoGovernorTick() {
    const s = SoH.state;
    if (!s || !s.autoGovernor) return null;

    const playerNationId = this._getPlayerNationId();
    const playerGold = this._getGold(playerNationId);
    if (playerGold <= 250) return null;

    const playerProvs = this._getPlayerProvinces();
    if (playerProvs.length === 0) return null;

    let topChoice = null;
    let topProv = null;

    for (const prov of playerProvs) {
      const candidate = this.evaluateBestCityAction(prov, playerGold);
      if (candidate && (!topChoice || candidate.utilityScore > topChoice.utilityScore)) {
        topChoice = candidate;
        topProv = prov;
      }
    }

    if (topChoice && topProv) {
      return this.runCityOptimizationStep(topProv.id);
    }
    return null;
  },

  // ============================================================================
  // AJAN 2: GENELKURMAY & OTOMATİK CEPHE KOMUTANI (HOI4 AI FRONTLINE MARSHAL)
  // ============================================================================

  // Belirli bir eyalette uzman tümen (infantry, tank, artillery, airforce) seferber eder
  _recruitUnitInProvince(prov, unitType, nationId) {
    if (!prov) return false;
    const uCfg = (SoH.CONFIG.UNIT_TYPES && SoH.CONFIG.UNIT_TYPES[unitType]) || {
      id: 'infantry',
      name: 'Motorize Piyade Tümeni',
      icon: '🪖',
      goldCost: 140,
      manpowerCost: 80,
      attack: 12,
      defense: 16
    };

    // Eğer Simulation.recruitUnit veya Simulation.recruitDivision tanımlıysa önce onu dene
    if (SoH.Simulation && typeof SoH.Simulation.recruitUnit === 'function') {
      const res = SoH.Simulation.recruitUnit(prov.id, unitType, 1, nationId);
      if (res && res.ok) return true;
    }
    if (SoH.Simulation && typeof SoH.Simulation.recruitDivision === 'function') {
      const res = SoH.Simulation.recruitDivision(prov.id, unitType, nationId);
      if (res && res.ok) return true;
    }

    const gold = this._getGold(nationId);
    const mp = this._getManpower(nationId);
    if (gold < uCfg.goldCost || mp < uCfg.manpowerCost) return false;

    this._spendGold(nationId, uCfg.goldCost);
    this._spendManpower(nationId, uCfg.manpowerCost);

    // Garnizon karşılığı (piyade=75, topçu=90, tank=115, hava=135 eşdeğer muharebe gücü)
    const garrisonGain = unitType === 'airforce' ? 135 : (unitType === 'tank' ? 115 : (unitType === 'artillery' ? 90 : 75));
    this._addProvinceGarrison(prov, garrisonGain, unitType);

    if (SoH.Simulation && typeof SoH.Simulation.recalculateProvince === 'function') {
      SoH.Simulation.recalculateProvince(prov.id);
      if (SoH.Simulation.recalculateNationStats) SoH.Simulation.recalculateNationStats();
    }
    return true;
  },

  // Oyuncu "🎖️ AI Genelkurmay: Cephede Otomatik Hamle Yap" butonuna bastığında veya `autoMarshal` açıkken çalışır
  runFrontlineMarshalStep() {
    const s = SoH.state;
    if (!s) return { success: false, message: 'Oyun durumu henüz başlatılmadı.' };

    const playerNationId = this._getPlayerNationId();
    const playerNation = this._getNationState(playerNationId);
    const playerProvs = this._getPlayerProvinces();
    if (playerProvs.length === 0) {
      return { success: false, message: 'Kontrol edilen eyalet bulunamadı.' };
    }

    const gold = this._getGold(playerNationId);
    const manpower = this._getManpower(playerNationId);

    // Sınır eyaletlerini ve iç eyaletleri ayır
    const borderProvs = [];
    const interiorProvs = [];

    for (const prov of playerProvs) {
      const foreignNeighbors = (prov.neighbors || [])
        .map(id => this._getProvinceById(id))
        .filter(np => np && np.owner !== playerNationId);

      if (foreignNeighbors.length > 0) {
        borderProvs.push({ prov, foreignNeighbors });
      } else {
        interiorProvs.push(prov);
      }
    }

    // 1. ÖNCELİK: ZAYIF DÜŞMAN EYALETİNE HESAPLANMIŞ TAARRUZ (Eğer savaşta olduğumuz veya agresif rakip varsa ve gücümüz > 1.45x ise)
    for (const item of borderProvs) {
      const myProv = item.prov;
      const myGarrison = this._getProvinceGarrison(myProv);
      if (myGarrison < 160) continue;

      for (const enemyProv of item.foreignNeighbors) {
        const isAllied = playerNation && Array.isArray(playerNation.allies) && playerNation.allies.includes(enemyProv.owner);
        if (isAllied) continue;
        // Kardeş ülke Azerbaycan-Türkiye birbirine saldırmasın
        if ((playerNationId === 'turkiye' && enemyProv.owner === 'azerbaycan') ||
            (playerNationId === 'azerbaycan' && enemyProv.owner === 'turkiye')) {
          continue;
        }

        const isAtWar = playerNation && Array.isArray(playerNation.atWarWith) && playerNation.atWarWith.includes(enemyProv.owner);
        const rel = this._getRelation(playerNationId, enemyProv.owner);
        const enemyGarrison = this._getProvinceGarrison(enemyProv);

        if ((isAtWar && myGarrison > enemyGarrison * 1.25) || (rel <= 35 && myGarrison > enemyGarrison * 1.65)) {
          const sendTroops = Math.round(myGarrison * 0.7);
          let battleRes = null;
          if (SoH.Simulation && typeof SoH.Simulation.orderArmyAction === 'function') {
            battleRes = SoH.Simulation.orderArmyAction(myProv.id, enemyProv.id, sendTroops);
          }

          const title = `⚔️ ${myProv.name} → ${enemyProv.name} Cephe Taarruzu (${sendTroops} Asker)`;
          const reasoning = `Genelkurmay AI, ${myProv.name} garnizonunun (${myGarrison}) karşı cephedeki ${enemyProv.name} savunmasına (${enemyGarrison}) karşı ezici üstünlük kurduğunu hesaplayarak yıldırım harekâtı başlattı!`;

          const logEntry = this.logDecision(
            'Genelkurmay & Cephe Komutanı AI',
            '🎖️',
            title,
            reasoning,
            { agentRole: 'Ajan 2 • HOI4 Cephe Mareşali', nationId: playerNationId, utilityScore: 95 }
          );

          this._triggerUIRefresh(`🎖️ ${title}`);
          return { success: true, action: 'attack', fromId: myProv.id, toId: enemyProv.id, title, reasoning, battleRes, logEntry };
        }
      }
    }

    // 2. ÖNCELİK: İÇ EYALETLERDEKİ ATIL ORDULARI TEHDİT ALTINDAKİ SINIR EYALETİNE KAYDIRMA
    if (interiorProvs.length > 0 && borderProvs.length > 0) {
      const richInterior = interiorProvs.find(p => this._getProvinceGarrison(p) >= 140);
      if (richInterior) {
        // Sınır komşusu olan en zayıf sınır eyaletimizi bul
        const connectedBorder = (richInterior.neighbors || [])
          .map(id => this._getProvinceById(id))
          .filter(p => p && p.owner === playerNationId)
          .sort((a, b) => this._getProvinceGarrison(a) - this._getProvinceGarrison(b))[0];

        if (connectedBorder) {
          const moveCount = Math.round(this._getProvinceGarrison(richInterior) * 0.6);
          if (SoH.Simulation && typeof SoH.Simulation.orderArmyAction === 'function') {
            SoH.Simulation.orderArmyAction(richInterior.id, connectedBorder.id, moveCount);
          } else {
            this._addProvinceGarrison(richInterior, -moveCount);
            this._addProvinceGarrison(connectedBorder, moveCount);
          }

          const title = `🚛 Lojistik Sevkiyat: ${richInterior.name} → ${connectedBorder.name} (+${moveCount} Asker)`;
          const reasoning = `İç bölgedeki ${richInterior.name} garnizonunda bekleyen ihtiyat kuvvetleri, sınır güvenliğini tahkim etmek amacıyla ${connectedBorder.name} cephesine kaydırıldı.`;

          const logEntry = this.logDecision(
            'Genelkurmay & Cephe Komutanı AI',
            '🚛',
            title,
            reasoning,
            { agentRole: 'Ajan 2 • HOI4 Cephe Mareşali', nationId: playerNationId, utilityScore: 86 }
          );

          this._triggerUIRefresh(`🎖️ ${title}`);
          return { success: true, action: 'reinforce', fromId: richInterior.id, toId: connectedBorder.id, title, reasoning, logEntry };
        }
      }
    }

    // 3. ÖNCELİK: EN ÇOK TEHDİT ALTINDAKİ SINIR EYALETİNDE UZMAN TÜMEN (SİHA, TANK, TOPÇU, PİYADE) SEFERBERLİĞİ
    let mostThreatenedProv = playerProvs[0];
    let highestThreatRatio = -1;
    let mainThreatEnemyName = 'Rakip Cephe';

    for (const item of borderProvs) {
      const myGarrison = Math.max(10, this._getProvinceGarrison(item.prov));
      const maxEnemyGarrison = Math.max(...item.foreignNeighbors.map(ep => this._getProvinceGarrison(ep)), 50);
      const ratio = maxEnemyGarrison / myGarrison;
      if (ratio > highestThreatRatio) {
        highestThreatRatio = ratio;
        mostThreatenedProv = item.prov;
        const strongestEnemy = item.foreignNeighbors.sort((a, b) => this._getProvinceGarrison(b) - this._getProvinceGarrison(a))[0];
        if (strongestEnemy) {
          mainThreatEnemyName = `${strongestEnemy.name} (${SoH.CONFIG.NATIONS[strongestEnemy.owner]?.shortName || strongestEnemy.owner})`;
        }
      }
    }

    // Bütçe ve insan gücüne göre en güçlü tümen tipini seç
    let chosenUnit = null;
    if (gold >= 360 && manpower >= 40) chosenUnit = 'airforce';
    else if (gold >= 280 && manpower >= 60) chosenUnit = 'tank';
    else if (gold >= 220 && manpower >= 50) chosenUnit = 'artillery';
    else if (gold >= 140 && manpower >= 80) chosenUnit = 'infantry';

    if (chosenUnit && mostThreatenedProv) {
      const uCfg = SoH.CONFIG.UNIT_TYPES[chosenUnit];
      const recruited = this._recruitUnitInProvince(mostThreatenedProv, chosenUnit, playerNationId);
      if (recruited) {
        const newGarrison = this._getProvinceGarrison(mostThreatenedProv);
        const title = `${uCfg.icon} ${mostThreatenedProv.name} Cephesine ${uCfg.name} Seferber Edildi`;
        const reasoning = `${mainThreatEnemyName} sınırındaki askeri dengeyi lehimize çevirmek için ${mostThreatenedProv.name} karargahında yeni bir ${uCfg.name} göreve alındı (Toplam Garnizon: ${newGarrison}).`;

        const logEntry = this.logDecision(
          'Genelkurmay & Cephe Komutanı AI',
          uCfg.icon,
          title,
          reasoning,
          { agentRole: 'Ajan 2 • HOI4 Cephe Mareşali', nationId: playerNationId, provId: mostThreatenedProv.id, utilityScore: 89 }
        );

        if (SoH.Simulation && typeof SoH.Simulation.addLog === 'function') {
          SoH.Simulation.addLog(`🎖️ Genelkurmay AI: ${title}`, 'war');
        }

        this._triggerUIRefresh(`🎖️ ${title}`);
        return { success: true, action: 'recruit', unitType: chosenUnit, provId: mostThreatenedProv.id, title, reasoning, logEntry };
      }
    }

    // Standart recruitArmy fallback (daha küçük bütçeler için)
    if (gold >= 100 && manpower >= 50 && mostThreatenedProv && SoH.Simulation && typeof SoH.Simulation.recruitArmy === 'function') {
      const res = SoH.Simulation.recruitArmy(mostThreatenedProv.id, 50, playerNationId);
      if (res && res.ok) {
        const title = `🪖 ${mostThreatenedProv.name} Sınırına +50 Piyade Takviyesi`;
        const reasoning = `Sınır hattını tutmak için ${mostThreatenedProv.name} kışlalarında acil piyade taburu silah altına alındı.`;
        const logEntry = this.logDecision('Genelkurmay & Cephe Komutanı AI', '🪖', title, reasoning, {
          agentRole: 'Ajan 2 • HOI4 Cephe Mareşali',
          nationId: playerNationId,
          utilityScore: 80
        });
        this._triggerUIRefresh(`🎖️ ${title}`);
        return { success: true, action: 'recruit', provId: mostThreatenedProv.id, title, reasoning, logEntry };
      }
    }

    const msg = `Genelkurmay AI Raporu: Yeni tümen eğitmek için en az 140 Altın ve 50 İhtiyat gerekli (Mevcut: ${Math.floor(gold)} Altın, ${Math.floor(manpower)} İhtiyat).`;
    if (SoH.UI && typeof SoH.UI.showToast === 'function') SoH.UI.showToast(msg, 'info');
    return { success: false, message: msg };
  },

  // Gerçek Zamanlı Stratejik & Şehir Danışmanı Raporu (`SoH.AI.getAdvisorReport()`)
  getAdvisorReport() {
    const cityAdvice = [];
    const strategyAdvice = [];
    const s = SoH.state;

    if (!s) {
      return {
        cityAdvice: [],
        strategyAdvice: [],
        aiAgentThoughts: this.agentDecisionLog.slice(0, 15)
      };
    }

    const playerNationId = this._getPlayerNationId();
    const playerNation = this._getNationState(playerNationId);
    const playerProvs = this._getPlayerProvinces();
    const playerGold = this._getGold(playerNationId);
    const researchPoints = playerNation && typeof playerNation.research === 'number' ? playerNation.research : 0;

    // 1. Eyalet Bazlı 14x14 Şehir & Altyapı Analizi
    for (const prov of playerProvs) {
      const m = this.analyzeProvinceMetrics(prov);

      if (m.powerDemand > m.powerSupply) {
        cityAdvice.push({
          priority: 'high',
          icon: '⚡',
          title: `${prov.name}: Elektrik Şebekesi Açığı (-${m.powerDemand - m.powerSupply} MW)`,
          detail: `Tüketim (${m.powerDemand} MW) üretimi (${m.powerSupply} MW) aştı. Fabrika ve rezidans verimi düşüyor; acilen Enerji Santrali kurulmalı.`,
          actionLabel: '⚡ AI Bakan ile Santral Kur',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      if (m.waterDemand > m.waterSupply) {
        cityAdvice.push({
          priority: 'high',
          icon: '💧',
          title: `${prov.name}: Su Arıtma Kapasitesi Yetersiz (-${m.waterDemand - m.waterSupply} m³)`,
          detail: `Su talebi (${m.waterDemand} m³) arzı (${m.waterSupply} m³) geçti. Nüfus büyümesi için Su Arıtma Tesisi inşa edilmeli.`,
          actionLabel: '💧 AI Bakan ile Su Tesisi Kur',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      if (m.pollutedResidentialTiles.length > 0) {
        cityAdvice.push({
          priority: 'medium',
          icon: '🌳',
          title: `${prov.name}: Konutlarda Sanayi Kirliliği (${m.pollutedResidentialTiles.length} Parsel)`,
          detail: `Sanayi dumanı konut bölgelerini etkiliyor. Millet Bahçesi veya Şehir Hastanesi kurarak halk sağlığını koruyun.`,
          actionLabel: '🌳 AI Bakan ile Park Planla',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }

      if (m.happiness < 60) {
        cityAdvice.push({
          priority: 'high',
          icon: '🏥',
          title: `${prov.name}: Vatandaş Memnuniyeti Düşük (%${Math.round(m.happiness)})`,
          detail: `Düşük mutluluk vergi gelirlerini ve bina seviye artışını yavaşlatır. Şehir Hastanesi, Park veya Üniversite inşa edin.`,
          actionLabel: '🏗️ Şehri Optimize Et',
          actionFn: () => {
            if (SoH.state) SoH.state.selectedProvinceId = prov.id;
            return SoH.AI.runCityOptimizationStep(prov.id);
          }
        });
      }
    }

    if (playerGold > 400 && cityAdvice.length < 3 && playerProvs.length > 0) {
      const targetProv = this._getProvinceById(s.selectedProvinceId) || playerProvs[0];
      cityAdvice.push({
        priority: 'low',
        icon: '🛫',
        title: `Yatırım Fırsatı: ${Math.floor(playerGold)} Altın Hazine Rezervi`,
        detail: `Hazinedeki kaynağı ${targetProv.name} metropolünde Uluslararası Havalimanı, Ticaret Limanı veya Savunma Sanayi Tesisi kurmak için değerlendirebilirsiniz.`,
        actionLabel: '🤖 AI Bakan: Yatırım Yap',
        actionFn: () => SoH.AI.runCityOptimizationStep(targetProv.id)
      });
    }

    // 2. Küresel Strateji, Sınır Garnizonları, İttifak ve Ulusal Odak Analizi
    for (const prov of playerProvs) {
      const myArmy = this._getProvinceGarrison(prov);
      const neighbors = prov.neighbors || [];

      for (const nId of neighbors) {
        const nProv = this._getProvinceById(nId);
        if (!nProv || nProv.owner === playerNationId) continue;

        const rivalCfg = SoH.CONFIG.NATIONS[nProv.owner] || {};
        const rivalArmy = this._getProvinceGarrison(nProv);
        const rel = this._getRelation(playerNationId, nProv.owner);
        const isAtWar = playerNation && Array.isArray(playerNation.atWarWith) && playerNation.atWarWith.includes(nProv.owner);

        if ((isAtWar || rel < 45 || (rivalCfg.aggression && rivalCfg.aggression >= 0.6)) && rivalArmy > myArmy * 0.9) {
          strategyAdvice.push({
            priority: 'high',
            icon: '🎖️',
            title: `Sınır Tehdidi: ${prov.name} ↔ ${nProv.name} (${rivalCfg.flag || ''} ${rivalCfg.shortName || nProv.owner})`,
            detail: `${rivalCfg.name || nProv.owner}, ${nProv.name} sınırında ${rivalArmy} asker bulunduruyor (Sizin garnizonunuz: ${myArmy}). AI Genelkurmay ile sınıra Zırhlı/SİHA tümeni konuşlandırın!`,
            actionLabel: '🎖️ AI Genelkurmay Hamlesi',
            actionFn: () => SoH.AI.runFrontlineMarshalStep()
          });
        } else if (myArmy > rivalArmy * 1.5 && rel < 45) {
          strategyAdvice.push({
            priority: 'medium',
            icon: '⚔️',
            title: `Taarruz Fırsatı: ${nProv.name} Cephesi Zayıf (${rivalArmy} Asker)`,
            detail: `${prov.name} ordumuz (${myArmy} asker), komşu ${nProv.name} garnizonuna karşı üstün durumda.`,
            actionLabel: '🎖️ Cephe Hamlesi Yap',
            actionFn: () => SoH.AI.runFrontlineMarshalStep()
          });
        }
      }
    }

    // Kardeş/Dost Ülke İttifak Önerisi (Örn: Türkiye - Azerbaycan)
    if (playerNationId === 'turkiye' && s.nations && s.nations.azerbaycan) {
      const isAlliedAz = playerNation && Array.isArray(playerNation.allies) && playerNation.allies.includes('azerbaycan');
      if (!isAlliedAz) {
        strategyAdvice.push({
          priority: 'medium',
          icon: '🇦🇿',
          title: 'Stratejik Kardeşlik: Azerbaycan ile İttifak Kurun',
          detail: 'Bakü & Hazar Havzası enerji koridorunu güvenceye almak için Azerbaycan Cumhuriyeti ile resmi askeri ittifak imzalayabilirsiniz.',
          actionLabel: '🤝 İttifak Kur',
          actionFn: () => {
            if (SoH.Simulation && typeof SoH.Simulation.toggleAlliance === 'function') {
              const rel = this._getRelation('turkiye', 'azerbaycan');
              if (rel < 65) this._modifyRelation('turkiye', 'azerbaycan', 30);
              SoH.Simulation.toggleAlliance('turkiye', 'azerbaycan');
            }
          }
        });
      }
    }

    // Ulusal Odak & Teknoloji Kontrolü
    const unlockedTechs = (playerNation && playerNation.unlockedTechs) || [];
    const techs = SoH.CONFIG.TECHS || [];
    const affordableTech = techs.find(t => !t.unlocked && !unlockedTechs.includes(t.id) && researchPoints >= t.cost);
    if (affordableTech) {
      strategyAdvice.push({
        priority: 'high',
        icon: '🔬',
        title: `Ulusal Odak Hazır: ${affordableTech.name}`,
        detail: `${Math.floor(researchPoints)} Bilim puanınız birikti! "${affordableTech.name}" (${affordableTech.cost} Bilim) teknolojisini açarak ülkenize kalıcı güç kazandırın.`,
        actionLabel: '🎓 Teknolojiyi Aç',
        actionFn: () => {
          if (SoH.Simulation && typeof SoH.Simulation.unlockTech === 'function') {
            SoH.Simulation.unlockTech(affordableTech.id, playerNationId);
          }
          this._triggerUIRefresh();
        }
      });
    }

    if (cityAdvice.length === 0) {
      cityAdvice.push({
        priority: 'low',
        icon: '✅',
        title: 'Tüm Metropollerde Altyapı Dengede',
        detail: 'Elektrik, su ve otoyol şebekeleri tam kapasite çalışıyor. Yeni finans merkezleri veya savunma tesisleri kurabilirsiniz.',
        actionLabel: '🤖 AI Bakan ile Büyüt',
        actionFn: () => SoH.AI.runCityOptimizationStep(s.selectedProvinceId)
      });
    }

    if (strategyAdvice.length === 0) {
      strategyAdvice.push({
        priority: 'low',
        icon: '🎖️',
        title: 'Sınırlar Güvende & Ordular Hazır',

        } else if (nationState.gold >= 300 && ['almanya', 'polonya', 'iran', 'hindistan'].includes(nationId)) {

        const isAllied = Array.isArray(nationState.allies) && nationState.allies.includes(partnerId);

      for (const myProv of provinces) {

    if (s.autoMarshal && this._tickCounter % 3 === 0) {

      const idx1 = (this._tickCounter * 2) % allNationIds.length;
      const idx2 = (this._tickCounter * 2 + 1) % allNationIds.length;
      this._runWorldLeaderTurn(allNationIds[idx1]);
      if (idx2 !== idx1) {
        this._runWorldLeaderTurn(allNationIds[idx2]);
      }
    }
  },

  init() {
