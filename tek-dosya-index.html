      const items = [];
      const terrainLower = (t.terrain || '').toLowerCase();
      const isMountain = terrainLower.includes('dağ') || terrainLower.includes('plato') || terrainLower.includes('kafkas') || terrainLower.includes('ural');
      const isForest = terrainLower.includes('orman') || terrainLower.includes('tayga') || terrainLower.includes('amazon');
      const isDesert = terrainLower.includes('çöl') || terrainLower.includes('petrol') || terrainLower.includes('körfez');

      let attempts = 0;
      const targetCount = 8;
      while (items.length < targetCount && attempts < 55) {
        attempts++;
        const px = minX + 10 + rng() * Math.max(8, (maxX - minX - 20));
        const py = minY + 10 + rng() * Math.max(8, (maxY - minY - 20));
        const distCenter = Math.hypot(px - t.center.x, py - t.center.y);
        if (distCenter < 22) continue;
        if (pointInPolygon(px, py, poly)) {
          let type = 'tree';
          if (isMountain && rng() < 0.7) type = 'mountain';
          else if (isForest && rng() < 0.85) type = 'tree';
          else if (isDesert && rng() < 0.65) type = 'dune';
          else if (rng() < 0.35) type = 'mountain';
          items.push({
            x: px,
            y: py,
            type,
            scale: 0.65 + rng() * 0.45
          });
        }
      }
      provinceDecorations[t.id] = { items };
    });

    // Generate scenic trees around the 14x14 city grid
    cityScenicTrees.length = 0;
    const rngCity = seededRandom('city_scenic_v2');
    const gridSize = (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 14;
    const gridPx = gridSize * TILE_SIZE;
    for (let i = 0; i < 75; i++) {
      const sx = -190 + rngCity() * (gridPx + 380);
      const sy = -150 + rngCity() * (gridPx + 300);
      if (sx > -20 && sx < gridPx + 20 && sy > -20 && sy < gridPx + 20) continue;
      if (sy > gridPx + 12) continue;
      cityScenicTrees.push({
        x: sx,
        y: sy,
        scale: 0.7 + rngCity() * 0.65,
        shade: rngCity() > 0.5 ? '#15803d' : '#166534'
      });
    }
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx - worldCam.x) / worldCam.zoom,
      y: (sy - worldCam.y) / worldCam.zoom
    };
  }

  function screenToCity(sx, sy) {
    return {
      x: (sx - cityCam.x) / cityCam.zoom,
      y: (sy - cityCam.y) / cityCam.zoom
    };
  }

  // ============================================================================
  // MODE A: 'world' (Modern World Map, Opaque Countries, Visible Armies & Battles)
  // ============================================================================

  function renderWorldMode(dt) {
    // Smooth camera interpolation
    worldCam.x = lerp(worldCam.x, worldCam.targetX, Math.min(1, dt * 12));
    worldCam.y = lerp(worldCam.y, worldCam.targetY, Math.min(1, dt * 12));
    worldCam.zoom = lerp(worldCam.zoom, worldCam.targetZoom, Math.min(1, dt * 12));

    const wp = screenToWorld(pointer.x, pointer.y);
    pointer.worldX = wp.x;
    pointer.worldY = wp.y;

    // 1. Deep Cartographic Ocean Background (Screen Space)
    const oceanGrad = ctx.createRadialGradient(
      width * 0.5, height * 0.45, 60,
      width * 0.5, height * 0.5, Math.max(width, height) * 0.9
    );
    oceanGrad.addColorStop(0, '#0a2540');
    oceanGrad.addColorStop(0.55, '#06182c');
    oceanGrad.addColorStop(1, '#030d18');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(worldCam.x, worldCam.y);
    ctx.scale(worldCam.zoom, worldCam.zoom);

    // 2. World Graticule Grid (Latitude/Longitude lines across 2000x1050)
    drawWorldGraticule();

    // 3. Continental Landmass Silhouettes (`SoH.CONFIG.WORLD_CONTINENTS`)
    drawContinentalSilhouettes();

    const provinces = getAllProvinces();
    const mapMode = (SoH.state && SoH.state.mapMode) || 'political';
    const selectedId = SoH.state && SoH.state.selectedProvinceId;
    const armySourceId = SoH.state && SoH.state.armyMoveSourceId;
    const armySourceProv = armySourceId ? getProvince(armySourceId) : null;
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 5.2);

    // 4. Coastal Shallow Water Glow around all Provinces
    provinces.forEach(prov => {
      if (!prov.polygon || prov.polygon.length < 3) return;
      ctx.save();
      ctx.beginPath();
      prov.polygon.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt[0], pt[1]);
        else ctx.lineTo(pt[0], pt[1]);
      });
      ctx.closePath();
      ctx.lineJoin = 'round';
      ctx.lineWidth = 12;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.10)';
      ctx.stroke();
      ctx.restore();
    });

    // 5. OPAQUE COUNTRY COLORS & Province Polygon Fills (User's #1 Priority!)
    provinces.forEach(prov => {
      if (!prov.polygon || prov.polygon.length < 3) return;
      const isHovered = pointer.hoveredProvinceId === prov.id;
      const isSelected = selectedId === prov.id;
      const ownerCfg = getNationConfig(prov.owner);

      ctx.save();
      ctx.beginPath();
      prov.polygon.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt[0], pt[1]);
        else ctx.lineTo(pt[0], pt[1]);
      });
      ctx.closePath();

      if (mapMode === 'political') {
        // RICH, SOLID OPAQUE NATION COLOR (0.94 normal, 1.0 hovered/selected)
        ctx.globalAlpha = (isHovered || isSelected) ? 1.0 : 0.94;
        ctx.fillStyle = ownerCfg.color || '#e11d48';
        ctx.fill();

        // Subtle inner bevel gradient so each province has crisp tactical depth while remaining opaque
        ctx.clip();
        const bevelGrad = ctx.createRadialGradient(
          prov.center.x, prov.center.y - 10, 4,
          prov.center.x, prov.center.y, 95
        );
        bevelGrad.addColorStop(0, isSelected || isHovered ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)');
        bevelGrad.addColorStop(1, 'rgba(0,0,0,0.16)');
        ctx.fillStyle = bevelGrad;
        ctx.fill();
      } else if (mapMode === 'economy') {
        ctx.globalAlpha = 0.95;
        const income = prov.goldIncome || prov.goldNet || 45;
        const norm = clamp((income - 10) / 140, 0, 1);
        const r = Math.round(lerp(16, 250, norm));
        const g = Math.round(lerp(145, 204, norm));
        const b = Math.round(lerp(100, 21, norm));
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fill();
        ctx.clip();
      } else if (mapMode === 'military') {
        ctx.globalAlpha = 0.95;
        const milScore = (prov.garrison || 100) + (prov.defenseBonus || 0) * 3;
        const norm = clamp((milScore - 60) / 380, 0, 1);
        const r = Math.round(lerp(245, 220, norm));
        const g = Math.round(lerp(158, 38, norm));
        const b = Math.round(lerp(11, 38, norm));
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fill();
        ctx.clip();
      }

      // Subtle terrain relief icons inside polygon
      drawProvinceTerrainDecorations(prov);

      ctx.restore();
    });

    // 6. Crisp Sovereign Country Borders & Internal Province Borders
    provinces.forEach(prov => {
      if (!prov.polygon || prov.polygon.length < 3) return;
      const ownerCfg = getNationConfig(prov.owner);
      const isSelected = selectedId === prov.id;
      const isHovered = pointer.hoveredProvinceId === prov.id;
      const atWar = isNationAtWarWithPlayer(prov.owner);

      // Check if this province borders any foreign nation
      const hasForeignNeighbor = Array.isArray(prov.neighbors) && prov.neighbors.some(nId => {
        const np = getProvince(nId);
        return np && np.owner !== prov.owner;
      });

      ctx.save();
      ctx.beginPath();
      prov.polygon.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt[0], pt[1]);
        else ctx.lineTo(pt[0], pt[1]);
      });
      ctx.closePath();
      ctx.lineJoin = 'round';

      // Outer dark casing for sovereign borders
      ctx.lineWidth = hasForeignNeighbor ? 2.8 : 1.6;
      ctx.strokeStyle = '#090d16';
      ctx.stroke();

      // Inner highlight border
      if (isSelected) {
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 12 + pulse * 8;
        ctx.lineWidth = 3.2;
        ctx.strokeStyle = pulse > 0.5 ? '#fef08a' : '#facc15';
        ctx.stroke();
      } else if (atWar) {
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10 + pulse * 10;
        ctx.lineWidth = 2.8;
        ctx.strokeStyle = '#f87171';
        ctx.stroke();
      } else if (isHovered) {
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      } else {
        ctx.lineWidth = hasForeignNeighbor ? 1.4 : 0.9;
        ctx.strokeStyle = hasForeignNeighbor
          ? hexToRgba(ownerCfg.borderColor || '#f8fafc', 0.65)
          : 'rgba(9, 13, 22, 0.55)';
        ctx.stroke();
      }
      ctx.restore();
    });

    // 7. Strategic Sea Lanes & Supply Connections (subtle dashed lines)
    const drawnPairs = new Set();
    ctx.save();
    provinces.forEach(prov => {
      if (!Array.isArray(prov.neighbors)) return;
      prov.neighbors.forEach(nId => {
        const pairKey = prov.id < nId ? `${prov.id}_${nId}` : `${nId}_${prov.id}`;
        if (drawnPairs.has(pairKey)) return;
        drawnPairs.add(pairKey);
        const nProv = getProvince(nId);
        if (!nProv) return;

        const dist = Math.hypot(prov.center.x - nProv.center.x, prov.center.y - nProv.center.y);
        const isHighlightedRoute =
          (selectedId === prov.id || selectedId === nProv.id) ||
          (armySourceId === prov.id || armySourceId === nProv.id);

        // Only draw long sea-lanes or highlighted neighbor routes to keep map clean
        if (!isHighlightedRoute && dist < 130) return;

        ctx.beginPath();
        ctx.moveTo(prov.center.x, prov.center.y);
        ctx.lineTo(nProv.center.x, nProv.center.y);
        ctx.setLineDash(isHighlightedRoute ? [6, 4] : [3, 6]);
        ctx.lineDashOffset = isHighlightedRoute ? -elapsed * 20 : 0;
        ctx.lineWidth = isHighlightedRoute ? 2.0 : 1.0;
        ctx.strokeStyle = isHighlightedRoute
          ? 'rgba(253, 224, 71, 0.7)'
          : 'rgba(148, 163, 184, 0.22)';
        ctx.stroke();
      });
    });
    ctx.restore();

    // 8. Country Name Banners across Each Nation's Territory (HOI4 / AoH3 Map Typography)
    drawCountryMapBanners(provinces);

    // 9. Army Move Target Reticles & Order Preview Arrow
    if (armySourceProv && Array.isArray(armySourceProv.neighbors)) {
      armySourceProv.neighbors.forEach(nId => {
        const nProv = getProvince(nId);
        if (!nProv) return;
        const isEnemy = nProv.owner !== armySourceProv.owner;
        const reticleColor = isEnemy ? '#ef4444' : '#38bdf8';
        const rRadius = 22 + pulse * 6;

        ctx.save();
        ctx.translate(nProv.center.x, nProv.center.y);
        ctx.strokeStyle = reticleColor;
        ctx.lineWidth = 2.4;
        ctx.setLineDash([5, 4]);
        ctx.rotate(elapsed * 1.6);
        ctx.beginPath();
        ctx.arc(0, 0, rRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      const hoveredProv = pointer.hoveredProvinceId ? getProvince(pointer.hoveredProvinceId) : null;
      if (hoveredProv && armySourceProv.neighbors.includes(hoveredProv.id)) {
        const isAttack = hoveredProv.owner !== armySourceProv.owner;
        drawAnimatedMarchArrow(
          armySourceProv.center.x,
          armySourceProv.center.y,
          hoveredProv.center.x,
          hoveredProv.center.y,
          isAttack ? '#ef4444' : '#38bdf8',
          `${isAttack ? '⚔️ TAARRUZ EMRİ' : '🛡️ İNTİKAL'}: ${Math.floor((armySourceProv.garrison || 0) * 0.7)} Asker`
        );
      }
    }

    // 10. Province City Labels & HOI4 / AoH3 Military Division Counters
    provinces.forEach(prov => {
      drawProvinceDivisionCounterAndLabel(
        prov,
        selectedId === prov.id,
        pointer.hoveredProvinceId === prov.id
      );
    });

    // 11. Animated Marching Armies & Live Battle Explosions (`SoH.state.activeBattles`)
    drawActiveBattlesAndMarches();

    // 12. Decorative Compass Rose
    drawCompassRose(110, 930);

    ctx.restore();
  }

  function drawWorldGraticule() {
    const mapW = (SoH.CONFIG && SoH.CONFIG.MAP_WIDTH) || 2000;
    const mapH = (SoH.CONFIG && SoH.CONFIG.MAP_HEIGHT) || 1050;

    ctx.save();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= mapW; gx += 125) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, mapH);
      ctx.stroke();
    }
    for (let gy = 0; gy <= mapH; gy += 105) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(mapW, gy);
      ctx.stroke();
    }

    // Equator & Tropic dashed lines
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.11)';
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(0, 560);
    ctx.lineTo(mapW, 560);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawContinentalSilhouettes() {
    const continents = (SoH.CONFIG && SoH.CONFIG.WORLD_CONTINENTS) || [];
    if (!continents.length) return;

    ctx.save();
    continents.forEach(poly => {
      if (!poly || poly.length < 3) return;
      ctx.beginPath();
      poly.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt[0], pt[1]);
        else ctx.lineTo(pt[0], pt[1]);
      });
      ctx.closePath();
      ctx.lineJoin = 'round';

      // Outer shallow coastal glow
      ctx.lineWidth = 14;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
      ctx.stroke();

      // Neutral landmass fill (#1e293b) and coastline stroke (#334155)
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#334155';
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawProvinceTerrainDecorations(prov) {
    const deco = provinceDecorations[prov.id];
    if (!deco || !deco.items) return;

    ctx.save();
    deco.items.forEach(item => {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.scale(item.scale, item.scale);

      if (item.type === 'mountain') {
        ctx.beginPath();
        ctx.moveTo(-9, 5);
        ctx.lineTo(0, -8);
        ctx.lineTo(9, 5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.32)';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-3.5, -3);
        ctx.lineTo(0, -8);
        ctx.lineTo(3.5, -3);
        ctx.closePath();
        ctx.fillStyle = 'rgba(248, 250, 252, 0.45)';
        ctx.fill();
      } else if (item.type === 'tree') {
        ctx.fillStyle = 'rgba(6, 78, 59, 0.35)';
        ctx.beginPath();
        ctx.moveTo(-5, 3);
        ctx.lineTo(0, -7);
        ctx.lineTo(5, 3);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(254, 240, 138, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-5, 2);
        ctx.quadraticCurveTo(0, -3, 5, 2);
        ctx.stroke();
      }
      ctx.restore();
    });
    ctx.restore();
  }

  function drawCountryMapBanners(provinces) {
    // Group provinces by owner nation to compute territory centroid
    const groups = {};
    provinces.forEach(p => {
      if (!groups[p.owner]) groups[p.owner] = [];
      groups[p.owner].push(p);
    });

    ctx.save();
    Object.keys(groups).forEach(ownerId => {
      const list = groups[ownerId];
      if (!list || list.length === 0) return;
      const nCfg = getNationConfig(ownerId);

      let sumX = 0, sumY = 0;
      list.forEach(p => {
        sumX += p.center.x;
        sumY += p.center.y;
      });
      const cx = sumX / list.length;
      const cy = sumY / list.length - 20;

      const label = `${nCfg.flag || ''} ${(nCfg.shortName || nCfg.name || '').toUpperCase()}`.trim();
      const fontSize = list.length >= 4 ? 13 : (list.length >= 2 ? 10.5 : 9);

      ctx.font = `900 ${fontSize}px "Inter", "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Crisp dark outline + translucent sovereign text like HOI4 / AoH3
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(9, 13, 22, 0.78)';
      ctx.strokeText(label, cx, cy);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.86)';
      ctx.fillText(label, cx, cy);
    });
    ctx.restore();
  }

  function getDominantUnitIcon(prov) {
    const u = prov.units || prov.divisions || prov.army;
    if (u && typeof u === 'object') {
      if ((u.tank || 0) > 0) return '🛡️';
      if ((u.airforce || 0) > 0) return '✈️';
      if ((u.artillery || 0) > 0) return '🚀';
      if ((u.infantry || 0) > 0) return '🪖';
    }
    if (prov.bonusType === 'arms_factory' || (prov.garrison || 0) >= 200) return '🛡️';
    if (prov.bonusType === 'airport') return '✈️';
    return '🪖';
  }

  function drawProvinceDivisionCounterAndLabel(prov, isSelected, isHovered) {
    const cx = prov.center.x;
    const cy = prov.center.y;
    const ownerCfg = getNationConfig(prov.owner);
    const cityLabel = prov.cityName || prov.name.split('&')[0].trim();

    ctx.save();

    // 1. Capital Star & City Name Label at Center-Top
    ctx.font = isSelected || prov.isCapital
      ? 'bold 9.5px "Inter", "Segoe UI", sans-serif'
      : '600 8.8px "Inter", "Segoe UI", sans-serif';
    const fullCityText = prov.isCapital ? `★ ${cityLabel}` : `• ${cityLabel}`;
    const nameW = Math.max(44, ctx.measureText(fullCityText).width + 10);
    const nameY = cy - 13;

    roundRectPath(ctx, cx - nameW / 2, nameY, nameW, 13, 3.5);
    ctx.fillStyle = isSelected
      ? 'rgba(9, 13, 22, 0.95)'
      : 'rgba(9, 13, 22, 0.78)';
    ctx.fill();
    if (prov.isCapital || isSelected) {
      ctx.strokeStyle = prov.isCapital ? '#facc15' : '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.fillStyle = prov.isCapital ? '#fef08a' : '#f8fafc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fullCityText, cx, nameY + 6.8);

    // 2. HOI4 / Age of History 3 Military Division Counter Box right below the city name
    const garrison = Math.max(0, Math.round(prov.garrison !== undefined ? prov.garrison : 120));
    const unitIcon = getDominantUnitIcon(prov);
    const strengthStr = garrison >= 1000 ? `${(garrison / 1000).toFixed(1)}K` : `${garrison}`;

    const boxW = 54;
    const boxH = 16;
    const boxX = cx - boxW / 2;
    const boxY = cy + 2;

    // Drop shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    roundRectPath(ctx, boxX + 1.5, boxY + 1.5, boxW, boxH, 3);
    ctx.fill();

    // Metallic dark tactical counter body
    ctx.fillStyle = '#0f172a';
    roundRectPath(ctx, boxX, boxY, boxW, boxH, 3);
    ctx.fill();

    // Left stripe in owner nation's solid opaque color
    ctx.fillStyle = ownerCfg.color || '#e11d48';
    ctx.fillRect(boxX + 1, boxY + 1, 5, boxH - 2);

    // Crisp tactical border (gold if selected, red if at war, else slate/white)
    const atWar = isNationAtWarWithPlayer(prov.owner);
    ctx.lineWidth = isSelected || isHovered ? 1.5 : 1.1;
    ctx.strokeStyle = isSelected
      ? '#facc15'
      : (atWar ? '#ef4444' : (isHovered ? '#f8fafc' : '#64748b'));
    roundRectPath(ctx, boxX, boxY, boxW, boxH, 3);
    ctx.stroke();

    // Flag + Dominant Unit Icon + Troop Strength inside counter
    ctx.font = 'bold 8.5px "Inter", "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(`${ownerCfg.flag || ''}${unitIcon}`, boxX + 7.5, boxY + 7);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#fef08a';
    ctx.fillText(strengthStr, boxX + boxW - 3.5, boxY + 7);

    // Bright green organization / morale bar along bottom of counter
    const orgRatio = clamp((prov.happiness || 80) / 100, 0.35, 1);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(boxX + 6, boxY + boxH - 3, boxW - 8, 2);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(boxX + 6, boxY + boxH - 3, (boxW - 8) * orgRatio, 2);

    // 3. Miniature Tank / Armored Silhouette next to counter on strong garrisons (>= 160)
    if (garrison >= 160) {
      drawMiniTankSilhouette(boxX - 10, boxY + 8, ownerCfg.color);
    }

    ctx.restore();
  }

  function drawMiniTankSilhouette(x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    // Tank tracks
    ctx.fillStyle = '#090d16';
    roundRectPath(ctx, -6, 1, 12, 4, 1.5);
    ctx.fill();
    // Hull
    ctx.fillStyle = color || '#e11d48';
    roundRectPath(ctx, -5, -1.5, 10, 3.5, 1);
    ctx.fill();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    // Turret & gun barrel
    ctx.beginPath();
    ctx.arc(0, -2.5, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(1, -2.5);
    ctx.lineTo(7, -3.2);
    ctx.stroke();
    ctx.restore();
  }

  function drawActiveBattlesAndMarches() {
    const battles = (SoH.state && (SoH.state.activeBattles || SoH.state.marchingArmies)) || [];
    if (!battles.length) return;

    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 8);

    battles.forEach(b => {
      const fromProv = getProvince(b.fromId || b.from || b.sourceId);
      const toProv = getProvince(b.toId || b.to || b.targetId);
      if (!fromProv || !toProv) return;

      const x1 = fromProv.center.x;
      const y1 = fromProv.center.y;
      const x2 = toProv.center.x;
      const y2 = toProv.center.y;

      const prog = clamp(b.progress !== undefined ? b.progress : 0.65, 0.05, 1);
      const isEnemyBattle = b.isAttack !== undefined ? b.isAttack : (fromProv.owner !== toProv.owner);
      const arrowColor = isEnemyBattle ? '#ef4444' : '#38bdf8';

      // 1. Tactical Assault Arrow from source to target
      drawAnimatedMarchArrow(x1, y1, x2, y2, arrowColor, null);

      // 2. Moving Division Counter along the march vector
      const mx = lerp(x1, x2, prog);
      const my = lerp(y1, y2, prog);
      const attCfg = getNationConfig(b.attackerOwner || b.owner || fromProv.owner);
      const troops = Math.round(b.attackerTroops || b.troops || b.amount || 140);

      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.8;
      roundRectPath(ctx, mx - 24, my - 10, 48, 18, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = attCfg.color || '#e11d48';
      ctx.fillRect(mx - 23, my - 9, 4, 16);

      ctx.font = 'bold 8.5px "Inter", sans-serif';
      ctx.fillStyle = '#fef08a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${attCfg.flag || '⚔️'} ${troops}`, mx + 2, my - 1);
      ctx.restore();

      // 3. Pulsing Battle Crossed-Swords & Live Combat Bar at Target Province
      if (isEnemyBattle) {
        const bx = x2;
        const by = y2 - 28;

        ctx.save();
        // Fiery explosion shockwave circle
        ctx.beginPath();
        ctx.arc(bx, by, 13 + pulse * 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(239, 68, 68, ${0.25 + pulse * 0.25})`;
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Crossed swords & explosion icon
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pulse > 0.5 ? '⚔️' : '💥', bx, by);

        // Attacker vs Defender Live Combat Progress Bar
        const defTroops = Math.max(10, Math.round(b.defenderTroops !== undefined ? b.defenderTroops : (toProv.garrison || 100)));
        const ratio = clamp(troops / Math.max(1, troops + defTroops), 0.12, 0.88);
        const barW = 56;
        const barH = 6;
        const barX = bx - barW / 2;
        const barY = by - 16;

        ctx.fillStyle = '#090d16';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        // Attacker bar (red/gold)
        ctx.fillStyle = attCfg.color || '#ef4444';
        ctx.fillRect(barX, barY, barW * ratio, barH);
        // Defender bar (blue/emerald)
        const defCfg = getNationConfig(toProv.owner);
        ctx.fillStyle = defCfg.color || '#3b82f6';
        ctx.fillRect(barX + barW * ratio, barY, barW * (1 - ratio), barH);
        ctx.restore();
      }
    });
  }

  function drawAnimatedMarchArrow(x1, y1, x2, y2, color, labelText) {
    ctx.save();
    const dx = x2 - x1;
    const dy = y2 - y1;
    const angle = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);

    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 6]);
    ctx.lineDashOffset = -elapsed * 42;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.setLineDash([]);
    const headDist = Math.max(16, dist - 20);
    const hx = x1 + Math.cos(angle) * headDist;
    const hy = y1 + Math.sin(angle) * headDist;
    ctx.translate(hx, hy);
    ctx.rotate(angle);
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(-8, -7);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-8, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (labelText) {
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2 - 14;
      ctx.save();
      ctx.font = 'bold 10px "Inter", "Segoe UI", sans-serif';
      const tw = ctx.measureText(labelText).width + 14;
      roundRectPath(ctx, mx - tw / 2, my - 10, tw, 20, 5);
      ctx.fillStyle = 'rgba(9, 13, 22, 0.92)';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, mx, my);
      ctx.restore();
    }
  }

  function drawCompassRose(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);

    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(9, 13, 22, 0.72)';
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 2);
      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(5, -5);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#facc15' : 'rgba(226, 232, 240, 0.6)';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(-5, -5);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#ca8a04' : 'rgba(148, 163, 184, 0.45)';
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 9.5px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', 0, -42);
    ctx.fillStyle = 'rgba(226, 232, 240, 0.6)';
    ctx.fillText('G', 0, 42);
    ctx.fillText('D', 42, 0);
    ctx.fillText('B', -42, 0);

    ctx.restore();
  }

  // ============================================================================
  // MODE B: 'city' (14x14 Cities: Skylines II Grid + Day/Night + 14 Buildings)
  // ============================================================================

  function renderCityMode(dt) {
    const selectedId = (SoH.state && SoH.state.selectedProvinceId) || 'tr_ankara';
    const prov = getProvince(selectedId) || getAllProvinces()[0];
    if (!prov || !prov.grid) return;

    if (lastCityProvId !== prov.id) {
      lastCityProvId = prov.id;
      vehicles.length = 0;
      smokeParticles.length = 0;
    }

    cityCam.x = lerp(cityCam.x, cityCam.targetX, Math.min(1, dt * 12));
    cityCam.y = lerp(cityCam.y, cityCam.targetY, Math.min(1, dt * 12));
    cityCam.zoom = lerp(cityCam.zoom, cityCam.targetZoom, Math.min(1, dt * 12));

    const gridSize = prov.grid.length || (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 14;
    const boardPx = gridSize * TILE_SIZE;
    const overlayMode = (SoH.state && SoH.state.overlayMode) || 'none';
    const isNight = Boolean(SoH.state && SoH.state.nightMode);

    // Update hovered tile coordinates
    const cp = screenToCity(pointer.x, pointer.y);
    const gx = Math.floor(cp.x / TILE_SIZE);
    const gy = Math.floor(cp.y / TILE_SIZE);
    if (gx >= 0 && gx < gridSize && gy >= 0 && gy < gridSize) {
      if (!pointer.hoveredTile || pointer.hoveredTile.x !== gx || pointer.hoveredTile.y !== gy) {
        pointer.hoveredTile = { x: gx, y: gy };
        if (SoH.UI && typeof SoH.UI.onTileHover === 'function') {
          SoH.UI.onTileHover(gx, gy, prov.grid[gy][gx]);
        }
      }
    } else if (pointer.hoveredTile !== null) {
      pointer.hoveredTile = null;
      if (SoH.UI && typeof SoH.UI.onTileHover === 'function') {
        SoH.UI.onTileHover(-1, -1, null);
      }
    }

    // 1. Day / Night Countryside Background
    const bgGrad = ctx.createRadialGradient(
      width * 0.5, height * 0.5, 80,
      width * 0.5, height * 0.5, Math.max(width, height) * 0.85
    );
    if (isNight) {
      bgGrad.addColorStop(0, '#091526');
      bgGrad.addColorStop(0.65, '#050d1a');
      bgGrad.addColorStop(1, '#02060d');
    } else {
      bgGrad.addColorStop(0, '#14532d');
      bgGrad.addColorStop(0.65, '#0f3f22');
      bgGrad.addColorStop(1, '#072213');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(cityCam.x, cityCam.y);
    ctx.scale(cityCam.zoom, cityCam.zoom);

    // 2. Surrounding Scenic Environment (Highway Entrance, Southern Harbor/Coast, Trees)
    drawCityScenicSurroundings(boardPx, prov, isNight);

    // 3. Elevated Architectural City Board Foundation
    ctx.save();
    ctx.fillStyle = 'rgba(2, 6, 23, 0.6)';
    roundRectPath(ctx, -10, -6, boardPx + 20, boardPx + 26, 12);
    ctx.fill();

    ctx.fillStyle = isNight ? '#1e293b' : '#334155';
    roundRectPath(ctx, -6, -6, boardPx + 12, boardPx + 16, 8);
    ctx.fill();
    ctx.strokeStyle = isNight ? '#475569' : '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 4. Base Ground Tiles & Data Overlays
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const tx = x * TILE_SIZE;
        const ty = y * TILE_SIZE;

        const isEven = (x + y) % 2 === 0;
        if (isNight) {
          ctx.fillStyle = isEven ? '#0c2e1f' : '#0a2619';
        } else {
          ctx.fillStyle = isEven ? '#166534' : '#15803d';
        }
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);

        if (overlayMode !== 'none') {
          drawCellOverlayHeatmap(cell, tx, ty, overlayMode);
        }

        ctx.strokeStyle = isNight ? 'rgba(148, 163, 184, 0.08)' : 'rgba(255, 255, 255, 0.09)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
      }
    }

    // 5. Power & Water Utility Networks in Overlay Mode
    if (overlayMode === 'water' || overlayMode === 'power') {
      drawUtilityNetworks(prov, gridSize, overlayMode);
    }

    // 6. Custom Detailed Procedural Artwork for all 14 Buildings
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const bId = getCellBuildingId(cell);
        if (!bId) continue;

        const tx = x * TILE_SIZE;
        const ty = y * TILE_SIZE;
        const level = getCellLevel(cell);

        if (bId === 'road') {
          drawRoadTile(prov.grid, x, y, tx, ty, gridSize, isNight);
        } else {
          drawProceduralBuilding(bId, level, tx, ty, x, y, cell, isNight);
        }

        drawBuildingStatusBadges(cell, bId, level, tx, ty);
      }
    }

    // 7. Animated Road Traffic (with glowing headlights in Night Mode)
    updateAndDrawTraffic(dt, prov.grid, gridSize, isNight);

    // 8. Rising Factory Smoke & Floating '+₺' Coins
    updateAndDrawCityParticles(dt, prov.grid, gridSize);

    // 9. Selected Tile & Hovered Tile Ghost Preview
    if (pointer.selectedTile) {
      const sx = pointer.selectedTile.x * TILE_SIZE;
      const sy = pointer.selectedTile.y * TILE_SIZE;
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(sx + 1.5, sy + 1.5, TILE_SIZE - 3, TILE_SIZE - 3);
      ctx.restore();
    }

    if (pointer.hoveredTile) {
      drawHoveredTileAndToolPreview(prov, pointer.hoveredTile.x, pointer.hoveredTile.y, isNight);
    }

    ctx.restore();
  }

  function drawCityScenicSurroundings(boardPx, prov, isNight) {
    ctx.save();

    // North Interstate Highway Connection
    const hwyX = 6 * TILE_SIZE;
    ctx.fillStyle = isNight ? '#1e293b' : '#334155';
    ctx.fillRect(hwyX, -140, TILE_SIZE * 2, 140);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hwyX, -140);
    ctx.lineTo(hwyX, 0);
    ctx.moveTo(hwyX + TILE_SIZE * 2, -140);
    ctx.lineTo(hwyX + TILE_SIZE * 2, 0);
    ctx.stroke();

    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(hwyX + TILE_SIZE, -140);
    ctx.lineTo(hwyX + TILE_SIZE, 0);
    ctx.stroke();
    ctx.setLineDash([]);

    // Highway overhead sign
    const signLabel = ((prov.cityName || prov.name).split('/')[0].trim().toUpperCase()) + ' METROPOLÜ';
    roundRectPath(ctx, hwyX + 8, -52, TILE_SIZE * 2 - 16, 22, 4);
    ctx.fillStyle = '#065f46';
    ctx.fill();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 8.5px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(signLabel, hwyX + TILE_SIZE, -41);

    // Southern Coastline / Harbor Water
    const waterY = boardPx + 10;
    const waterGrad = ctx.createLinearGradient(0, waterY, 0, waterY + 180);
    if (isNight) {
      waterGrad.addColorStop(0, '#072a47');
      waterGrad.addColorStop(1, '#031525');
    } else {
      waterGrad.addColorStop(0, '#0284c7');
      waterGrad.addColorStop(1, '#0c4a6e');
    }
    ctx.fillStyle = waterGrad;
    roundRectPath(ctx, -180, waterY, boardPx + 360, 170, 24);
    ctx.fill();

    ctx.strokeStyle = isNight ? '#475569' : '#fde68a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-150, waterY + 2);
    ctx.lineTo(boardPx + 150, waterY + 2);
    ctx.stroke();

    cityScenicTrees.forEach(t => {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(t.scale, t.scale);
      ctx.fillStyle = isNight ? '#062016' : t.shade;
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  }

  function drawCellOverlayHeatmap(cell, tx, ty, mode) {
    ctx.save();
    if (mode === 'power') {
      ctx.fillStyle = cell.powered
        ? 'rgba(34, 211, 238, 0.36)'
        : 'rgba(15, 23, 42, 0.55)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'water') {
      ctx.fillStyle = cell.watered
        ? 'rgba(56, 189, 248, 0.42)'
        : 'rgba(15, 23, 42, 0.55)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'pollution') {
      const poll = clamp((cell.pollution || 0) / 50, 0, 1);
      ctx.fillStyle = poll > 0.02
        ? `rgba(192, 38, 211, ${0.22 + poll * 0.58})`
        : 'rgba(34, 197, 94, 0.18)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    } else if (mode === 'happiness') {
      const lv = cell.landValue !== undefined ? cell.landValue : 50;
      const poll = cell.pollution || 0;
      const net = clamp((lv - poll + 20) / 100, 0, 1);
      const r = Math.round(lerp(239, 16, net));
      const g = Math.round(lerp(68, 185, net));
      const b = Math.round(lerp(68, 129, net));
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.45)`;
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
    }
    ctx.restore();
  }

  function drawUtilityNetworks(prov, gridSize, overlayMode) {
    ctx.save();
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = prov.grid[y][x];
        const bId = getCellBuildingId(cell);
        const cx = (x + 0.5) * TILE_SIZE;
        const cy = (y + 0.5) * TILE_SIZE;

        if (overlayMode === 'power' && bId === 'power_plant') {
          ctx.beginPath();
          ctx.arc(cx, cy, TILE_SIZE * 5, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([8, 6]);
          ctx.stroke();
          ctx.fillStyle = 'rgba(250, 204, 21, 0.08)';
          ctx.fill();
        }

        if (overlayMode === 'water') {
          if (bId === 'water_tower') {
            ctx.beginPath();
            ctx.arc(cx, cy, TILE_SIZE * 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
            ctx.fill();
          }
          if (bId === 'road' || cell.watered) {
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.75)';
            ctx.lineWidth = 3.5;
            if (x + 1 < gridSize && (getCellBuildingId(prov.grid[y][x + 1]) === 'road' || prov.grid[y][x + 1].watered)) {
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + TILE_SIZE, cy);
              ctx.stroke();
            }
            if (y + 1 < gridSize && (getCellBuildingId(prov.grid[y + 1][x]) === 'road' || prov.grid[y + 1][x].watered)) {
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx, cy + TILE_SIZE);
              ctx.stroke();
            }
          }
        }
      }
    }
    ctx.restore();
  }

  // --- Custom Procedural Artwork for All 14 Building Types ---

  function drawRoadTile(grid, gx, gy, tx, ty, gridSize, isNight) {
    const hasN = gy > 0 && getCellBuildingId(grid[gy - 1][gx]) === 'road';
    const hasS = gy < gridSize - 1 && getCellBuildingId(grid[gy + 1][gx]) === 'road';
    const hasW = gx > 0 && getCellBuildingId(grid[gy][gx - 1]) === 'road';
    const hasE = gx < gridSize - 1 && getCellBuildingId(grid[gy][gx + 1]) === 'road';

    const pad = 8;
    const roadW = TILE_SIZE - pad * 2;
    const cx = tx + TILE_SIZE / 2;
    const cy = ty + TILE_SIZE / 2;

    ctx.save();
    ctx.fillStyle = isNight ? '#475569' : '#94a3b8';
    ctx.fillRect(tx + 2, ty + 2, TILE_SIZE - 4, TILE_SIZE - 4);

    ctx.fillStyle = isNight ? '#1e293b' : '#334155';
    ctx.fillRect(tx + pad, ty + pad, roadW, roadW);

    if (hasN) ctx.fillRect(tx + pad, ty, roadW, pad);
    if (hasS) ctx.fillRect(tx + pad, ty + TILE_SIZE - pad, roadW, pad);
    if (hasW) ctx.fillRect(tx, ty + pad, pad, roadW);
    if (hasE) ctx.fillRect(tx + TILE_SIZE - pad, ty + pad, pad, roadW);

    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    if (hasN) { ctx.moveTo(cx, ty); ctx.lineTo(cx, cy); }
    if (hasS) { ctx.moveTo(cx, cy); ctx.lineTo(cx, ty + TILE_SIZE); }
    if (hasW) { ctx.moveTo(tx, cy); ctx.lineTo(cx, cy); }
    if (hasE) { ctx.moveTo(cx, cy); ctx.lineTo(tx + TILE_SIZE, cy); }
    if (!hasN && !hasS && !hasW && !hasE) {
      ctx.moveTo(tx + pad + 4, cy);
      ctx.lineTo(tx + TILE_SIZE - pad - 4, cy);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Warm streetlamp glow pools in Night Mode
    if (isNight) {
      const lampGrad = ctx.createRadialGradient(tx + 9, ty + 9, 1, tx + 9, ty + 9, 14);
      lampGrad.addColorStop(0, 'rgba(253, 224, 71, 0.55)');
      lampGrad.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = lampGrad;
      ctx.beginPath();
      ctx.arc(tx + 9, ty + 9, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawProceduralBuilding(bId, level, tx, ty, gx, gy, cell, isNight) {
    ctx.save();
    const s = TILE_SIZE;
    const powered = !cell || cell.powered !== false;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
    roundRectPath(ctx, tx + 2.5, ty + 2.5, s - 5, s - 5, 4);
    ctx.fill();

    switch (bId) {
      case 'residential':
        drawResidentialBuilding(tx, ty, s, level, powered, isNight);
        break;
      case 'commercial':
        drawCommercialBuilding(tx, ty, s, level, powered, isNight);
        break;
      case 'industrial':
        drawIndustrialBuilding(tx, ty, s, level);
        break;
      case 'farm':
        drawFarmBuilding(tx, ty, s, gx, gy);
        break;
      case 'power_plant':
        drawPowerPlantBuilding(tx, ty, s);
        break;
      case 'water_tower':
        drawWaterTowerBuilding(tx, ty, s);
        break;
      case 'park':
        drawParkBuilding(tx, ty, s);
        break;
      case 'university':
        drawUniversityBuilding(tx, ty, s);
        break;
      case 'barracks':
        drawBarracksBuilding(tx, ty, s);
        break;
      case 'hospital':
        drawHospitalBuilding(tx, ty, s, powered, isNight);
        break;
      case 'seaport':
        drawSeaportBuilding(tx, ty, s);
        break;
      case 'airport':
        drawAirportBuilding(tx, ty, s, isNight);
        break;
      case 'arms_factory':
        drawArmsFactoryBuilding(tx, ty, s);
        break;
    }
    ctx.restore();
  }

  function drawResidentialBuilding(tx, ty, s, level, powered, isNight) {
    ctx.fillStyle = isNight ? '#064e3b' : '#22c55e';
    roundRectPath(ctx, tx + 3, ty + 3, s - 6, s - 6, 4);
    ctx.fill();

    if (level === 1) {
      for (let i = 0; i < 2; i++) {
        const hx = tx + (i === 0 ? 7 : 26);
        const hy = ty + (i === 0 ? 10 : 22);
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(hx, hy, 16, 16);
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(hx - 2, hy);
        ctx.lineTo(hx + 8, hy - 6);
        ctx.lineTo(hx + 18, hy);
        ctx.lineTo(hx + 16, hy + 8);
        ctx.lineTo(hx, hy + 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = powered ? (isNight ? '#fef08a' : '#fde047') : '#475569';
        ctx.fillRect(hx + 4, hy + 10, 5, 4);
      }
    } else if (level === 2) {
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(tx + 8, ty + 6, s - 16, s - 14);
      ctx.fillStyle = '#0f766e';
      ctx.fillRect(tx + 8, ty + 6, s - 16, 7);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          ctx.fillStyle = powered ? '#fef08a' : '#334155';
          ctx.fillRect(tx + 12 + c * 10, ty + 16 + r * 8, 6, 4.5);
        }
      }
    } else {
      const towerGrad = ctx.createLinearGradient(tx + 7, ty + 4, tx + s - 8, ty + s - 6);
      towerGrad.addColorStop(0, '#0284c7');

  // --- Animated Road Traffic & Particle Systems ---

  function updateAndDrawTraffic(dt, grid, gridSize, isNight) {
    const roadTiles = [];
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        if (getCellBuildingId(grid[y][x]) === 'road') {
          roadTiles.push({ x, y });
        }
      }
    }

    if (roadTiles.length === 0) {
      vehicles.length = 0;
      return;
    }

    const targetCount = Math.min(MAX_VEHICLES, Math.max(10, roadTiles.length * 2));
    while (vehicles.length < targetCount) {
      const start = roadTiles[Math.floor(Math.random() * roadTiles.length)];
      const colors = ['#ef4444', '#38bdf8', '#facc15', '#f8fafc', '#a855f7', '#fb923c', '#22c55e'];
      const vTypeRand = Math.random();
      const vType = vTypeRand < 0.16 ? 'bus' : (vTypeRand < 0.32 ? 'truck' : 'car');
      vehicles.push({
        gx: start.x,
        gy: start.y,
        tx: start.x,
        ty: start.y,
        progress: Math.random(),
        speed: vType === 'bus' ? 1.15 : (vType === 'truck' ? 1.3 : 1.8 + Math.random() * 0.6),
        color: colors[Math.floor(Math.random() * colors.length)],
        type: vType,
        dirX: 1,
        dirY: 0
      });
    }

    ctx.save();
    for (let i = vehicles.length - 1; i >= 0; i--) {
      const v = vehicles[i];
      if (!grid[v.gy] || getCellBuildingId(grid[v.gy][v.gx]) !== 'road') {
        vehicles.splice(i, 1);
        continue;
      }

      v.progress += dt * v.speed;
      if (v.progress >= 1) {
        v.gx = v.tx;
        v.gy = v.ty;
        v.progress = 0;

        const dirs = [
          { dx: 1, dy: 0 },
          { dx: -1, dy: 0 },
          { dx: 0, dy: 1 },
          { dx: 0, dy: -1 }
        ];
        const valid = dirs.filter(d => {
          const nx = v.gx + d.dx;
          const ny = v.gy + d.dy;
          return nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize &&
            getCellBuildingId(grid[ny][nx]) === 'road';
        });

        if (valid.length > 0) {
          const nonReverse = valid.filter(d => !(d.dx === -v.dirX && d.dy === -v.dirY));
          const pool = nonReverse.length > 0 ? nonReverse : valid;
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          v.tx = v.gx + chosen.dx;
          v.ty = v.gy + chosen.dy;
          v.dirX = chosen.dx;
          v.dirY = chosen.dy;
        } else {
          v.tx = v.gx;
          v.ty = v.gy;
        }
      }

      const wx = lerp(v.gx, v.tx, v.progress) * TILE_SIZE + TILE_SIZE / 2;
      const wy = lerp(v.gy, v.ty, v.progress) * TILE_SIZE + TILE_SIZE / 2;
      const laneOffset = 4;
      const px = wx - v.dirY * laneOffset;
      const py = wy + v.dirX * laneOffset;
      const angle = Math.atan2(v.dirY, v.dirX);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);

      const len = v.type === 'bus' ? 11 : (v.type === 'truck' ? 9.5 : 7);
      const wid = v.type === 'bus' ? 4.6 : 4;

      // Headlight beam cones in Night Mode
      if (isNight) {
        ctx.fillStyle = 'rgba(254, 240, 138, 0.35)';
        ctx.beginPath();
        ctx.moveTo(len / 2, 0);
        ctx.lineTo(len / 2 + 14, -6);
        ctx.lineTo(len / 2 + 14, 6);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = v.color;
      roundRectPath(ctx, -len / 2, -wid / 2, len, wid, 1.5);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(len / 2 - 2.5, -wid / 2 + 0.8, 1.8, wid - 1.6);

      ctx.restore();
    }
    ctx.restore();
  }

  function updateAndDrawCityParticles(dt, grid, gridSize) {
    smokeSpawnTimer += dt;
    coinSpawnTimer += dt;

    if (smokeSpawnTimer > 0.25) {
      smokeSpawnTimer = 0;
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const bId = getCellBuildingId(grid[y][x]);
          if ((bId === 'industrial' || bId === 'power_plant' || bId === 'arms_factory') && Math.random() < 0.45) {
            smokeParticles.push({
              x: x * TILE_SIZE + 16 + Math.random() * 18,
              y: y * TILE_SIZE + 12,
              vx: 6 + Math.random() * 8,
              vy: -14 - Math.random() * 10,
              r: 3.5 + Math.random() * 3,
              alpha: 0.65,
              color: bId === 'industrial' ? '148, 163, 184' : '226, 232, 240'
            });
          }
        }
      }
    }

    if (coinSpawnTimer > 1.3) {
      coinSpawnTimer = 0;
      const econTiles = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const cell = grid[y][x];
          const bId = getCellBuildingId(cell);
          if ((bId === 'commercial' || bId === 'seaport' || bId === 'airport') && cell.powered !== false) {
            econTiles.push({ x, y, bId, level: getCellLevel(cell) });
          }
        }
      }
      if (econTiles.length > 0) {
        const pick = econTiles[Math.floor(Math.random() * econTiles.length)];
        const base = pick.bId === 'airport' ? 70 : (pick.bId === 'seaport' ? 45 : 16 * (pick.level || 1));
        floatingTexts.push({
          x: (pick.x + 0.5) * TILE_SIZE,
          y: (pick.y + 0.3) * TILE_SIZE,
          text: `+${base}₺`,
          color: '#facc15',
          alpha: 1,
          vy: -22
        });
      }
    }

    ctx.save();
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const p = smokeParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += dt * 4;
      p.alpha -= dt * 0.38;
      if (p.alpha <= 0) {
        smokeParticles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.alpha -= dt * 0.65;
      if (ft.alpha <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = clamp(ft.alpha, 0, 1);
      ctx.font = 'bold 11px "Inter", "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.lineWidth = 3;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color || '#facc15';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawHoveredTileAndToolPreview(prov, gx, gy, isNight) {
    const tx = gx * TILE_SIZE;
    const ty = gy * TILE_SIZE;
    const cx = tx + TILE_SIZE / 2;
    const cy = ty + TILE_SIZE / 2;
    const tool = SoH.state && SoH.state.selectedTool;
    const cell = prov.grid[gy][gx];
    const gridSize = prov.grid.length || 14;

    ctx.save();

    if (!tool) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
      ctx.lineWidth = 2;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.restore();
      return;
    }

    if (tool === 'bulldoze') {
      ctx.fillStyle = 'rgba(239, 68, 68, 0.38)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚜', cx, cy);
      ctx.restore();
      return;
    }

    if (tool === 'upgrade') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⬆️', cx, cy);
      ctx.restore();
      return;
    }

    const bCfg = SoH.CONFIG && SoH.CONFIG.BUILDINGS && SoH.CONFIG.BUILDINGS[tool];
    if (bCfg) {
      const radiusMap = {
        power_plant: { r: 5.0 * TILE_SIZE, color: '#facc15' },
        water_tower: { r: 5.0 * TILE_SIZE, color: '#38bdf8' },
        park: { r: 3.2 * TILE_SIZE, color: '#10b981' },
        hospital: { r: 4.0 * TILE_SIZE, color: '#38bdf8' },
        industrial: { r: 2.5 * TILE_SIZE, color: '#c026d3' }
      };
      if (radiusMap[tool]) {
        const rInfo = radiusMap[tool];
        ctx.beginPath();
        ctx.arc(cx, cy, rInfo.r, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(rInfo.color, 0.12);
        ctx.fill();
        ctx.strokeStyle = hexToRgba(rInfo.color, 0.85);
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.save();
      ctx.globalAlpha = 0.68;
      if (tool === 'road') {
        drawRoadTile(prov.grid, gx, gy, tx, ty, gridSize, isNight);
      } else {
        drawProceduralBuilding(tool, 1, tx, ty, gx, gy, { powered: true, watered: true }, isNight);
      }
      ctx.restore();

      const playerNat = SoH.state && SoH.state.nations && SoH.state.nations[getPlayerNationId()];
      const currentGold = playerNat ? playerNat.gold : (SoH.state ? SoH.state.gold : 9999);
      const canAfford = currentGold === undefined || currentGold >= bCfg.cost;
      const isOccupied = Boolean(getCellBuildingId(cell));
      const validPlace = canAfford && !isOccupied;

      ctx.strokeStyle = validPlace ? '#4ade80' : '#f87171';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(tx + 1.5, ty + 1.5, TILE_SIZE - 3, TILE_SIZE - 3);

      const costStr = `${bCfg.icon} -${bCfg.cost}₺`;
      ctx.font = 'bold 10.5px "Inter", "Segoe UI", sans-serif';
      const tagW = ctx.measureText(costStr).width + 14;
      roundRectPath(ctx, cx - tagW / 2, ty - 20, tagW, 17, 4);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.fill();
      ctx.strokeStyle = validPlace ? '#4ade80' : '#f87171';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = validPlace ? '#86efac' : '#fca5a5';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(costStr, cx, ty - 11.5);
    }

    ctx.restore();
  }

  // ============================================================================
  // INPUT & MOUSE / WHEEL INTERACTION HANDLERS
  // ============================================================================

  function bindEvents() {
    if (!canvas) return;

    window.addEventListener('resize', () => {
      SoH.Renderer.resize();
    });

    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (SoH.state) {
        if (SoH.state.selectedTool) {
          SoH.state.selectedTool = null;
          if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
          if (SoH.UI && typeof SoH.UI.onToolSelected === 'function') SoH.UI.onToolSelected(null);
        }
        if (SoH.state.armyMoveSourceId) {
          SoH.state.armyMoveSourceId = null;
          if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
        }
      }
    });

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.downX = pointer.x;
      pointer.downY = pointer.y;
      pointer.lastX = pointer.x;
      pointer.lastY = pointer.y;
      pointer.isDown = true;
      pointer.isDragging = false;
      pointer.button = e.button;
    });

    window.addEventListener('mousemove', e => {
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;

      if (pointer.isDown) {
        const dx = pointer.x - pointer.lastX;
        const dy = pointer.y - pointer.lastY;
        if (Math.hypot(pointer.x - pointer.downX, pointer.y - pointer.downY) > 5) {
          pointer.isDragging = true;
        }
        if (pointer.isDragging) {
          const mode = (SoH.state && SoH.state.viewMode) || 'world';
          if (mode === 'world') {
            worldCam.targetX += dx;
            worldCam.targetY += dy;
            worldCam.x += dx;
            worldCam.y += dy;
          } else {
            cityCam.targetX += dx;
            cityCam.targetY += dy;
            cityCam.x += dx;
            cityCam.y += dy;
          }
        }
        pointer.lastX = pointer.x;
        pointer.lastY = pointer.y;
      }

      if (!SoH.state || SoH.state.viewMode !== 'city') {
        const wp = screenToWorld(pointer.x, pointer.y);
        const provinces = getAllProvinces();
        let foundId = null;
        for (let i = provinces.length - 1; i >= 0; i--) {
          if (pointInPolygon(wp.x, wp.y, provinces[i].polygon)) {
            foundId = provinces[i].id;
            break;
          }
        }
        pointer.hoveredProvinceId = foundId;
        canvas.style.cursor = foundId ? 'pointer' : (pointer.isDragging ? 'grabbing' : 'grab');
      } else {
        canvas.style.cursor = pointer.isDragging ? 'grabbing' : 'pointer';
      }
    });

    window.addEventListener('mouseup', () => {
      if (!pointer.isDown) return;
      const wasDragging = pointer.isDragging;
      const btn = pointer.button;
      pointer.isDown = false;
      pointer.isDragging = false;

      if (wasDragging || btn !== 0) return;

      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'world') {
        handleWorldClick();
      } else {
        handleCityClick();
      }
    });

    canvas.addEventListener('dblclick', e => {
      e.preventDefault();
      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'world' && pointer.hoveredProvinceId) {
        SoH.state.selectedProvinceId = pointer.hoveredProvinceId;
        SoH.state.viewMode = 'city';
        SoH.Renderer.centerCityMap(true);
        if (SoH.UI) {
          if (typeof SoH.UI.onProvinceSelected === 'function') {
            SoH.UI.onProvinceSelected(pointer.hoveredProvinceId);
          }
          if (typeof SoH.UI.switchViewMode === 'function') {
            SoH.UI.switchViewMode('city');
          } else if (typeof SoH.UI.update === 'function') {
            SoH.UI.update();
          }
        }
      }
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const zoomFactor = e.deltaY < 0 ? 1.14 : 0.88;
      const mode = (SoH.state && SoH.state.viewMode) || 'world';

      if (mode === 'world') {
        const nextZoom = clamp(worldCam.targetZoom * zoomFactor, 0.42, 3.2);
        const ratio = nextZoom / worldCam.targetZoom;
        worldCam.targetX = mx - (mx - worldCam.targetX) * ratio;
        worldCam.targetY = my - (my - worldCam.targetY) * ratio;
        worldCam.targetZoom = nextZoom;
      } else {
        const nextZoom = clamp(cityCam.targetZoom * zoomFactor, 0.55, 2.4);
        const ratio = nextZoom / cityCam.targetZoom;
        cityCam.targetX = mx - (mx - cityCam.targetX) * ratio;
        cityCam.targetY = my - (my - cityCam.targetY) * ratio;
        cityCam.targetZoom = nextZoom;
      }
    }, { passive: false });
  }

  function handleWorldClick() {
    if (!SoH.state) return;
    const clickedId = pointer.hoveredProvinceId;
    if (!clickedId) {
      if (SoH.state.armyMoveSourceId) {
        SoH.state.armyMoveSourceId = null;
        if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
      }
      return;
    }

    const clickedProv = getProvince(clickedId);
    if (!clickedProv) return;

    if (SoH.state.armyMoveSourceId) {
      const sourceProv = getProvince(SoH.state.armyMoveSourceId);
      if (sourceProv && Array.isArray(sourceProv.neighbors) && sourceProv.neighbors.includes(clickedProv.id)) {
        const sendTroops = Math.floor((sourceProv.garrison || 0) * 0.7);
        if (SoH.Simulation && typeof SoH.Simulation.orderArmyAction === 'function') {
          SoH.Simulation.orderArmyAction(SoH.state.armyMoveSourceId, clickedProv.id, sendTroops);
        }
        SoH.state.armyMoveSourceId = null;
        if (SoH.UI && typeof SoH.UI.update === 'function') SoH.UI.update();
        return;
      }
      SoH.state.armyMoveSourceId = null;
    }

    SoH.state.selectedProvinceId = clickedProv.id;
    if (SoH.UI && typeof SoH.UI.onProvinceSelected === 'function') {
      SoH.UI.onProvinceSelected(clickedProv.id);
    } else if (SoH.UI && typeof SoH.UI.update === 'function') {
      SoH.UI.update();
    }
  }

  function handleCityClick() {
    if (!SoH.state || !pointer.hoveredTile) return;
    const prov = getProvince(SoH.state.selectedProvinceId);
    if (!prov || !prov.grid) return;

    const gx = pointer.hoveredTile.x;
    const gy = pointer.hoveredTile.y;
    const cell = prov.grid[gy][gx];
    const tool = SoH.state.selectedTool;

    if (tool === 'bulldoze') {
      if (SoH.Simulation && typeof SoH.Simulation.bulldoze === 'function') {
        SoH.Simulation.bulldoze(prov.id, gx, gy);
      }
    } else if (tool === 'upgrade') {
      if (SoH.Simulation && typeof SoH.Simulation.upgradeBuilding === 'function') {
        SoH.Simulation.upgradeBuilding(prov.id, gx, gy);
      }
    } else if (tool && SoH.CONFIG && SoH.CONFIG.BUILDINGS && SoH.CONFIG.BUILDINGS[tool]) {
      if (SoH.Simulation && typeof SoH.Simulation.placeBuilding === 'function') {
        const ok = SoH.Simulation.placeBuilding(prov.id, gx, gy, tool);
        if (ok !== false) {
          const bCfg = SoH.CONFIG.BUILDINGS[tool];
          SoH.Renderer.spawnFloatingText(`-${bCfg.cost}₺`, (gx + 0.5) * TILE_SIZE, gy * TILE_SIZE, '#fca5a5');
        }
      }
    } else {
      pointer.selectedTile = { x: gx, y: gy };
      if (SoH.UI && typeof SoH.UI.onTileClicked === 'function') {
        SoH.UI.onTileClicked(gx, gy, cell);
      }
    }

    if (SoH.UI && typeof SoH.UI.update === 'function') {
      SoH.UI.update();
    }
  }

  // ============================================================================
  // PUBLIC API (SoH.Renderer)
  // ============================================================================

  SoH.Renderer = {
    init: function () {
      canvas = document.getElementById('game-canvas');
      container = document.getElementById('canvas-container') || (canvas && canvas.parentElement);
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      initProvinceDecorations();
      this.resize();
      // Center initial camera nicely on Türkiye, Europe & Middle East (x: 1120, y: 345, zoom: 1.35)
      this.focusRegion(1120, 345, 1.35, true);
      this.centerCityMap(true);
      bindEvents();

      if (!animFrameId) {
        lastTime = performance.now();
        const loop = (now) => {
          const dt = Math.min(0.1, (now - lastTime) / 1000);
          lastTime = now;
          elapsed += dt;
          this.render(dt);
          animFrameId = requestAnimationFrame(loop);
        };
        animFrameId = requestAnimationFrame(loop);
      }
    },

    resize: function () {
      if (!canvas) return;
      container = document.getElementById('canvas-container') || canvas.parentElement;
      const rect = container
        ? container.getBoundingClientRect()
        : { width: window.innerWidth, height: window.innerHeight };

      width = Math.max(320, Math.floor(rect.width || window.innerWidth));
      height = Math.max(240, Math.floor(rect.height || window.innerHeight));
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      if (ctx) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    },

    focusRegion: function (wx, wy, zoom, immediate) {
      const z = clamp(zoom || 1.35, 0.45, 3.0);
      const tx = width / 2 - wx * z;
      const ty = height / 2 - wy * z;
      worldCam.targetZoom = z;
      worldCam.targetX = tx;
      worldCam.targetY = ty;
      if (immediate) {
        worldCam.zoom = z;
        worldCam.x = tx;
        worldCam.y = ty;
      }
    },

    centerWorldMap: function (immediate) {
      const mapW = (SoH.CONFIG && SoH.CONFIG.MAP_WIDTH) || 2000;
      const mapH = (SoH.CONFIG && SoH.CONFIG.MAP_HEIGHT) || 1050;
      const scaleX = (width * 0.94) / mapW;
      const scaleY = (height * 0.90) / mapH;
      const fitZoom = clamp(Math.min(scaleX, scaleY), 0.45, 1.4);
      const tx = (width - mapW * fitZoom) / 2;
      const ty = (height - mapH * fitZoom) / 2;

      worldCam.targetZoom = fitZoom;
      worldCam.targetX = tx;
      worldCam.targetY = ty;
      if (immediate) {
        worldCam.zoom = fitZoom;
        worldCam.x = tx;
        worldCam.y = ty;
      }
    },

    centerCityMap: function (immediate) {
      const gridSize = (SoH.CONFIG && SoH.CONFIG.GRID_SIZE) || 14;
      const boardPx = gridSize * TILE_SIZE;
      const fitZoom = clamp(Math.min((width * 0.85) / boardPx, (height * 0.83) / boardPx), 0.65, 1.35);
      const tx = (width - boardPx * fitZoom) / 2;
      const ty = (height - boardPx * fitZoom) / 2;

      cityCam.targetZoom = fitZoom;
      cityCam.targetX = tx;
      cityCam.targetY = ty;
      if (immediate) {
        cityCam.zoom = fitZoom;
        cityCam.x = tx;
        cityCam.y = ty;
      }
    },

    focusProvince: function (provId) {
      const prov = getProvince(provId);
      if (!prov || !prov.center) return;
      const z = clamp(Math.max(worldCam.targetZoom, 1.35), 0.8, 2.2);
      worldCam.targetZoom = z;
      worldCam.targetX = width / 2 - prov.center.x * z;
      worldCam.targetY = height / 2 - prov.center.y * z;
    },

    spawnFloatingText: function (text, x, y, color) {
      floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color || '#facc15',
        alpha: 1,
        vy: -24
      });
    },

    render: function (dt) {
      if (!ctx) return;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const mode = (SoH.state && SoH.state.viewMode) || 'world';
      if (mode === 'city') {
        renderCityMode(dt || 0.016);
      } else {
        renderWorldMode(dt || 0.016);
      }
      ctx.restore();
    }
  };
})();

  play(type) {
    if (this.muted) return;
    try {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);

      if (type === 'build') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'bulldoze') {

        gain.gain.setValueAtTime(0.07, now);

        osc.frequency.setValueAtTime(220, now);

        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

};

  },

  init() {

        const spd = parseInt(btn.dataset.speed, 10);

        document.querySelectorAll('.spd-btn').forEach((b) =>
          b.classList.toggle('active', parseInt(b.dataset.speed, 10) === spd)
        );
        this.restartLoop();
      });
    });

    document.querySelectorAll('.s-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        SoH.Audio.play('click');
        this.activeTab = tab.dataset.tab;
        document.querySelectorAll('.s-tab').forEach((t) =>
          t.classList.toggle('active', t.dataset.tab === this.activeTab)
        );
        this.renderSidebar();
      });
    });
  },

  setViewMode(mode) {
    if (!SoH.state) return;
    SoH.state.viewMode = mode;
    if (mode === 'world') {
      SoH.state.selectedTool = null;
      this.updateDockSelection();
      const tip = document.getElementById('tile-tooltip');
      if (tip) tip.style.display = 'none';
    }
    document.querySelectorAll('.mode-btn').forEach((b) =>
      b.classList.toggle('active', b.dataset.mode === mode)
    );
    const cityDock = document.getElementById('city-dock');
    if (cityDock) {
      cityDock.style.display = mode === 'city' ? 'flex' : 'none';
    }
    this.renderLeftOverlays();
    this.refresh();
  },

  jumpCamera(region) {
    if (!SoH.Renderer) return;
    if (SoH.state.viewMode !== 'world') this.setViewMode('world');
    if (region === 'turkiye' && SoH.Renderer.focusProvince) {
      SoH.Renderer.focusProvince('tr_ankara');
    } else if (region === 'europe' && SoH.Renderer.focusProvince) {
      SoH.Renderer.focusProvince('de_berlin');
    } else if (region === 'asia' && SoH.Renderer.focusProvince) {
      SoH.Renderer.focusProvince('cn_pekin');
    } else if (region === 'america' && SoH.Renderer.focusProvince) {
      SoH.Renderer.focusProvince('us_washington');
    } else if (SoH.Renderer.centerWorldMap) {
      SoH.Renderer.centerWorldMap();
    }
  },

  onTick() {
    this.updateTopBar();
    this.renderLogs();
    if (SoH.state.tickCount % 2 === 0) {
      this.renderSidebar();
    }
  },

  onProvinceSelected(provId) {
    SoH.Audio.play('click');
    SoH.state.selectedProvinceId = provId;
    this.inspectedTile = null;
    this.refresh();
  },

  onTileHover(gx, gy, cell) {
    const tip = document.getElementById('tile-tooltip');
    if (!tip) return;
    const prov = SoH.state.provinces[SoH.state.selectedProvinceId];
    if (!cell || SoH.state.viewMode !== 'city') {
      tip.style.display = 'none';
      return;
    }
    tip.style.display = 'block';
    const b = cell.building ? SoH.CONFIG.BUILDINGS[cell.building.type] : null;
    const tool = SoH.state.selectedTool ? SoH.CONFIG.BUILDINGS[SoH.state.selectedTool] : null;

    tip.innerHTML = `
      <div style="font-weight:800;color:#38bdf8;margin-bottom:3px;">
        📍 ${prov ? (prov.cityName || prov.name) : ''} — Parsel [${gx}, ${gy}]
      </div>
      ${
        b
          ? `<div style="font-weight:700;color:#fff;">${b.icon} ${b.name} (Seviye ${cell.building.level || 1})</div>
             <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">
               ⚡ Elektrik: <b style="color:${cell.powered ? '#34d399' : '#fb7185'}">${cell.powered ? 'Aktif' : 'Kesik'}</b> |
               💧 Su: <b style="color:${cell.watered ? '#34d399' : '#fb7185'}">${cell.watered ? 'Aktif' : 'Kesik'}</b> |
               🛣️ Yol: <b>${cell.roadConnected ? 'Bağlı' : 'Uzak'}</b>
             </div>`
          : `<div style="color:#94a3b8;font-size:11.5px;">Boş İmar Parseli (Arsa Değeri: ${cell.landValue || 50} | Kirlilik: ${Math.round(cell.pollution || 0)})</div>`
      }
      ${
        tool
          ? `<div style="margin-top:5px;padding-top:4px;border-top:1px solid rgba(148,163,184,0.2);font-size:11px;color:#fbbf24;">
               🔨 Seçili: <b>${tool.icon} ${tool.name}</b> (🪙 ${tool.cost})
             </div>`
          : ''
      }
    `;
  },

  onTileClicked(gx, gy, cell) {
    this.inspectedTile = { x: gx, y: gy, cell };
    this.renderSidebar();
  },

  refresh() {
    if (!SoH.state) return;
    this.updateTopBar();
    this.renderLeftOverlays();
    this.renderSidebar();
    this.renderLogs();
    this.updateDockSelection();
  },

  updateTopBar() {
    const st = SoH.state;
    if (!st || !st.nations) return;
    const pid = this.getPlayerId();
    const p = this.getPlayerNation();

    // Update top-left crest & nation name
    const crestEl = document.getElementById('player-crest');
    if (crestEl) {
      crestEl.textContent = p.flag || p.bannerIcon || '🇹🇷';
      crestEl.style.background = p.color || '#e11d48';
      crestEl.style.borderColor = p.borderColor || '#fda4af';
    }
    const nationSubEl = document.getElementById('player-nation-label');
    if (nationSubEl) {
      nationSubEl.textContent = `${p.name} • Dünya & Şehir Stratejisi`;
    }

    let totalPop = 0;
    let netGold = 0;
    let netFood = 0;
    let avgHap = 0;
    let provCount = 0;
    let totalTroops = 0;

    Object.values(st.provinces).forEach((pr) => {
      if (pr.owner === pid) {
        provCount++;
        totalPop += pr.population || 0;
        netGold += (pr.goldIncome || 0) - (pr.maintenance || 0);
        netFood += pr.foodNet || 0;
        avgHap += pr.happiness || 75;
        totalTroops += pr.garrison || 0;
      }
    });
    if (provCount > 0) avgHap = Math.round(avgHap / provCount);

    const setEl = (id, html) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    };

    setEl('val-gold', Math.floor(p.gold).toLocaleString('tr-TR'));
    setEl('sub-gold', `${netGold >= 0 ? '+' : ''}${Math.round(netGold)} /gün`);
    const subGoldEl = document.getElementById('sub-gold');
    if (subGoldEl) subGoldEl.className = `res-sub ${netGold >= 0 ? 'pos' : 'neg'}`;

    setEl('val-pop', totalPop.toLocaleString('tr-TR'));
    setEl('sub-pop', `${provCount} Eyalet`);

    setEl('val-manpower', `${Math.floor(p.manpower).toLocaleString('tr-TR')}`);
    setEl('sub-manpower', `🛡️ ${(totalTroops * 100).toLocaleString('tr-TR')} Asker`);

    setEl('val-food', Math.floor(p.food).toLocaleString('tr-TR'));
    setEl('sub-food', `${netFood >= 0 ? '+' : ''}${Math.round(netFood)} gıda`);

    setEl('val-research', Math.floor(p.research).toLocaleString('tr-TR'));
    setEl('sub-research', `Mutluluk %${avgHap}`);

    const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
    setEl('date-display', `📅 ${st.day} ${months[(st.month - 1) % 12]} ${st.year}`);
  },
